# WebGoatPHP served from its document root, as README.md and vagrant_bootstrap.sh
# describe it: the repository is the document root, .htaccess is honoured and
# mod_rewrite is on.
ServerName localhost

<VirtualHost *:80>
	DocumentRoot /app

	<Directory /app>
		Options FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
