; PHP settings for the WebGoatPHP deployment. These are the php.ini-production
; defaults for error presentation plus the sizes the application needs.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
date.timezone = UTC
memory_limit = 512M
post_max_size = 16M
upload_max_filesize = 16M
max_execution_time = 120
session.save_path = /tmp
opcache.revalidate_freq = 0
