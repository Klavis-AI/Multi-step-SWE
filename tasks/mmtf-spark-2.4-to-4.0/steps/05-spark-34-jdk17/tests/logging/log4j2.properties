# Pinned so that no rung depends on the logging default its own Spark version
# happened to ship. Spark 3.3.4 ships a log4j2-defaults.properties whose console
# appender targets SYSTEM_OUT; 3.0/3.2 (log4j 1.x) target System.err and 3.4
# reverted to SYSTEM_ERR. The 3.3 rung therefore put 70,988 framework log lines
# into the 105,017 lines of stdout the census recorded, and 29 of 140 jobs
# "changed behavior" between 3.2 and 3.3 because a log line landed in the
# recording -- including multi-line log messages whose continuation lines carry
# no level prefix for norm.py to match ("[rdd_1_0]"). See NOTES 4.9.5.
#
# This file is Spark 3.4.x's own log4j2-defaults.properties, copied verbatim; the
# 3.3 and 3.4 files differ only in the appender name and that one target. Both
# frameworks are configured here because the tree being measured is migrated
# across the log4j 1.x -> log4j2 boundary: log4j 1.x reads log4j.properties and
# ignores log4j2.properties, and log4j2 does the reverse, so shipping both needs
# no per-version branch. $SPARK_CONF_DIR precedes the jars on the classpath, so
# these win over the built-in defaults.
