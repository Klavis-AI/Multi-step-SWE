[package]
edition = "2024"
name = "iceberg"
rust-version = "1.85"
version = "0.5.1"

categories = ["database"]
description = "Dependency-graph stand-in for the verifier image prefetch"
keywords = ["iceberg"]
license = "Apache-2.0"

[features]
default = ["storage-memory", "storage-fs", "storage-s3", "tokio"]
storage-all = ["storage-memory", "storage-fs", "storage-s3", "storage-gcs"]

storage-fs = ["opendal/services-fs"]
storage-gcs = ["opendal/services-gcs"]
storage-memory = ["opendal/services-memory"]
storage-oss = ["opendal/services-oss"]
storage-s3 = ["opendal/services-s3"]

async-std = ["dep:async-std"]
tokio = ["tokio/rt-multi-thread"]

[dependencies]
anyhow = { version = "1.0.72" }
apache-avro = { version = "0.17" }
array-init = { version = "2" }
arrow-arith = { version = "55" }
arrow-array = { version = "55" }
arrow-buffer = { version = "55" }
arrow-cast = { version = "55" }
arrow-ord = { version = "55" }
arrow-schema = { version = "55" }
arrow-select = { version = "55" }
arrow-string = { version = "55" }
async-std = { version = "1.12", optional = true, features = ["attributes"] }
async-trait = { version = "0.1.88" }
base64 = { version = "0.22.1" }
bimap = { version = "0.6" }
bytes = { version = "1.10" }
chrono = { version = "0.4.40" }
derive_builder = { version = "0.20" }
fnv = { version = "1.0.7" }
futures = { version = "0.3" }
itertools = { version = "0.13" }
moka = { version = "0.12.10", features = ["future"] }
murmur3 = { version = "0.5.2" }
num-bigint = { version = "0.4.6" }
once_cell = { version = "1.20" }
opendal = { version = "0.53.0" }
ordered-float = { version = "4" }
parquet = { version = "55", features = ["async"] }
rand = { version = "0.8.5" }
reqwest = { version = "0.12.12", default-features = false, features = ["json"] }
roaring = { version = "0.10.12" }
rust_decimal = { version = "1.37.1" }
serde = { version = "1.0.210", features = ["rc"] }
serde_bytes = { version = "0.11.15" }
serde_derive = { version = "1.0.210" }
serde_json = { version = "1.0.138" }
serde_repr = { version = "0.1.16" }
serde_with = { version = "3.4" }
thrift = { version = "0.17.0" }
tokio = { version = "1.44", default-features = false, optional = false, features = ["sync"] }
typed-builder = { version = "0.20" }
url = { version = "2.5.4" }
uuid = { version = "1.16", features = ["v7"] }
zstd = { version = "0.13.2" }

[package.metadata.cargo-machete]
# These dependencies are added to ensure minimal dependency version
ignored = ["tap"]
