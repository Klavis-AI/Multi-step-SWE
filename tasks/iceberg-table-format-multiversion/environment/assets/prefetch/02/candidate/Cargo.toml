[package]
name = "iceberg"
version = "0.3.0"
edition = "2021"
rust-version = "1.77.1"

categories = ["database"]
description = "Dependency-graph stand-in for the verifier image prefetch"
license = "Apache-2.0"
keywords = ["iceberg"]

[features]
default = ["storage-memory", "storage-fs", "storage-s3", "tokio"]
storage-all = ["storage-memory", "storage-fs", "storage-s3", "storage-gcs"]

storage-memory = ["opendal/services-memory"]
storage-fs = ["opendal/services-fs"]
storage-s3 = ["opendal/services-s3"]
storage-gcs = ["opendal/services-gcs"]

async-std = ["dep:async-std"]
tokio = ["dep:tokio"]

[dependencies]
anyhow = { version = "1.0.72" }
apache-avro = { version = "0.17" }
array-init = { version = "2" }
arrow-arith = { version = "52" }
arrow-array = { version = "52" }
arrow-ord = { version = "52" }
arrow-schema = { version = "52" }
arrow-select = { version = "52" }
arrow-string = { version = "52" }
async-std = { version = "1.12", optional = true, features = ["attributes"] }
async-trait = { version = "0.1" }
bimap = { version = "0.6" }
bitvec = { version = "1.0.1" }
bytes = { version = "1.5" }
chrono = { version = "0.4.34" }
derive_builder = { version = "0.20" }
fnv = { version = "1" }
futures = { version = "0.3" }
itertools = { version = "0.13" }
murmur3 = { version = "0.5.2" }
once_cell = { version = "1" }
opendal = { version = "0.49" }
ordered-float = { version = "4" }
parquet = { version = "52", features = ["async"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rust_decimal = { version = "1.31" }
serde = { version = "1", features = ["rc"] }
serde_bytes = { version = "0.11.8" }
serde_derive = { version = "1" }
serde_json = { version = "1" }
serde_repr = { version = "0.1.16" }
serde_with = { version = "3.4" }
tokio = { version = "1", default-features = false, optional = true }
typed-builder = { version = "0.19" }
url = { version = "2" }
uuid = { version = "1.6.1", features = ["v7"] }

