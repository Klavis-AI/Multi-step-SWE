[package]
name = "iceberg"
version = "0.2.0"
edition = "2021"

categories = ["database"]
description = "Dependency-graph stand-in for the verifier image prefetch"
license = "Apache-2.0"
keywords = ["iceberg"]

[dependencies]
anyhow = { version = "1.0.72" }
apache-avro = { version = "0.16" }
arrow-arith = { version = "52" }
arrow-array = { version = "52" }
arrow-schema = { version = "52" }
async-trait = { version = "0.1" }
bimap = { version = "0.6" }
bitvec = { version = "1.0.1" }
chrono = { version = "0.4" }
derive_builder = { version = "0.13.0" }
either = { version = "1" }
futures = { version = "0.3" }
itertools = { version = "0.12" }
lazy_static = { version = "1" }
log = { version = "^0.4" }
murmur3 = { version = "0.5.2" }
once_cell = { version = "1" }
opendal = { version = "0.45" }
ordered-float = { version = "4.0.0" }
reqwest = { version = "^0.11", features = ["json"] }
rust_decimal = { version = "1.31.0" }
serde = { version = "^1.0", features = ["rc"] }
serde_bytes = { version = "0.11.8" }
serde_derive = { version = "^1.0" }
serde_json = { version = "^1.0" }
serde_repr = { version = "0.1.16" }
serde_with = { version = "3.4.0" }
typed-builder = { version = "^0.18" }
url = { version = "2" }
urlencoding = { version = "2" }
uuid = { version = "1.6.1" }

