[global]
	workgroup = WORKGROUP
	netbios name = SMBSRV
	server string = smbd
	security = user
	passdb backend = smbpasswd:/scratch/nt1/private/smbpasswd
	private dir = /scratch/nt1/private
	lock directory = /scratch/nt1/lock
	state directory = /scratch/nt1/state
	cache directory = /scratch/nt1/cache
	interfaces = 127.0.0.1/8
	bind interfaces only = yes
	smb ports = 14451
	log file = /scratch/nt1/log.smbd
	log level = 0
	map to guest = never
	server min protocol = NT1
	server max protocol = NT1
	server signing = auto
	smb encrypt = off
	unix extensions = no
	strict locking = no
	store dos attributes = yes
	ea support = yes
	nt acl support = yes
	kernel oplocks = no
	posix locking = no
	create mask = 0777
	directory mask = 0777

[tmp]
	path = /scratch/nt1/shares/tmp
	read only = no
	guest ok = no

[ro]
	path = /scratch/nt1/shares/ro
	read only = yes
	guest ok = no
