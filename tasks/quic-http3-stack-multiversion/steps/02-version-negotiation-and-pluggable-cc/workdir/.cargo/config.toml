# BoringSSL is prebuilt into the image; your build script must link it
# rather than fetch or compile one. Nothing else in this container sets this
# variable, so keep this file: without it a build script that reads
# QUICHE_BSSL_PATH has nothing to link against. The grader sets the same
# variable in its own environment.
[env]
QUICHE_BSSL_PATH = "/opt/bssl/1e859054"
