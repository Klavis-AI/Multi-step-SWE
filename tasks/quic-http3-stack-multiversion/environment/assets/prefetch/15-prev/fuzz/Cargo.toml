[package]
autobins = false
autoexamples = false
autotests = false
autobenches = false

name = "quiche-fuzz"
version = "0.1.0"
authors = ["Alessandro Ghedini <alessandro@ghedini.me>"]
edition = "2018"
publish = false

[package.metadata]
cargo-fuzz = true

[profile.dev]
opt-level = 3

[dependencies]
env_logger = "0.11"
libfuzzer-sys = "0.4"
quiche = { path = "../quiche", features = ["fuzzing"] }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = true
debug-assertions = true
overflow-checks = true
