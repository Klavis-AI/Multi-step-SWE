# Starter workspace. Two members so that engine internals and the shell that
# drives them can evolve separately; neither layout nor these names are
# graded, and you may restructure the workspace however you like as long as
# the build still installs the shell at the documented path.
[workspace]
members = ["core", "cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[profile.release]
debug = false
