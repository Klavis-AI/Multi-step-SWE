[package]
name = "engine_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# The installed file must be named `limbo`; the crate producing it need not
# be. Renaming this crate is fine, renaming the binary is not.
[[bin]]
name = "limbo"
path = "src/main.rs"

[dependencies]
engine_core = { path = "../core" }
