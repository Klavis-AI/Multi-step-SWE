schema_version = "1.4"

# Trial reward = the mean of each step's `reward`.  No min_reward gate, so every
# milestone runs and each verifier reports a step-local score.
multi_step_reward_strategy = "mean"

# Required with a separate verifier: the only way the cumulative /app reaches the
# verifier container.  The verifier rebuilds the server from source, so build
# products are excluded.
artifacts = [
  { source = "/app", destination = "workspace", exclude = [] },
]

[task]
name = "harbor/postgres-server-version-chain"
version = "1.0.0"
description = "Build a PostgreSQL-compatible server in C and carry it from the 9.6 wire/SQL surface to 18, one major release per milestone."
authors = [{ name = "Klavis AI", email = "connect@klavis.ai" }]
keywords = ["postgresql", "wire-protocol", "sql", "multi-step", "version-upgrade"]

[metadata]
difficulty = "very hard"
category = "programming"
tags = ["postgresql", "database", "protocol", "c", "multi-step"]

[environment]
build_timeout_sec = 1800.0
cpus = 7
memory_mb = 16384
storage_mb = 20480
gpus = 0
mcp_servers = []
workdir = "/app"
# Public only for image setup: the runner installs the agent harness under this
# baseline. The agent phase has no network; see [agent].
network_mode = "public"

[verifier]
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 7
memory_mb = 16384
storage_mb = 20480
gpus = 0
workdir = "/app"
network_mode = "public"

# No network while the agent works (the solution's solve.sh runs in this phase
# too): everything a solution needs is installed in environment/Dockerfile.
# Runs must let the agent reach its model API: `--allow-agent-host <api host>`.
[agent]
network_mode = "no-network"

# Milestone 1 -- PostgreSQL 9.6
[[steps]]
name = "01-pg96"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

