// Scorer-owned, and never near the candidate's tree: this project exists only
// at verifier-image build time, to pull the step-02 TEST toolchain into the
// image's Gradle cache so that grading resolves nothing from the network. Its
// sibling, warm/, does the same for the reactor's own dependency set; they are
