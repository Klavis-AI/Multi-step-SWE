# Workspace root. `cargo build` here builds the workspace's default members,
# which is the `icechunk` library crate; the verifier builds exactly this way.
# Keep the package name, the member path and the default-members entry: the
# verifier's driver crate links `icechunk = { path = "/app/icechunk" }`.
[workspace]
members = ["icechunk"]
default-members = ["icechunk"]
resolver = "2"

[workspace.lints.clippy]
expect_used = "warn"
unwrap_used = "warn"
panic = "warn"
