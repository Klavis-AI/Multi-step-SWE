schema_version = "1.4"

# Trial reward = the mean of the eleven steps' `reward` values. There is no
# min_reward gate, so no step can abort the trial: every step runs and every
# verifier reports its OWN milestone's reward - 1 when every one of that step's
# scored groups passed, else 0 - never a running total and never a credit for
# a predecessor.
multi_step_reward_strategy = "mean"

# A separate verifier receives the cumulative source only through this declared
# artifact. The verifier rebuilds from source, so no agent build output is
# required in the snapshot.
artifacts = [
  { source = "/app", destination = "workspace", exclude = [".git", ".git/**", "target", "target/**", "**/target/**", ".venv", ".venv/**", "node_modules", "**/node_modules/**"] },
]

[task]
name = "harbor/icechunk-array-store-multiversion"
version = "1.0.0"
description = "Implement Icechunk, a transactional versioned storage engine for chunked N-dimensional array data on object storage, as a Rust library, CLI and on-disk format across eleven cumulative upstream releases: the spec-1 repository format, sessions and conflict rebase, expiration and garbage collection, the FlatBuffers format, the CLI and expiration accounting, manifest splitting and format 1.0, the asynchronous API, backends and reliability, the Icechunk 2 table of contents, spec 2.1, and header reporting and hardening."
authors = [{ name = "Klavis AI", email = "connect@klavis.ai" }]
keywords = ["icechunk", "zarr", "object-storage", "transactions", "rust", "multi-step", "conformance"]

[metadata]
difficulty = "very hard"
category = "programming"
tags = ["icechunk", "rust", "storage-engine", "file-format", "flatbuffers", "versioning", "multi-step"]

[environment]
build_timeout_sec = 2400.0
cpus = 4
memory_mb = 8192
storage_mb = 24576
gpus = 0
mcp_servers = []
workdir = "/app"
# The build phase keeps the public network; the agent phase below is an
# allowlist restricted to the runner's inference endpoint.
network_mode = "public"

# Grade each step in an isolated verifier container built from that step's
# tests/Dockerfile. The cumulative /app artifact is restored into the image
# before /tests/test.sh runs.
[agent]
# The agent's work runs against an allowlist: only the inference endpoint is
# reachable at the network layer, so upstream sources, releases and package
# registries cannot be fetched by any route. The runner adds its own inference
# host at launch; the image already contains everything the build needs.
network_mode = "allowlist"

[verifier]
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 5400.0
cpus = 4
memory_mb = 8192
storage_mb = 24576
gpus = 0
workdir = "/app"
# The verifier image carries its own pinned toolchain and a Cargo registry cache
# pre-populated with this step's exact shipped dependency graph, so grading does
# not depend on a live network for anything the task ships. A dependency the
# candidate adds to its own manifest is fetched at grading time.
network_mode = "public"

[[steps]]
name = "01-spec1-repository-format"
[steps.agent]
# Keep synchronized with environment/timer.sh and this step's instruction.
timeout_sec = 7200.0
[steps.verifier]
# Worst case, from test.sh's own named budgets: 1800 s (candidate build)
# + 1200 s (the --features cli build) + 1500 s (RESOLVE_BUDGET) + 2x1200 s (the
# two driver targets) + 2400 s (ATTRIB_BUDGET, the per-group compile
# attribution a candidate only reaches when the aggregate target fails)
# = 9300 s of setup before a single scored group runs, then one 900 s
# `cargo test` per scored group. This step declares 18 groups, so the bound is
# 9300 + 900 x 18 = 25500 s.
# A kill part way through grading records every group not yet reached as FAIL;
# test.sh traps SIGTERM, so such a kill still writes a COMPLETE scorecard and
# the loss is silent, which is why the budget has to cover every group.
timeout_sec = 25500.0

