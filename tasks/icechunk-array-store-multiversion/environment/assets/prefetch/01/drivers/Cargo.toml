# Verifier-owned driver crate. Built in a throw-away directory outside /app and
# linked to the candidate by path; the candidate's manifest is never modified.
[package]
name = "icechunk-verifier"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
icechunk = { path = "../candidate/icechunk" }
bytes = { version = "1", features = ["serde"] }
futures = "0.3"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "gate"
path = "tests/gate.rs"
