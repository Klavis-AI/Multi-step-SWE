schema_version = "1.4"

# Trial reward = the mean of each step's `reward`. A step's reward is
# `correctness x mean_f( ln(max(1, speedup_f)) )` over the functions in its
# scope -- i.e. correctness x ln(geometric mean of the per-function speedups).
# Correctness is binary and multiplies, so a tree that changes behaviour scores
# 0 however fast it is; a correct but unimproved tree scores 0 too.
multi_step_reward_strategy = "mean"

artifacts = [
  { source = "/app", destination = "workspace", exclude = ["build"] },
]

[task]
name = "harbor/mlkem-native-avx2-arith"
version = "1.0.0"
description = "Optimize mlkem-native's AVX2 arithmetic backend one primitive group at a time. Seven cumulative steps, each rewarded by the measured per-function speedup of the entry points the library installs, gated on byte-identical ML-KEM output."
authors = [{ name = "Klavis AI", email = "connect@klavis.ai" }]
keywords = ["performance", "optimization", "simd", "avx2", "ml-kem", "post-quantum", "multi-step"]

[metadata]
difficulty = "very hard"
category = "programming"
tags = ["performance-optimization", "multi-step", "c", "assembly", "avx2", "cryptography"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []
workdir = "/app"
network_mode = "public"

[verifier]
environment_mode = "separate"

# The verifier builds the candidate for three parameter sets, runs the
# project's functional and known-answer suites on it, rebuilds it once more
# with this step's dispatch neutralised for the non-regression gate, and times
# every scoped entry point in both trees. cpus must stay >= 2 because
# measurement pins to cores 0 and 1.
[verifier.environment]
build_timeout_sec = 2700.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
workdir = "/app"
network_mode = "public"

[[steps]]
name = "01-rejection-sampling"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "02-ntt-domain"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "03-reduce-tomont"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "04-compress-dv"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "05-compress-du"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "06-decompress-dv"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "07-decompress-du"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[agent]
# The agent's work runs against an allowlist: only the inference endpoint is
# reachable at the network layer, so an upstream copy cannot be fetched by any
# route -- git, release tarball, package registry or docs mirror. The runner
# merges its own model host in at launch, so no host is pinned here.
network_mode = "allowlist"
