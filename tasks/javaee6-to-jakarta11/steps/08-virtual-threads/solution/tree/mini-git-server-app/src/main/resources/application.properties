# Handle HTTP requests on virtual threads.
#
# Boot reads this at the embedded container's protocol handler: Tomcat is
# given a virtual-thread executor instead of its fixed `http-nio-*-exec-*`
# pool, so a request that blocks on a repository, a socket or a lock parks a
# continuation rather than occupying one of a few hundred platform threads.
# The SSH side is not auto-configured -- only the web context is -- and builds
# its queues itself in WorkQueue.
spring.threads.virtual.enabled=true
