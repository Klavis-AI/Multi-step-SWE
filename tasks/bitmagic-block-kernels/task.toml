schema_version = "1.4"

# Trial reward = the mean of each step's `reward`. Each step's reward is
# binary and correctness-gated: 1 only when the tree is bit-exact and its
# geometric-mean speedup is above this step's oracle baseline, 0 otherwise.
multi_step_reward_strategy = "mean"

# Required with a separate test image: the only way the cumulative /app reaches
# the test container. Build output is excluded so the checks rebuild from source;
# nothing else is dropped, because a candidate's own headers and build system
# changes must survive.
artifacts = [
  { source = "/app", destination = "workspace", exclude = ["build"] },
]

[task]
name = "harbor/bitmagic-block-kernels"
version = "1.0.0"
description = "Optimize BitMagic's bit-block kernel layer one kernel family at a time: the hand-written AVX2 primitives under its compressed bitmap index, measured per entry point against the portable C++ reference and gated on bit-exact output."
authors = [{ name = "Klavis AI", email = "connect@klavis.ai" }]
keywords = ["performance", "optimization", "simd", "avx2", "bitmap", "multi-step"]

[metadata]
difficulty = "very hard"
category = "programming"
tags = ["performance-optimization", "multi-step", "cpp", "simd", "data-structures"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []
workdir = "/app"
network_mode = "public"

# Check each step in its own container, built from steps/<name>/tests/Dockerfile
# with steps/<name>/tests/ as the build context.
[verifier]
environment_mode = "separate"

# The test image clones the pinned upstream tree, strips all ten kernel
# families out of it, builds it with the project's own CMake suite, and runs
# that suite to record the base's own failures -- that is the denominator, and
# it is measured here rather than assumed.
[verifier.environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
workdir = "/app"
network_mode = "public"

# Each step's verifier timeout is a ceiling, sized for the harness builds, the
# per-entry dumps, the project suite build and run, and the timed comparisons.
[[steps]]
name = "01-bool-algebra"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 7200.0

[[steps]]
name = "02-bit-to-gap"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 7200.0

[[steps]]
name = "03-block-shift"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 7200.0

[[steps]]
name = "04-xor-similarity"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 7200.0

[[steps]]
name = "05-change-count"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 7200.0

[[steps]]
name = "06-index-scatter"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 7200.0

[agent]
# The agent's work runs against an allowlist: only the inference endpoint is
# reachable at the network layer, so an upstream copy cannot be fetched by any
# route -- git, release tarball, package registry or docs mirror. The runner
# merges its own model host in at launch, so no host is pinned here.
network_mode = "allowlist"
