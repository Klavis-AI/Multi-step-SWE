schema_version = "1.4"
multi_step_reward_strategy = "mean"
artifacts = [
  { source = "/app", destination = "workspace", exclude = [
      ".git", ".git/**",
      "build", "build/**", "_build", "_build/**",
      "cmake-build-*", "cmake-build-*/**",
      "**/CMakeFiles/**", "**/*.o", "**/*.a", "**/*.so", "**/*.so.*",
  ] },
]

[task]
name = "harbor/pdal-point-cloud-multiversion"
version = "1.0.0"
description = "Seven cumulative steps over PDAL 2.0.1: implement each upstream release from 2.1.0 to 2.7.1, including its migrations, graded through the pdal CLI."
authors = [{ name = "Klavis AI", email = "connect@klavis.ai" }]
keywords = ["pdal", "point-cloud", "las", "copc", "multi-step"]

[metadata]
difficulty = "very hard"
category = "programming"
tags = ["c++", "geospatial", "cli", "multi-step", "cumulative"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 20480
gpus = 0
mcp_servers = []
workdir = "/app"
network_mode = "public"

[agent]
# The agent's work runs against an allowlist: only the inference endpoint is
# reachable at the network layer, so an upstream copy cannot be fetched by any
# route -- git, release tarball, package registry or docs mirror. The runner
# merges its own model host in at launch, so no host is pinned here.
network_mode = "allowlist"

[verifier]
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 20480
gpus = 0
workdir = "/app"
network_mode = "public"

[[steps]]
name = "01-stage-cohort"

[steps.agent]
timeout_sec = 14400.0

[steps.verifier]
timeout_sec = 15000.0

[[steps]]
name = "02-where-expressions"

[steps.agent]
timeout_sec = 14400.0

[steps.verifier]
timeout_sec = 15000.0

[[steps]]
name = "03-eval-and-chamfer"

[steps.agent]
timeout_sec = 14400.0

[steps.verifier]
timeout_sec = 15000.0

[[steps]]
name = "04-copc"

[steps.agent]
timeout_sec = 14400.0

[steps.verifier]
timeout_sec = 15000.0

[[steps]]
name = "05-overwrite-guard"

[steps.agent]
timeout_sec = 14400.0

[steps.verifier]
timeout_sec = 15000.0

[[steps]]
name = "06-classflags-split"

[steps.agent]
timeout_sec = 14400.0

[steps.verifier]
timeout_sec = 15000.0

[[steps]]
name = "07-griddecimation-and-assign"

[steps.agent]
timeout_sec = 14400.0

[steps.verifier]
timeout_sec = 15000.0
