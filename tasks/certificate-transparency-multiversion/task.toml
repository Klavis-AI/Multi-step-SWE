schema_version = "1.4"

# Trial reward = the mean of each step's `reward`. There is no min_reward
# gate, so every step runs and each verifier reports a step-local score.
multi_step_reward_strategy = "mean"

# The cumulative /app is the only channel from the agent phase to the verifier
# container. Build output is excluded so the verifier rebuilds from source and
# cannot be handed a candidate-built binary.
artifacts = [
  { source = "/app", destination = "workspace", exclude = [".git/**", "bin/**", "**/*.test"] },
]

[task]
name = "harbor/certificate-transparency-multiversion"
version = "1.0.0"
description = "Implement google/certificate-transparency-go — the RFC 6962 Certificate Transparency stack and CT front end — across thirteen cumulative upstream releases, v1.0 through v1.3.3."
authors = [{ name = "Klavis AI", email = "connect@klavis.ai" }]
keywords = ["certificate-transparency", "rfc6962", "go", "x509", "tls-codec", "multi-step"]

[metadata]
difficulty = "very hard"
category = "programming"
tags = ["certificate-transparency", "rfc6962", "cryptography", "x509", "go", "multi-step"]

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 12288
storage_mb = 30720
gpus = 0
mcp_servers = []
workdir = "/app"
network_mode = "public"

[agent]
# The agent's work runs against an allowlist: only the inference endpoint is
# reachable at the network layer, so an upstream copy cannot be fetched by any
# route -- git, release tarball, package registry or docs mirror. The runner
# merges its own model host in at launch, so no host is pinned here.
network_mode = "allowlist"

[verifier]
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 12288
storage_mb = 30720
gpus = 0
workdir = "/app"
network_mode = "public"

# `[steps.verifier].timeout_sec` = 5400.0 is a POLICY budget, not a sum of worst
# cases. steps/NN-*/tests/test.sh is the same driver in every step, and its
# `timeout` values are defensive per-operation ceilings, not expected durations:
#   fixture integrity + go.mod staging                          ~60 s
#   candidate package build sweep        `timeout 1500`         1500 s
#   per group: driver build `timeout 900` + run `timeout 600`   1500 s x N
#   scoring, reward_details.json, teardown                      ~60 s
# N reaches 23 (steps 02 and 08), so the arithmetic worst case is far above any
# budget worth granting. Those ceilings bound a single hung operation; they are
# never all reached at once. Measured: the Oracle ladder grades all thirteen
# steps in about 26 minutes end to end -- roughly 2 minutes per step, well
# inside a single per-operation ceiling.
# 5400.0 is therefore chosen so a candidate can lose several groups to hangs and
# still be graded on the rest. A step that exceeds it is a failed run and scores
# 0. Recorded author assumption: this trades exact grading of a pathologically
# hung candidate for a bounded ladder, which is the right trade for a benchmark.
# `[steps.agent].timeout_sec` = 7200.0 is the separate solve budget.

[[steps]]
name = "01-rfc6962-stack"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 5400.0

[[steps]]
name = "02-multiple-backends"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 5400.0

