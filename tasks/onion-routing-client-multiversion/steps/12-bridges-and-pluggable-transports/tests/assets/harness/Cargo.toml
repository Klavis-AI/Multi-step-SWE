# Conformance driver for step 12 (bridges and pluggable transports).
#
# Built outside /app and path-linked to the candidate's crates; the literal
# @@APP@@ below is substituted with the candidate tree at grading time.
[package]
name = "step12-driver"
version = "0.0.0"
edition = "2021"
publish = false
autotests = false

[dependencies]
safelog        = { path = "@@APP@@/crates/safelog" }
tor-bytes      = { path = "@@APP@@/crates/tor-bytes" }
tor-cell       = { path = "@@APP@@/crates/tor-cell" }
tor-checkable  = { path = "@@APP@@/crates/tor-checkable" }
tor-chanmgr    = { path = "@@APP@@/crates/tor-chanmgr", features = ["pt-client"] }
tor-config     = { path = "@@APP@@/crates/tor-config" }
tor-error      = { path = "@@APP@@/crates/tor-error" }
tor-guardmgr   = { path = "@@APP@@/crates/tor-guardmgr", features = ["bridge-client", "pt-client"] }
tor-linkspec   = { path = "@@APP@@/crates/tor-linkspec", features = ["pt-client"] }
tor-llcrypto   = { path = "@@APP@@/crates/tor-llcrypto" }
tor-netdoc     = { path = "@@APP@@/crates/tor-netdoc", features = ["routerdesc"] }
tor-proto      = { path = "@@APP@@/crates/tor-proto" }
tor-ptmgr      = { path = "@@APP@@/crates/tor-ptmgr" }
tor-rtcompat   = { path = "@@APP@@/crates/tor-rtcompat", features = ["tokio", "native-tls"] }
tor-socksproto = { path = "@@APP@@/crates/tor-socksproto", features = ["client-handshake", "proxy-handshake"] }
tor-units      = { path = "@@APP@@/crates/tor-units" }

# Version pin, not a graded dependency. `tor-llcrypto` asks for x25519-dalek
# "2.0.0-pre.1"; a caret requirement on a pre-release also admits the later
# 2.0.x releases, where `StaticSecret` moved behind a feature gate. The
# checkpoint pins the pre-release in its own Cargo.lock, but this driver is
# resolved independently of it, so it has to pin the same version itself.
x25519-dalek = "=2.0.0-pre.1"

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
hex = "0.4"
hex-literal = "0.3"
serde_json = "1"
toml = "0.5"

