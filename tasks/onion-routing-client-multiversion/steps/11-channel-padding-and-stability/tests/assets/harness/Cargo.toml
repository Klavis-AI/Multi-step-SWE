[package]
name = "step11-driver"
version = "0.0.0"
edition = "2021"
publish = false
autotests = false

[dependencies]
fs-mistrust     = { path = "@@APP@@/crates/fs-mistrust" }
tor-basic-utils = { path = "@@APP@@/crates/tor-basic-utils" }
tor-bytes       = { path = "@@APP@@/crates/tor-bytes" }
tor-cell        = { path = "@@APP@@/crates/tor-cell", features = ["testing"] }
tor-chanmgr     = { path = "@@APP@@/crates/tor-chanmgr" }
tor-config      = { path = "@@APP@@/crates/tor-config" }
tor-error       = { path = "@@APP@@/crates/tor-error" }
tor-linkspec    = { path = "@@APP@@/crates/tor-linkspec" }
tor-llcrypto    = { path = "@@APP@@/crates/tor-llcrypto" }
tor-netdir      = { path = "@@APP@@/crates/tor-netdir", features = ["testing"] }
tor-proto       = { path = "@@APP@@/crates/tor-proto" }
tor-protover    = { path = "@@APP@@/crates/tor-protover" }
tor-rtcompat    = { path = "@@APP@@/crates/tor-rtcompat" }
tor-units       = { path = "@@APP@@/crates/tor-units" }

[dev-dependencies]
async-trait = "0.1"
futures     = "0.3"
hex         = "0.4"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

