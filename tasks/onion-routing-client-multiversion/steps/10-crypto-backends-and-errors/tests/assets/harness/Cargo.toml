[package]
name = "step10-driver"
version = "0.0.0"
edition = "2021"
publish = false
autotests = false

# NOTE ON FEATURES
#
# This manifest deliberately requests no cargo feature that is absent from the
# previous checkpoint's tree. `cargo metadata` validates every `<dep>/<feature>`
# reference eagerly -- even one reached only through a feature this driver never
# enables -- so naming, say, `tor-cert/encode` here would make dependency
# resolution fail outright against a candidate that has not yet added it. The
# runner treats a resolution failure as "every group fails", which would sink the
# inherited tier as well. Feature-set milestones are therefore graded by reading
# the candidate crates' own `[features]` tables at run time; see
# `tests/common/mod.rs`.

[dependencies]
arti-client = { path = "@@APP@@/crates/arti-client" }
safelog = { path = "@@APP@@/crates/safelog" }
fs-mistrust = { path = "@@APP@@/crates/fs-mistrust" }
tor-basic-utils = { path = "@@APP@@/crates/tor-basic-utils" }
tor-bytes = { path = "@@APP@@/crates/tor-bytes" }
tor-cell = { path = "@@APP@@/crates/tor-cell" }
tor-cert = { path = "@@APP@@/crates/tor-cert" }
tor-chanmgr = { path = "@@APP@@/crates/tor-chanmgr" }
tor-config = { path = "@@APP@@/crates/tor-config" }
tor-checkable = { path = "@@APP@@/crates/tor-checkable" }
tor-circmgr = { path = "@@APP@@/crates/tor-circmgr" }
tor-dirmgr = { path = "@@APP@@/crates/tor-dirmgr" }
tor-error = { path = "@@APP@@/crates/tor-error" }
tor-guardmgr = { path = "@@APP@@/crates/tor-guardmgr" }
tor-linkspec = { path = "@@APP@@/crates/tor-linkspec" }
tor-llcrypto = { path = "@@APP@@/crates/tor-llcrypto" }
tor-netdir = { path = "@@APP@@/crates/tor-netdir" }
tor-netdoc = { path = "@@APP@@/crates/tor-netdoc" }
tor-persist = { path = "@@APP@@/crates/tor-persist" }
tor-proto = { path = "@@APP@@/crates/tor-proto" }

[dev-dependencies]
# Version pin, not a test helper: `tor-llcrypto` asks for
# `x25519-dalek = "2.0.0-pre.1"`, and that requirement also matches the later
# 2.0.x releases, which dropped `StaticSecret`. The candidate workspace has its
# own lockfile to keep it on the pre-release; this driver crate resolves
# separately and would otherwise pick 2.0.1 and fail to build tor-llcrypto.
x25519-dalek = "=2.0.0-pre.1"

bytes = "1"
cipher = "0.4.1"
config = { version = "0.13", default-features = false, features = ["toml"] }
digest = "0.10.0"
futures = "0.3"
hex = "0.4"
rand = "0.8"
serde_json = "1"
tempfile = "3"

