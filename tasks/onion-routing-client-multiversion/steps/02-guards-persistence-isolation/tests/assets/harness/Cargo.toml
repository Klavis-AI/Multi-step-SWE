[package]
name = "step02-driver"
version = "0.0.0"
edition = "2021"
publish = false
autotests = false

[lib]
name = "step02_driver"
path = "src/lib.rs"

[dependencies]
arti-client = { path = "@@APP@@/crates/arti-client" }
retry-error = { path = "@@APP@@/crates/retry-error" }
tor-bytes = { path = "@@APP@@/crates/tor-bytes" }
tor-cell = { path = "@@APP@@/crates/tor-cell" }
tor-circmgr = { path = "@@APP@@/crates/tor-circmgr" }
tor-config = { path = "@@APP@@/crates/tor-config" }
tor-guardmgr = { path = "@@APP@@/crates/tor-guardmgr" }
tor-linkspec = { path = "@@APP@@/crates/tor-linkspec" }
tor-llcrypto = { path = "@@APP@@/crates/tor-llcrypto" }
tor-netdir = { path = "@@APP@@/crates/tor-netdir", features = ["testing"] }
tor-netdoc = { path = "@@APP@@/crates/tor-netdoc", features = ["build_docs"] }
tor-persist = { path = "@@APP@@/crates/tor-persist", features = ["testing"] }
tor-protover = { path = "@@APP@@/crates/tor-protover" }
tor-rtcompat = { path = "@@APP@@/crates/tor-rtcompat", features = ["tokio"] }
tor-rtmock = { path = "@@APP@@/crates/tor-rtmock" }
tor-socksproto = { path = "@@APP@@/crates/tor-socksproto" }
tor-units = { path = "@@APP@@/crates/tor-units" }

[dev-dependencies]
async_executors = { version = "0.4.2", default-features = false, features = ["tokio_tp"] }
bytes = "1"
config = { version = "0.11.0", default-features = false, features = ["toml"] }
futures = "0.3.13"
hex = "0.4.3"
hex-literal = "0.3.1"
rand = "0.8.3"
serde = { version = "1.0.124", features = ["derive"] }
serde_json = "1.0.59"
tempfile = "3.2.0"

