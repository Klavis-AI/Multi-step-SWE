[package]
name = "autotests"
version = "0.0.0"
edition = "2018"
publish = false

# Every test is a standalone `tests/groups/*.rs` file driven by the
# generated `tests/conformance.rs`; we do not want cargo's own autodiscovery.
autotests = false

[dependencies]
anyhow = "1.0.23"
arti-client = { path = "@@APP@@/crates/arti-client", features = ["tokio", "native-tls", "rustls"] }
arti-config = { path = "@@APP@@/crates/arti-config" }
arti-hyper = { path = "@@APP@@/crates/arti-hyper" }
tor-bytes = { path = "@@APP@@/crates/tor-bytes" }
tor-cell = { path = "@@APP@@/crates/tor-cell" }
tor-chanmgr = { path = "@@APP@@/crates/tor-chanmgr" }
tor-circmgr = { path = "@@APP@@/crates/tor-circmgr" }
tor-config = { path = "@@APP@@/crates/tor-config" }
tor-dirclient = { path = "@@APP@@/crates/tor-dirclient" }
tor-dirmgr = { path = "@@APP@@/crates/tor-dirmgr" }
tor-error = { path = "@@APP@@/crates/tor-error" }
tor-netdoc = { path = "@@APP@@/crates/tor-netdoc" }
tor-persist = { path = "@@APP@@/crates/tor-persist" }
tor-proto = { path = "@@APP@@/crates/tor-proto" }
tor-rtcompat = { path = "@@APP@@/crates/tor-rtcompat", features = ["tokio", "native-tls", "rustls"] }
tor-socksproto = { path = "@@APP@@/crates/tor-socksproto" }

derive_more = "0.99"
futures = "0.3.14"
hex = "0.4"
http = "0.2"
hyper = "0.14"
tempfile = "3.3"
thiserror = "1"
tls-api = "0.7"
tls-api-native-tls = "0.7"
tokio = { version = "1.7", features = ["rt", "rt-multi-thread", "macros", "time"] }
tokio-util = { version = "0.7.0", features = ["compat"] }

[dev-dependencies]
serde_json = "1"

# >>> GENERATED TEST TARGETS (build-package.sh) - do not edit below
[[test]]
name = "conformance"
path = "tests/conformance.rs"
harness = true

