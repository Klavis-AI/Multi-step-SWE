[package]
name = "step01-driver"
version = "0.0.0"
edition = "2021"
publish = false
autotests = false

[dependencies]
tor-bytes = { path = "@@APP@@/tor-bytes" }
tor-cell = { path = "@@APP@@/tor-cell" }
tor-cert = { path = "@@APP@@/tor-cert" }
tor-checkable = { path = "@@APP@@/tor-checkable" }
tor-circmgr = { path = "@@APP@@/tor-circmgr" }
tor-consdiff = { path = "@@APP@@/tor-consdiff" }
tor-dirclient = { path = "@@APP@@/tor-dirclient" }
tor-dirmgr = { path = "@@APP@@/tor-dirmgr" }
tor-linkspec = { path = "@@APP@@/tor-linkspec" }
tor-llcrypto = { path = "@@APP@@/tor-llcrypto" }
tor-netdir = { path = "@@APP@@/tor-netdir" }
tor-netdoc = { path = "@@APP@@/tor-netdoc" }
tor-proto = { path = "@@APP@@/tor-proto" }
tor-protover = { path = "@@APP@@/tor-protover" }
tor-rtcompat = { path = "@@APP@@/tor-rtcompat" }
tor-socksproto = { path = "@@APP@@/tor-socksproto" }
tor-units = { path = "@@APP@@/tor-units" }

[dev-dependencies]
anyhow = "1"
base64 = "0.13"
bytes = "1"
digest = "0.9"
futures = "0.3"
hex = "0.4"
http = "0.2"
rand = "0.8"
tempfile = "3"

