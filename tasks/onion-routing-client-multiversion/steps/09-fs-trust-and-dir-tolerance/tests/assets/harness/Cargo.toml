[package]
name = "step09-driver"
version = "0.0.0"
edition = "2021"
publish = false
autotests = false
autobins = false
autoexamples = false
autobenches = false

[dependencies]
arti = { path = "@@APP@@/crates/arti" }
arti-client = { path = "@@APP@@/crates/arti-client" }
fs-mistrust = { path = "@@APP@@/crates/fs-mistrust", features = ["walkdir"] }
safelog = { path = "@@APP@@/crates/safelog" }
tor-checkable = { path = "@@APP@@/crates/tor-checkable" }
tor-config = { path = "@@APP@@/crates/tor-config" }
tor-dirclient = { path = "@@APP@@/crates/tor-dirclient" }
tor-dirmgr = { path = "@@APP@@/crates/tor-dirmgr" }
tor-error = { path = "@@APP@@/crates/tor-error" }
tor-netdoc = { path = "@@APP@@/crates/tor-netdoc" }
tor-persist = { path = "@@APP@@/crates/tor-persist" }
tor-proto = { path = "@@APP@@/crates/tor-proto" }
tor-rtcompat = { path = "@@APP@@/crates/tor-rtcompat", features = ["tokio", "native-tls"] }

[dev-dependencies]
regex = "1"
serde = { version = "1.0.103", features = ["derive"] }
tempfile = "3"
toml = "0.5"

