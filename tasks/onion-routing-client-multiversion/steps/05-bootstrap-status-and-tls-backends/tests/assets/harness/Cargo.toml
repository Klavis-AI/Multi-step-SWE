# Conformance driver for step 05 (bootstrap status and TLS backends).
#
# Feature note: this manifest deliberately names no feature of `tor-rtcompat`.
# The step-05 tree gates `tor_rtcompat::tokio`, `tor_rtcompat::async_std`,
# `PreferredRuntime`, `create_runtime()` and `current_user_runtime()` behind
# `any(native-tls, rustls)`, and those features are reached here through
# `arti-client`'s own default feature set (`tokio` + `native-tls`) plus its
# `async-std` feature.  Naming `native-tls` or `rustls` directly on the
# `tor-rtcompat` path dependency would make this manifest unresolvable against
# a workspace that has not added those features yet, which would zero every
# group -- including the inherited ones -- instead of only the groups that
# genuinely depend on the new capability.
[package]
name = "step05-driver"
version = "0.0.0"
edition = "2021"
publish = false
autotests = false

[dependencies]
arti-client = { path = "@@APP@@/crates/arti-client", features = ["async-std"] }
tor-chanmgr = { path = "@@APP@@/crates/tor-chanmgr" }
tor-circmgr = { path = "@@APP@@/crates/tor-circmgr" }
tor-config = { path = "@@APP@@/crates/tor-config", features = ["expand-paths"] }
tor-dirmgr = { path = "@@APP@@/crates/tor-dirmgr" }
tor-linkspec = { path = "@@APP@@/crates/tor-linkspec" }
tor-llcrypto = { path = "@@APP@@/crates/tor-llcrypto" }
tor-proto = { path = "@@APP@@/crates/tor-proto" }
tor-rtcompat = { path = "@@APP@@/crates/tor-rtcompat" }
tor-rtmock = { path = "@@APP@@/crates/tor-rtmock" }

[dev-dependencies]
futures = "0.3"
hex = "0.4"
toml = "0.5"

