# Conformance driver for step 03 (`03-reactor-and-events`).
#
# Built in a throw-away directory outside the candidate workspace and
# path-linked to the candidate's crates. `@@APP@@` is substituted with the
# workspace root at grading time; never write an absolute path here.
[package]
name = "step03-driver"
version = "0.0.0"
edition = "2021"
publish = false
autotests = false

[dependencies]
# --- candidate crates graded by this step -------------------------------
arti-config  = { path = "@@APP@@/crates/arti-config" }
arti-client  = { path = "@@APP@@/crates/arti-client" }
tor-config   = { path = "@@APP@@/crates/tor-config", features = ["expand-paths"] }
tor-events   = { path = "@@APP@@/crates/tor-events" }
tor-proto    = { path = "@@APP@@/crates/tor-proto", features = ["traffic-timestamp"] }
tor-cell     = { path = "@@APP@@/crates/tor-cell" }
tor-circmgr  = { path = "@@APP@@/crates/tor-circmgr" }
tor-persist  = { path = "@@APP@@/crates/tor-persist" }
tor-guardmgr = { path = "@@APP@@/crates/tor-guardmgr" }
tor-dirclient = { path = "@@APP@@/crates/tor-dirclient", features = ["routerdesc"] }
tor-llcrypto = { path = "@@APP@@/crates/tor-llcrypto" }

# --- third-party crates the graded surface is expressed in --------------
config = { version = "0.11.0", default-features = false, features = ["toml"] }

[dev-dependencies]
futures = "0.3"
http = "0.2"
serde_json = "1"
tempfile = "3"
hex = "0.4"

