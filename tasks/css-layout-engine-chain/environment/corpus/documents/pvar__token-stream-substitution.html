<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: substitution happens on the token stream, before parsing</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef }
.b { background: #cfc; height: 20px }
html { --half: 50%; --minus: - ; --twenty: 20px }
</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: calc(var(--half) - var(--twenty))"></div>
  <div class="b" id="e2" style="--expr: 100px + 50px; width: calc(var(--expr))"></div>
  <div class="b" id="e3" style="--parts: 30px 60px; margin: var(--parts); width: 100px"></div>
</div>
