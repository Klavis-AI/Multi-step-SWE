<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: flex-basis wins over width for the base size</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }

</style>

<div class="f" id="c1">
  <div class="i" id="e1" style="width: 300px; flex-basis: 100px; flex-shrink: 0"></div>
  <div class="i" id="e2" style="width: 50px; flex-basis: auto; flex-shrink: 0"></div>
</div>
<div class="f" id="c2">
  <div class="i" id="e3" style="width: 120px; flex: 0 0 auto"></div>
  <div class="i" id="e4" style="width: 120px; flex: 0 0 60px"></div>
</div>
