<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: align-items across its values</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }
.f { height: 120px } .i { width: 60px }
</style>

<div class="f" id="c1" style="align-items: flex-start">
  <div class="i" id="e1" style="height: 30px"></div>
  <div class="i" id="e2" style="height: 50px"></div>
</div>
<div class="f" id="c2" style="align-items: flex-end">
  <div class="i" id="e3" style="height: 30px"></div>
  <div class="i" id="e4" style="height: 50px"></div>
</div>
<div class="f" id="c3" style="align-items: center">
  <div class="i" id="e5" style="height: 30px"></div>
  <div class="i" id="e6" style="height: 50px"></div>
</div>
