<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: margins do not collapse through a flex container</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }
.f { height: auto } .i { width: 100px; height: 30px }
</style>

<div class="f" id="c1">
  <div class="i" id="e1" style="margin-top: 20px"></div>
  <div class="i" id="e2" style="margin-top: 40px"></div>
</div>
<div style="width: 400px; background: #ffe" id="c2">
  <div style="height: 10px; background: #cfc; margin-top: 20px" id="e3"></div>
</div>
