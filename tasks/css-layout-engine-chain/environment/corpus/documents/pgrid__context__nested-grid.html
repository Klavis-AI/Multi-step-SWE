<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: a grid item that is itself a grid container</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.g { display: grid; width: 400px; height: 120px; background: #eef }
.i { background: #cfc }
.t4 { grid-template-columns: 100px 100px 100px 100px; grid-template-rows: 60px 60px }
.g { height: 120px }
</style>

<div class="g" id="c1" style="grid-template-columns: 200px 200px; grid-template-rows: 120px">
  <div class="i" id="e1" style="display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 60px 60px">
    <div class="i" id="e2"></div>
    <div class="i" id="e3"></div>
    <div class="i" id="e4"></div>
  </div>
  <div class="i" id="e5"></div>
</div>
