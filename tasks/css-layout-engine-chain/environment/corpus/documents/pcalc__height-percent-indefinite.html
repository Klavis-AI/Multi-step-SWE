<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: a percentage inside calc() against an indefinite height</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }
.auto { width: 400px; background: #ffe }
</style>

<div class="auto" id="c1">
  <div class="b" id="e1" style="height: calc(50% + 30px)"></div>
  <div class="b" id="e2" style="height: calc(30px)"></div>
  <div class="b" id="e3" style="min-height: calc(20% + 40px)"></div>
</div>
