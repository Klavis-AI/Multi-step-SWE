<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: min-height: auto on a column item</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }
.fc { display: flex; flex-direction: column; width: 200px; height: 120px; background: #eef }
</style>

<div class="fc" id="c1">
  <div class="i" id="e1" style="flex: 1 1 auto; height: 200px; min-height: 80px"></div>
  <div class="i" id="e2" style="flex: 1 1 auto; height: 200px; min-height: 0"></div>
</div>
