<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: nowrap lets the items overflow instead of wrapping</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }

</style>

<div class="f" id="c1" style="flex-wrap: nowrap">
  <div class="i" id="e1" style="flex: 0 0 250px"></div>
  <div class="i" id="e2" style="flex: 0 0 250px"></div>
</div>
