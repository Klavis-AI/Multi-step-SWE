<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: flex-grow distributes free space in proportion</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }

</style>

<div class="f" id="c1">
  <div class="i" id="e1" style="flex: 1 1 0%"></div>
  <div class="i" id="e2" style="flex: 2 1 0%"></div>
  <div class="i" id="e3" style="flex: 1 1 0%"></div>
</div>
<div class="f" id="c2">
  <div class="i" id="e4" style="flex-grow: 1; flex-basis: 40px"></div>
  <div class="i" id="e5" style="flex-grow: 3; flex-basis: 40px"></div>
</div>
