<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: a custom property whose value is another var()</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef }
.b { background: #cfc; height: 20px }
html { --base: 80px; --derived: var(--base); --twice: calc(var(--base) * 2) }
</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: var(--derived)"></div>
  <div class="b" id="e2" style="width: var(--twice)"></div>
  <div class="b" id="e3" style="--base: 30px; width: var(--twice)"></div>
</div>
