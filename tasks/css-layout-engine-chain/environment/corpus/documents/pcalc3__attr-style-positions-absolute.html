<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: position and offsets delivered by an attribute-presence selector</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.col { float: left; position: relative; height: 180px; width: 6px; background: #eef; margin-right: 6px } div[style] { position: absolute; background: #cfc; height: 9px; width: 6px }
</style>

<div class="col" id="c1"><div style="top: calc(50px)" id="e1"></div></div>
<div class="col" id="c2"><div style="top: calc(25%)" id="e2"></div></div>
<div class="col" id="c3"><div style="top: calc(20px + 25%)" id="e3"></div></div>
<div class="col" id="c4"><div style="top: calc(150% / 2 - 40px)" id="e4"></div></div>
<div class="col" id="c5"><div style="bottom: calc(30px - 10%)" id="e5"></div></div>
<div class="col" id="c6"><div style="bottom: calc(25%)" id="e6"></div></div>
