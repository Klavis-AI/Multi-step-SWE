<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: stretch sizes an item only where its size is auto</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.g { display: grid; width: 400px; height: 120px; background: #eef }
.i { background: #cfc }
.t4 { grid-template-columns: 100px 100px 100px 100px; grid-template-rows: 60px 60px }
.g { height: 100px }
</style>

<div class="g" id="c1" style="grid-template-columns: 200px 200px; grid-template-rows: 100px; justify-items: stretch; align-items: stretch">
  <div class="i" id="e1"></div>
  <div class="i" id="e2" style="width: 50px; height: 30px"></div>
</div>
