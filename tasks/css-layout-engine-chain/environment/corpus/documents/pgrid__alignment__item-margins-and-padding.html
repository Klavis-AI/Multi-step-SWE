<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: an item's own margins and padding inside its area</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.g { display: grid; width: 400px; height: 120px; background: #eef }
.i { background: #cfc }
.t4 { grid-template-columns: 100px 100px 100px 100px; grid-template-rows: 60px 60px }
.g { height: 100px }
</style>

<div class="g" id="c1" style="grid-template-columns: 200px 200px; grid-template-rows: 100px; justify-items: start; align-items: start">
  <div class="i" id="e1" style="width: 60px; height: 40px; margin-left: 25px; margin-top: 15px"></div>
  <div class="i" id="e2" style="width: 60px; height: 40px; padding-left: 20px"></div>
</div>
