<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: var() in the padding and font shorthands</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef }
.b { background: #cfc; height: 20px }
html { --p: 12px; --fs: 24px }
</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: 100px; padding: var(--p)"></div>
  <div class="b" id="e2" style="width: 100px; padding: var(--p) 0 0 var(--p)"></div>
  <div class="b" id="e3" style="width: 100px; font: var(--fs) monospace"></div>
</div>
