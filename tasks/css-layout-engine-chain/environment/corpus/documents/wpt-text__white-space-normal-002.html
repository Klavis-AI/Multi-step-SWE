  <style type="text/css">
   * { white-space: normal; }
   div { display: block; }
   span { display: inline; }
   table { padding: 0; border-spacing: 0; border: solid; }
   td { font: 20px/1 Ahem; color: red; background: red; padding: 0; }
   .red { background: red; }
   .green { color: green; background: lime; }
   .check { width: 3em; background: lime; color: green; }
  </style>
 <style>@font-face { font-family: 'Ahem'; src: url('Ahem.ttf') format('truetype'); }</style></head>
 <body id="e1">
  <p id="e2">Test passes if there is a rectangle with 3 columns (1 dark green, 1 light green and then 1 dark green) and if there is <strong>no red</strong>.</p>
  <table id="e3">
   <tr id="e4">
    <td id="e5">
     <div class="red" id="e6">  </div>
     <div class="red" id="e7">  <div id="e8"></div></div>
     <div class="red" id="e9">  <div id="e10">  </div></div>
     <div class="red" id="e11"><div id="e12">  </div></div>
     <div class="red" id="e13"><div id="e14">  </div>  </div>
     <div class="red" id="e15"><div id="e16"></div>  </div>
     <div class="red" id="e17">  <div id="e18"></div>  </div>
     <div class="red" id="e19">  <div id="e20">  </div>  </div>
     <div class="green" id="e21"><span id="e22">X</span>  <span id="e23">X</span></div>
     <div class="green" id="e24">  <span id="e25">X</span>  <span id="e26">X</span></div>
     <div class="green" id="e27"><span id="e28">X</span>  <span id="e29">X</span>  </div>
     <div class="green" id="e30">  <div id="e31"></div>  <span id="e32">X</span>  <span id="e33">X</span>  </div>
     <div class="green" id="e34">  <span id="e35">X</span>  <span id="e36">X</span>  <div id="e37"></div>  </div>
     <div class="check" id="e38">X X</div>
    </td>
   </tr>
  </table>
 </body>
