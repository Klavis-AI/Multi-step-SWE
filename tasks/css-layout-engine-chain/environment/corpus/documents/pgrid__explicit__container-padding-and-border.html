<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: tracks are laid out inside the content box</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.g { display: grid; width: 400px; height: 120px; background: #eef }
.i { background: #cfc }
.t4 { grid-template-columns: 100px 100px 100px 100px; grid-template-rows: 60px 60px }

</style>

<div class="g" id="c1" style="grid-template-columns: 100px 100px; grid-template-rows: 60px; padding: 10px 20px; box-sizing: border-box">
  <div class="i" id="e1"></div>
  <div class="i" id="e2"></div>
</div>
<div class="g" id="c2" style="grid-template-columns: 100px 100px; grid-template-rows: 60px; border: 15px solid #333; box-sizing: border-box">
  <div class="i" id="e3"></div>
  <div class="i" id="e4"></div>
</div>
