<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: the one- and two-value gap shorthand</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.g { display: grid; width: 400px; height: 120px; background: #eef }
.i { background: #cfc }
.t4 { grid-template-columns: 100px 100px 100px 100px; grid-template-rows: 60px 60px }
.g { height: 140px }
</style>

<div class="g" id="c1" style="grid-template-columns: 100px 100px; grid-template-rows: 50px 50px; gap: 10px 30px">
  <div class="i" id="e1"></div>
  <div class="i" id="e2"></div>
  <div class="i" id="e3"></div>
  <div class="i" id="e4"></div>
</div>
<div class="g" id="c2" style="grid-template-columns: 100px 100px; grid-template-rows: 40px 40px; gap: 25px">
  <div class="i" id="e5"></div>
  <div class="i" id="e6"></div>
  <div class="i" id="e7"></div>
  <div class="i" id="e8"></div>
</div>
