schema_version = "1.4"

# Trial reward = the mean of each step's `reward`. No min_reward gate, so every
# step runs and each verifier reports a step-local score.
multi_step_reward_strategy = "mean"

# The cumulative /app workspace is the only thing that reaches the verifier
# container. The verifier rebuilds the remote end from source with `make` and
# grades the binary that build produces.
artifacts = [
  { source = "/app", destination = "workspace", exclude = [] },
]

[task]
name = "harbor/css-layout-engine-chain"
version = "1.0.0"
description = "Five-step CSS layout engine in C: carry one W3C WebDriver remote end from CSS 2.1 through calc(), custom properties and flex layout to CSS Grid Level 1, with fixtures that flip where a level changed the result."
authors = [{ name = "Klavis AI", email = "connect@klavis.ai" }]
keywords = ["css", "layout", "webdriver", "w3c", "multi-step"]

[metadata]
difficulty = "very hard"
category = "programming"
tags = ["css", "layout-engine", "webdriver", "c", "multi-step"]

[environment]
build_timeout_sec = 2400.0
cpus = 7
memory_mb = 16384
storage_mb = 20480
gpus = 0
mcp_servers = []
workdir = "/app"
# Public only for image setup: Harbor installs the agent harness under this
# baseline. The agent phase has no network; see [agent].
network_mode = "public"

[verifier]
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 2400.0
cpus = 7
memory_mb = 16384
storage_mb = 20480
gpus = 0
workdir = "/app"
network_mode = "public"

# No network while the agent works (the oracle's solve.sh runs in this phase
# too): everything a solution needs is installed in environment/Dockerfile.
# Runs must let the agent reach its model API: `--allow-agent-host <api host>`.
[agent]
network_mode = "no-network"

[[steps]]
name = "01-css21"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 2400.0

[[steps]]
name = "02-values-cascade3"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 2400.0

[[steps]]
name = "03-selectors3-vars"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 2400.0

[[steps]]
name = "04-flexbox"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 2400.0

[[steps]]
name = "05-grid1"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 2400.0
