<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: a percentage divided by a number</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef } .b { background: #cfc; height: 12px }
</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: calc(150% / 2 - 30px)"></div>
  <div class="b" id="e2" style="width: calc(80% / 4)"></div>
  <div class="b" id="e3" style="width: calc(200% / 8 + 10px)"></div>
  <div class="b" id="e4" style="width: calc(50% / 0.5 - 300px)"></div>
</div>
