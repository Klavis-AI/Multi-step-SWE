<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: relative offsets computed with calc()</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }
.cb2 { width: 400px; height: 200px; background: #eef } .r { position: relative; background: #cfc; width: 80px; height: 20px }
</style>

<div class="cb2" id="c1">
  <div class="r" id="e1" style="left: calc(10% - 8px)"></div>
  <div class="r" id="e2" style="right: calc(10% + 8px)"></div>
  <div class="r" id="e3" style="left: calc(25%); right: calc(50%)"></div>
  <div class="r" id="e4" style="top: calc(2em - 10px)"></div>
</div>
