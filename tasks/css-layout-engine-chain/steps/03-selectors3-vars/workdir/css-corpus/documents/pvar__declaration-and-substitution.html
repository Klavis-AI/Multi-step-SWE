<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: a custom property is retained and substituted</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef }
.b { background: #cfc; height: 20px }
html { --w: 120px; --m: 30px }
</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: var(--w)"></div>
  <div class="b" id="e2" style="width: var(--w); margin-left: var(--m)"></div>
  <div class="b" id="e3" style="--w: 200px; width: var(--w)"></div>
</div>
