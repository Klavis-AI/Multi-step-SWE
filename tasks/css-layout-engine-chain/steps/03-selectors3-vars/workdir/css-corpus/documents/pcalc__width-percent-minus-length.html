<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: width: calc(% - px) on blocks</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }

</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: calc(50% - 10px)"></div>
  <div class="b" id="e2" style="width: calc(25% + 25% - 40px)"></div>
  <div class="b" id="e3" style="width: calc(100% - 100px)"></div>
  <div class="b" id="e4" style="width: calc(12.5% * 2)"></div>
  <div class="b" id="e5" style="width: calc(2 * 12.5%)"></div>
  <div class="b" id="e6" style="width: calc(80% / 2)"></div>
</div>
