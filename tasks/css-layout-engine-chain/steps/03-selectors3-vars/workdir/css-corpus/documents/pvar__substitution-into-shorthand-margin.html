<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: var() substituted into the margin shorthand</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef }
.b { background: #cfc; height: 20px }
html { --m4: 10px 20px 30px 40px; --m1: 25px }
</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: 100px; margin: var(--m4)"></div>
  <div class="b" id="e2" style="width: 100px; margin: var(--m1)"></div>
  <div class="b" id="e3" style="width: 100px; margin: var(--m1) 0"></div>
</div>
