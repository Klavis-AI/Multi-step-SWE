<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: custom properties inherit to the nearest declaring ancestor</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef }
.b { background: #cfc; height: 20px }
.outer { --w: 100px } .mid { --w: 250px }
</style>

<div class="cb" id="c1">
  <div class="outer" id="e1">
    <div class="b" id="e2" style="width: var(--w)"></div>
    <div class="mid" id="e3">
      <div class="b" id="e4" style="width: var(--w)"></div>
    </div>
  </div>
</div>
