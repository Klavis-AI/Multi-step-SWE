<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: top and bottom: calc() on relatively positioned boxes</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 200px; height: 240px; background: #eef } .r { position: relative; background: #cfc; height: 6px }
</style>

<div class="cb" id="c1">
  <div class="r" id="e1" style="top: calc(25%)"></div>
  <div class="r" id="e2" style="top: calc(-10% + 40px)"></div>
  <div class="r" id="e3" style="top: calc(150% / 2 - 100px)"></div>
  <div class="r" id="e4" style="bottom: calc(40px + 10% - 20% / 2)"></div>
  <div class="r" id="e5" style="bottom: calc(20px - 5%)"></div>
</div>
