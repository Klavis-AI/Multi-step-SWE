<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: calc() with box-sizing: border-box</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }
.bb { box-sizing: border-box; background: #cfc; border: 10px solid #333 }
</style>

<div class="cb" id="c1">
  <div class="bb" id="e1" style="width: calc(50% - 20px); height: 40px"></div>
  <div class="bb" id="e2" style="width: calc(100% - 4em); height: calc(20% - 10px)"></div>
  <div class="bb" id="e3" style="width: 200px; padding-left: calc(5%); height: 30px"></div>
</div>
