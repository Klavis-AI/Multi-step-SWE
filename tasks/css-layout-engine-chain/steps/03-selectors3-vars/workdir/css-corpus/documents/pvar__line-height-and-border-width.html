<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: var() supplying line-height and border widths</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef }
.b { background: #cfc; height: 20px }
html { --lh: 28px; --bw: 7px }
</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="line-height: var(--lh); width: 90px"></div>
  <div class="b" id="e2" style="border: solid; border-width: var(--bw); width: 90px"></div>
  <div class="b" id="e3" style="border-top: var(--bw) solid black; width: 90px"></div>
  <div class="b" id="e4" style="line-height: var(--missing, 33px); width: 90px"></div>
</div>
