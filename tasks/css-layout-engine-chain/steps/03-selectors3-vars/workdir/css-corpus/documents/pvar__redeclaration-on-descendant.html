<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: a descendant redeclaration wins for its own subtree</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef }
.b { background: #cfc; height: 20px }
.lvl1 { --w: 100px } .lvl2 { --w: 200px } .lvl3 { --w: 300px }
</style>

<div class="cb" id="c1">
  <div class="lvl1" id="e1">
    <div class="b" id="e2" style="width: var(--w)"></div>
    <div class="lvl2" id="e3">
      <div class="b" id="e4" style="width: var(--w)"></div>
      <div class="lvl3" id="e5">
        <div class="b" id="e6" style="width: var(--w)"></div>
      </div>
    </div>
  </div>
</div>
