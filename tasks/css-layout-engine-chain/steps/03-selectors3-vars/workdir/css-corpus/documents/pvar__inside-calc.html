<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: var() substituted inside calc()</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef }
.b { background: #cfc; height: 20px }
html { --gap: 20px; --pct: 50% }
</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: calc(var(--gap) + 100px)"></div>
  <div class="b" id="e2" style="width: calc(var(--pct) - var(--gap))"></div>
  <div class="b" id="e3" style="width: calc(2 * var(--gap))"></div>
  <div class="b" id="e4" style="--half: calc(var(--pct) / 2); width: var(--half)"></div>
</div>
