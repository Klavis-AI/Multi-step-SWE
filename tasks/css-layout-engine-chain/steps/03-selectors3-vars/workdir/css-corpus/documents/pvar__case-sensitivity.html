<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: custom property names are case-sensitive</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef }
.b { background: #cfc; height: 20px }
html { --W: 60px; --w: 180px }
</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: var(--w)"></div>
  <div class="b" id="e2" style="width: var(--W)"></div>
  <div class="b" id="e3" style="width: var(--W, 33px)"></div>
</div>
