<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: bottom: calc() where the containing block's height comes from its content</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.col { float: left; width: 5px; background: #eef; margin-right: 5px } .cb { position: relative; background: #ffe } .space { height: 200px } .a { position: absolute; background: #cfc; height: 8px; width: 5px }
</style>

<div class="col" id="c1"><div class="cb" id="d1"><div class="a" id="e1" style="bottom: calc(25%)"></div><div class="space" id="s1"></div></div></div>
<div class="col" id="c2"><div class="cb" id="d2"><div class="a" id="e2" style="bottom: calc(150% / 2 - 40px)"></div><div class="space" id="s2"></div></div></div>
<div class="col" id="c3"><div class="cb" id="d3"><div class="a" id="e3" style="bottom: calc(40px + 10% - 20% / 2)"></div><div class="space" id="s3"></div></div></div>
