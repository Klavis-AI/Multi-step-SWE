<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: height: calc() with a percentage over a number</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.outer { width: 300px; height: 200px; background: #ffe } .b { background: #cfc }
</style>

<div class="outer" id="c1">
  <div class="b" id="e1" style="height: calc(150% / 2 - 50px)"></div>
  <div class="b" id="e2" style="height: calc(40px + 10% - 20% / 2)"></div>
  <div class="b" id="e3" style="height: calc(30px - 10%)"></div>
</div>
