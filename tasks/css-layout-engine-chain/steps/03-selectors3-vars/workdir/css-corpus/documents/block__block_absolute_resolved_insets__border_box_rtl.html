<!doctype html>
<html lang="en">
    <head>
        
        <style>

/* The Ahem font. See: https://github.com/Kozea/Ahem
   The "X" glyph in this font happens to be exactly 10 pixels wide by 10 high

   By combining X's with zero-width space characters (&#8203;) we can reliably set an elements
   min-content and max-content sizes.
*/
@font-face {
    font-family: 'ahem';
    src: url('Ahem.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}

/* Force Chrome to use space-taking scrollbars.
   The exact width (15px) must match the width assumed in the test runner */
::-webkit-scrollbar {
  width: 15px;
  height: 15px;
}

body {
  padding: 0;
  margin: 0;
}

div, span, img {
  box-sizing: border-box;
  position: relative;
  border: 0 solid red;
  margin: 0;
  padding: 0;
}

div {
  display: block;
}

body > * {
  position: absolute;
  border-color: red;
}

.viewport {
  display: block;
  
  
  /* Defaults: can be overridden in individual tests */
  width: auto;
  height: auto;
}

#test-root {
  font-family: ahem;
  line-height: 1;
  font-size: 10px;
  color: green;
}

.border-box, .border-box * {
  box-sizing: border-box;
}

.content-box, .content-box * {
  box-sizing: content-box;
}

.ltr * {
  direction: ltr;
}

.rtl * {
  direction: rtl;
}

div {
  background-color: #222;
}

div > div {
  background-color: #444;
}

div > div > div {
  background-color: #666;
}

div > div > div > div {
  background-color: #888;
}

div > div > div > div > div {
  background-color: #aaa;
}

div > div > div > div > div > div {
  background-color: #ccc;
}

div > div > div > div > div > div > div {
  background-color: #eee;
}
</style>
        <title>Test description</title>
    </head>
    <body class="border-box rtl" id="e1">
        <div id="test-root">
            <div
                style="display: block; width: 200px; height: 200px; border: 20px solid; padding: 15px; position: relative;"
             id="e2">
                <div style="position: absolute; top: auto; left: auto;" id="e3"></div>
                <div style="position: absolute; top: 0; left: 0;" id="e4"></div>
                <div style="position: absolute; top: 100%; left: 100%;" id="e5"></div>
                <div
                    style="position: absolute; bottom: 100%; right: 100%;"
                 id="e6"></div>
                <div style="position: absolute; top: 30px; left: 30px;" id="e7"></div>
                <div
                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
                 id="e8"></div>
            </div>

            <div
                style="display: block; width: 200px; height: 200px; border: 20px solid; padding: 15px; overflow: scroll; position: relative;"
             id="e9">
                <div style="position: absolute; top: auto; left: auto;" id="e10"></div>
                <div style="position: absolute; top: 0; left: 0;" id="e11"></div>
                <div style="position: absolute; top: 100%; left: 100%;" id="e12"></div>
                <div
                    style="position: absolute; bottom: 100%; right: 100%;"
                 id="e13"></div>
                <div style="position: absolute; top: 30px; left: 30px;" id="e14"></div>
                <div
                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
                 id="e15"></div>
            </div>
            <!-- Checks if "top: auto" resolves to the static y position -->
            <div
                style="display: block; width: 200px; height: 200px; border: 20px solid; padding: 15px; position: relative;"
             id="e16">
                <div style="display: block; height: 10px; width: 50px;" id="e17"></div>
                <div style="position: absolute; top: auto; left: auto;" id="e18"></div>
            </div>
        </div>
    </body>
</html>
