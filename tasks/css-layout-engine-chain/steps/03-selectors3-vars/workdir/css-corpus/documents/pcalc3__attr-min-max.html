<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: min-width and max-width delivered by an attribute selector</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef } div[data-min] { min-width: calc(50% - 20px); width: 10px; height: 10px; background: #cfc } div[data-max] { max-width: calc(25% + 10px); width: 380px; height: 10px; background: #cfc }
</style>

<div class="cb" id="c1">
  <div data-min="1" id="e1"></div>
  <div data-max="1" id="e2"></div>
  <div data-min="1" data-max="1" id="e3"></div>
</div>
