<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: percentage terms that sum to zero</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef } .b { background: #cfc; height: 12px }
</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: calc(40px + 10% - 20% / 2)"></div>
  <div class="b" id="e2" style="width: calc(30% + 120px - 30%)"></div>
  <div class="b" id="e3" style="width: calc(60% - 40% - 20% + 200px)"></div>
  <div class="b" id="e4" style="width: calc(25% * 4 - 100%+150px)"></div>
</div>
