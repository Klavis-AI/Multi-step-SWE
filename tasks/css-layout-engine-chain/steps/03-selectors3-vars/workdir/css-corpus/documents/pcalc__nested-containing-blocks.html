<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: percentages inside calc() resolve against the right box</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }
.outer { width: 400px; background: #eef } .mid { width: calc(75% - 20px); background: #ffe } .inner { background: #cfc; height: 20px }
</style>

<div class="outer" id="c1">
  <div class="mid" id="e1">
    <div class="inner" id="e2" style="width: calc(50% - 10px)"></div>
    <div class="inner" id="e3" style="width: calc(100% - 4em)"></div>
  </div>
</div>
