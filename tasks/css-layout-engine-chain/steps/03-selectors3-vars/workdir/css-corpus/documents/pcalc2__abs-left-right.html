<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: left and right: calc() on absolutely positioned boxes</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { position: relative; width: 300px; height: 160px; background: #eef } .a { position: absolute; background: #cfc; height: 8px; width: 20px }
</style>

<div class="cb" id="c1">
  <div class="a" id="e1" style="top: 0;   left: calc(150% / 2 - 40px)"></div>
  <div class="a" id="e2" style="top: 20px; left: calc(40px + 10% - 20% / 2)"></div>
  <div class="a" id="e3" style="top: 40px; left: calc(30px - 10%)"></div>
  <div class="a" id="e4" style="top: 60px; right: calc(150% / 2 - 40px)"></div>
  <div class="a" id="e5" style="top: 80px; right: calc(-10% + 60px)"></div>
  <div class="a" id="e6" style="top: 100px; left: calc(-25% + 100px)"></div>
</div>
