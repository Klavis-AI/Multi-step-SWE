<!DOCTYPE html>
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/7656#issuecomment-1248617134">
<style>
.target {
  display: grid;
  width: min-content;
  grid-auto-flow: column;
  position: relative;
  line-height: 0;
}
.target > div {
  background: hotpink;
  font-size: 30px;
}
fieldset {
  padding: 10px;
  border: solid 10px;
  margin: 0;
  font-size: 20px;
}
span {
  display: inline-block;
  width: 1em;
  height: 1em;
  outline: solid cyan 3px;
  outline-offset: -3px;
}
</style>



<body onload="checkLayout('.target  id="e1"> *')">

<div class="target" style="align-items: first baseline;" id="e2">
  <div data-offset-y="20" id="e3"><span id="e4"></span></div>
  <fieldset data-offset-y="0">
    <legend><span id="e5"></span></legend>
    <span id="e6"></span><br id="e7"><span id="e8"></span>
  </table>
</div>

<div class="target" style="align-items: last baseline;" id="e9">
  <div data-offset-y="40" id="e10"><span id="e11"></span></div>
  <fieldset data-offset-y="0">
    <span id="e12"></span><br id="e13"><span id="e14"></span>
    <legend><span id="e15"></span></legend>
  </table>
</div>
