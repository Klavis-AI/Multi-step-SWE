<!DOCTYPE html>

<title>CSS Grid Layout Test: Spanned Percentage Row, Shrinkwrap Height</title>
<link rel="help" href="https://www.w3.org/TR/css-grid-1/#algo-overview">
<link rel="match" href="references/grid-percent-rows-spanned-shrinkwrap-001-ref.html">
<link rel="author" title="Manuel Rego Casasnovas" href="mailto:rego@igalia.com">
<link rel="author" title="Elika J. Etemad" href="http://fantasai.inkedblade.net/contact">

<style>
    .grid {
        display: grid;
        float: left;
        margin: 1em;
        grid-template-rows: auto 20% auto;
        grid-auto-flow: column;
        justify-content: center;
        border: solid silver;
        font: 20px/1 Ahem;
        color: transparent;
    }
    .grid > div {
        background: blue;
    }
    .b {
        grid-row: 3;
    }
    .c {
        grid-row: span 3;
    }

    .ref {
        grid-template-rows: 40px 20px 40px;
    }
</style>

<p id="e1">Test passes if the two shapes below are identical

<div class="grid" id="e2">
    <div class="a" id="e3">X</div>
    <div class="b" id="e4">X</div>
    <div class="c" id="e5">X<br id="e6">X<br id="e7">X<br id="e8">X<br id="e9">X</div>
</div>

<div class="grid ref" id="e10">
    <div class="a" id="e11">X</div>
    <div class="b" id="e12">X</div>
    <div class="c" id="e13">X<br id="e14">X<br id="e15">X<br id="e16">X<br id="e17">X</div>
</div>
