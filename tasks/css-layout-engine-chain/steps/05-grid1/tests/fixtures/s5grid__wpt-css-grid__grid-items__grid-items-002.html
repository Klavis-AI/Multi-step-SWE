<!DOCTYPE html>
<style>@font-face { font-family: 'Ahem'; src: url('Ahem.ttf') format('truetype'); }</style>
<meta charset="utf-8">
<title>CSS Grid Layout Test: Children of grid items do not create new items</title>
<link rel="author" title="Manuel Rego Casasnovas" href="mailto:rego@igalia.com">
<link rel="help" href="http://www.w3.org/TR/css-grid-1/#grid-items" title="4 Grid Items">
<link rel="match" href="../../reference/ref-filled-green-100px-square.xht">
<meta name="flags" content="ahem">
<meta name="assert" content="Checks that the grid items do not split around blocks creating extra items.">

<style>
  #reference-overlapped-red {
    position: absolute;
    background-color: red;
    width: 100px;
    height: 100px;
    z-index: -1;
  }

  .test-grid-overlapping-green {
    display: grid;
    font: 25px/1 Ahem;
    color: green;
    justify-content: start;
    align-content: start;
  }

  .two-columns {
    grid-template-columns: auto auto;
  }
</style>
<p id="e1">Test passes if there is a filled green square and <strong>no red</strong>.</p>

<div id="reference-overlapped-red"></div>
<div class="test-grid-overlapping-green two-columns" id="e2">
  <div id="e3">
    <div id="e4">it</div>
    em
  </div>
  <div id="e5">
    it
    <div id="e6">em</div>
  </div>
</div>
<div class="test-grid-overlapping-green" id="e7">
  <span id="e8">
    <span id="e9">it</span>em
  </span>
  <span id="e10">
    it<span id="e11">em</span>
  </span>
</div>
