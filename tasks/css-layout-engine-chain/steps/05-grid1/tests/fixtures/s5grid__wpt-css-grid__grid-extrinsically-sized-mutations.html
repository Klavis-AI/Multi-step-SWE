<!DOCTYPE html>
<html>
<head>
<link rel="author" title="Sammy Gill" href="mailto:sammy.gill@apple.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-2/#layout-algorithm">

<meta name="assert" content="Tests that an extrinsically sized grid responds to various changes to both the grid and its constraints.">
<style>
.container {
  width: 50px;
}
.grid {
  display: grid;
  grid-template-columns: 100%;
  grid-template-rows: 50px;
  height: 50px;
  outline: 1px solid blue;
  font: 10px/1 Ahem;
}

.alignStart {
  align-items: start;
}

.fixedHeight {
  height: 100px;
}

.percentHeight {
  height: 100%;
}

.percentRow {
  grid-template-rows: 100%;
}
</style>



<style>@font-face { font-family: 'Ahem'; src: url('Ahem.ttf') format('truetype'); }</style></head>
<body id="e1">

<!-- Inline constraint on the grid changes -->
<div class="container" id="one">
  <div class="grid alignStart" id="e2">
    <div class="test" data-expected-height="40" id="e3">x x x x</div>
  </div>
</div>

<!-- Alignment of grid items changes -->
<div class="container" id="e4">
  <div id="two" class="grid alignStart">
    <div class="test" data-expected-height="50" id="e5">x x x</div>
  </div>
</div>

<!-- grid-template-rows changes to different fixed size. -->
<div id="three" class="grid">
  <div class="test" data-expected-height="30" id="e6">xx</div>
</div>

<!-- Grid block size changes with % based rows -->
<div id="four" class="grid percentRow">
  <div class="test" data-expected-height="10" id="e7">xx</div>
</div>

<!-- Grid item content changes -->
<div class="container" id="e8">
  <div class="grid alignStart" id="e9">
    <div id="five" class="test" data-expected-height="30">x x x</div>
  </div>
</div>

<!-- Grid with % height and rows has fixed block constraint changed -->
<div class="container fixedHeight" id="six">
  <div class="grid percentRow percentHeight" id="e10">
    <div class="test" data-expected-height="50" id="e11">xx</div>
  </div>
</div>

<!-- grid-template-columns changes to different % value -->
<div class="container" id="e12">
  <div id="seven" class="grid alignStart">
    <div class="test" data-expected-height="30" id="e13">x x x</div>
  </div>
</div>

<!-- Grid has new item added -->
<div class="container" id="e14">
  <div id="eight" class="grid alignStart" style="grid-template-columns: 50% 50%;">
    <div id="e15">xx xx</div>
  </div>
</div>
</body>

</html>
