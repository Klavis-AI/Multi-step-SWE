<!DOCTYPE html>
<style>@font-face { font-family: 'Ahem'; src: url('Ahem.ttf') format('truetype'); }</style>
<meta charset="utf-8">
<title>CSS Grid Layout Test: Spanned Percentage Column, Shrinkwrap Width (via float)</title>
<link rel="help" href="https://www.w3.org/TR/css-grid-1/#algo-overview">
<link rel="match" href="references/grid-percent-cols-spanned-shrinkwrap-001-ref.html">
<link rel="author" title="Manuel Rego Casasnovas" href="mailto:rego@igalia.com">
<link rel="author" title="Elika J. Etemad" href="http://fantasai.inkedblade.net/contact">

<style>
    .grid {
        display: grid;
        float: left;
        margin: 1em;
        grid-template-columns: auto 20% auto;
        border: solid silver;
        font: 20px/1 Ahem;
        color: transparent;
    }
    .grid > div {
        background: blue;
    }
    .b {
        grid-column: 3;
    }
    .c {
        grid-column: span 3;
    }

    .ref {
        grid-template-columns: 40px 20px 40px;
    }
</style>

<p id="e1">Test passes if the two shapes below are identical

<div class="grid" id="e2">
    <div class="a" id="e3">X</div>
    <div class="b" id="e4">X</div>
    <div class="c" id="e5">XXXXX</div>
</div>

<div class="grid ref" id="e6">
    <div class="a" id="e7">X</div>
    <div class="b" id="e8">X</div>
    <div class="c" id="e9">XXXXX</div>
</div>
