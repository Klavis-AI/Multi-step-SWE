<!DOCTYPE html>
<link rel="help" href="https://drafts.csswg.org/css-grid/">
<link rel="help" href="https://drafts.csswg.org/css-overflow/#scrollable">
<link rel="match" href="../reference/ref-filled-green-100px-square-only.html">
<meta name="assert" content="An off screen grid item's overflowing context is still painted in the overflow hidden container.">
<p id="e1">Test passes if there is a filled green square.</p>
<div style="width: 100px; height: 100px; overflow: hidden;" id="e2">
  <div style="display: grid; grid-template-columns: 100px; grid-template-rows: 50px; margin-left: -150px; margin-top: -100px;" id="e3">
    <div style="grid-column: 1 / 2; grid-row: 1 / 2;" id="e4">
      <div style="width: 250px; height: 200px; background: green;" id="e5"></div>
    </div>
  </div>
</div>
