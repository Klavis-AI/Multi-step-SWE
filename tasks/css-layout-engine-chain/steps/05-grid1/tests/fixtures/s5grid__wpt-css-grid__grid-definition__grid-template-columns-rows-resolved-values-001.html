<!DOCTYPE html>
<style>@font-face { font-family: 'Ahem'; src: url('Ahem.ttf') format('truetype'); }</style>
<meta charset="utf-8">
<title>CSS Grid Layout Test: 'grid-template-columns' and 'grid-template-rows' properties resolved values for implicit tracks</title>
<link rel="author" title="Manuel Rego Casasnovas" href="mailto:rego@igalia.com">
<link rel="help" href="http://www.w3.org/TR/css-grid-1/#resolved-track-list" title="5.1.5. Resolved Values">
<meta name="flags" content="ahem dom">
<meta name="assert" content="This test checks that resolved values for 'grid-template-columns' and 'grid-template-rows' list tracks implicitly created.">




<style>
  .grid {
    display: grid;
    width: 800px;
    height: 600px;
    font: 10px/1 Ahem;
    justify-content: start;
    align-content: start;
  }

  .fifthColumn {
    grid-column: 5;
  }

  .fourthRow {
    grid-row: 4;
  }

  .gridAutoFlowColumn {
    grid-auto-flow: column;
  }
</style>
<div id="log"></div>

<div id="grid" class="grid">
  <div id="e1">FIRST ITEM</div>
  <div id="e2">SECOND ITEM</div>
  <div id="e3">THIRD<br / id="e4">ITEM</div>
</div>

<div id="gridItemsPositions" class="grid">
  <div class="fifthColumn" id="e5">FIRST ITEM</div>
  <div class="fourthRow" id="e6">SECOND ITEM</div>
  <div id="e7">THIRD<br / id="e8">ITEM</div>
</div>

<div id="gridAutoFlowColumn" class="grid gridAutoFlowColumn">
  <div id="e9">FIRST ITEM</div>
  <div id="e10">SECOND ITEM</div>
  <div id="e11">THIRD<br / id="e12">ITEM</div>
</div>

<div id="gridAutoFlowColumnItemsPositions" class="grid gridAutoFlowColumn">
  <div class="fifthColumn" id="e13">FIRST ITEM</div>
  <div class="fourthRow" id="e14">SECOND ITEM</div>
  <div id="e15">THIRD<br / id="e16">ITEM</div>
</div>
