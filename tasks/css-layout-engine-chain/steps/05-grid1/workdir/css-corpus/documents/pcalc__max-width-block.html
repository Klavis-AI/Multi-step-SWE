<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: max-width: calc() clamps a wider width</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }

</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: 400px; max-width: calc(50% - 20px)"></div>
  <div class="b" id="e2" style="width: 400px; max-width: calc(100% - 100px)"></div>
  <div class="b" id="e3" style="width: 20px; max-width: calc(50%)"></div>
  <div class="b" id="e4" style="width: 400px; max-width: calc(4em * 3)"></div>
</div>
