<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: top: calc() against a fixed-height containing block</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.col { float: left; position: relative; height: 200px; width: 5px; background: #eef; margin-right: 5px } .a { position: absolute; background: #cfc; height: 8px; width: 5px }
</style>

<div class="col" id="c1"><div class="a" id="e1" style="top: calc(25%)"></div></div>
<div class="col" id="c2"><div class="a" id="e2" style="top: calc(30px + 25%)"></div></div>
<div class="col" id="c3"><div class="a" id="e3" style="top: calc(150% / 2 - 40px)"></div></div>
<div class="col" id="c4"><div class="a" id="e4" style="top: calc(40px + 10% - 20% / 2)"></div></div>
<div class="col" id="c5"><div class="a" id="e5" style="top: calc(30px - 10%)"></div></div>
<div class="col" id="c6"><div class="a" id="e6" style="top: calc(-15% + 50px)"></div></div>
