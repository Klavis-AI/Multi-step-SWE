<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: stretch changes an auto cross size only</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }
.f { height: 120px } .i { width: 60px }
</style>

<div class="f" id="c1" style="align-items: stretch">
  <div class="i" id="e1"></div>
  <div class="i" id="e2" style="height: 40px"></div>
  <div class="i" id="e3" style="height: auto"></div>
</div>
