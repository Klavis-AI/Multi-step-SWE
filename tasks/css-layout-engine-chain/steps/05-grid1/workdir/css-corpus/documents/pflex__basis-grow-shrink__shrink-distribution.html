<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: flex-shrink is weighted by the base size</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }

</style>

<div class="f" id="c1">
  <div class="i" id="e1" style="flex: 0 1 300px"></div>
  <div class="i" id="e2" style="flex: 0 1 300px"></div>
</div>
<div class="f" id="c2">
  <div class="i" id="e3" style="flex: 0 1 400px"></div>
  <div class="i" id="e4" style="flex: 0 2 200px"></div>
</div>
<div class="f" id="c3">
  <div class="i" id="e5" style="flex: 0 0 300px"></div>
  <div class="i" id="e6" style="flex: 0 0 300px"></div>
</div>
