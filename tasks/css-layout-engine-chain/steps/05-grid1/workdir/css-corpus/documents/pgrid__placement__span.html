<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: span in a placement value</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.g { display: grid; width: 400px; height: 120px; background: #eef }
.i { background: #cfc }
.t4 { grid-template-columns: 100px 100px 100px 100px; grid-template-rows: 60px 60px }

</style>

<div class="g t4" id="c1">
  <div class="i" id="e1" style="grid-column: span 2; grid-row: 1"></div>
  <div class="i" id="e2" style="grid-column: 2 / span 3; grid-row: 2"></div>
</div>
