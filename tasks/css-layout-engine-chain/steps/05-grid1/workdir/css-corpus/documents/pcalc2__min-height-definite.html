<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: min-height: calc() where the parent's height is definite</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.outer { width: 300px; height: 240px; background: #ffe } .b { background: #cfc }
</style>

<div class="outer" id="c1">
  <div class="b" id="e1" style="min-height: calc(25% + 10px)"></div>
  <div class="b" id="e2" style="min-height: calc(150% / 2 - 100px)"></div>
  <div class="b" id="e3" style="max-height: calc(20% - 8px); height: 200px"></div>
  <div class="b" id="e4" style="min-height: calc(40px + 10% - 20% / 2)"></div>
</div>
