<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: the grid-row and grid-column shorthands</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.g { display: grid; width: 400px; height: 120px; background: #eef }
.i { background: #cfc }
.t4 { grid-template-columns: 100px 100px 100px 100px; grid-template-rows: 60px 60px }

</style>

<div class="g t4" id="c1">
  <div class="i" id="e1" style="grid-row: 1 / 2; grid-column: 1 / 2"></div>
  <div class="i" id="e2" style="grid-row-start: 2; grid-row-end: 3; grid-column-start: 2; grid-column-end: 4"></div>
</div>
