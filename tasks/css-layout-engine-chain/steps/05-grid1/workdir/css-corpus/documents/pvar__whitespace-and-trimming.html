<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: leading and trailing whitespace in a custom property value</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef }
.b { background: #cfc; height: 20px }
html { --a:   150px  ; --b:calc( 25% ) }
</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: var(--a)"></div>
  <div class="b" id="e2" style="width: var( --a )"></div>
  <div class="b" id="e3" style="width: var(--b)"></div>
</div>
