<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: flex-wrap: wrap-reverse stacks the lines the other way</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }
.f { height: 200px }
</style>

<div class="f" id="c1" style="flex-wrap: wrap-reverse">
  <div class="i" id="e1" style="flex: 0 0 150px; height: 50px"></div>
  <div class="i" id="e2" style="flex: 0 0 150px; height: 50px"></div>
  <div class="i" id="e3" style="flex: 0 0 150px; height: 50px"></div>
</div>
