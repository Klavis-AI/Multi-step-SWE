<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: var() fallback when the property is not set</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef }
.b { background: #cfc; height: 20px }
html { --set: 90px }
</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: var(--unset, 140px)"></div>
  <div class="b" id="e2" style="width: var(--set, 140px)"></div>
  <div class="b" id="e3" style="width: var(--unset, var(--set))"></div>
  <div class="b" id="e4" style="width: var(--unset, var(--alsounset, 60px))"></div>
</div>
