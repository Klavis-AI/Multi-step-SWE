<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: flex-basis along a column main axis</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }
.fc { display: flex; flex-direction: column; width: 200px; height: 300px; background: #eef }
</style>

<div class="fc" id="c1">
  <div class="i" id="e1" style="flex: 1 1 0%"></div>
  <div class="i" id="e2" style="flex: 2 1 0%"></div>
</div>
<div class="fc" id="c2">
  <div class="i" id="e3" style="flex: 0 0 80px"></div>
  <div class="i" id="e4" style="flex: 0 0 25%"></div>
</div>
