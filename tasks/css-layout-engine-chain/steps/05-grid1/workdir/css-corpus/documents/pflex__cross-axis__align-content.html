<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: align-content distributes the lines</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }
.f { height: 240px; flex-wrap: wrap } .i { width: 250px; height: 40px }
</style>

<div class="f" id="c1" style="align-content: flex-end">
  <div class="i" id="e1"></div>
  <div class="i" id="e2"></div>
</div>
<div class="f" id="c2" style="align-content: space-between">
  <div class="i" id="e3"></div>
  <div class="i" id="e4"></div>
</div>
