<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: items overflowing the explicit rows keep the column sizes</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.g { display: grid; width: 400px; height: 120px; background: #eef }
.i { background: #cfc }
.t4 { grid-template-columns: 100px 100px 100px 100px; grid-template-rows: 60px 60px }

</style>

<div class="g" id="c1" style="grid-template-columns: 120px 120px; grid-template-rows: 40px 40px">
  <div class="i" id="e1"></div>
  <div class="i" id="e2"></div>
  <div class="i" id="e3"></div>
  <div class="i" id="e4"></div>
</div>
