<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: a negative percentage term</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 120px; background: #eef } .r { position: relative; background: #cfc; height: 12px; width: 100px }
</style>

<div class="cb" id="c1">
  <div class="r" id="e1" style="left: calc(-25%)"></div>
  <div class="r" id="e2" style="left: calc(-10% + 60px)"></div>
  <div class="r" id="e3" style="left: calc(-50% / 2 + 100px)"></div>
  <div class="r" id="e4" style="left: calc(10% - 80px)"></div>
</div>
