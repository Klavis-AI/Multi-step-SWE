<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: margin-* with calc()</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }

</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: 100px; margin-left: calc(10% - 8px)"></div>
  <div class="b" id="e2" style="width: 100px; margin-left: calc(2em + 4px)"></div>
  <div class="b" id="e3" style="width: calc(100% - 40px); margin-left: calc(5%); margin-right: calc(5%)"></div>
  <div class="b" id="e4" style="width: 100px; margin-left: calc(-5% + 40px)"></div>
</div>
