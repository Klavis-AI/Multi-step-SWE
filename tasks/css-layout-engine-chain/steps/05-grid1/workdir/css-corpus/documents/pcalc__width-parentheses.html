<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: width: calc() with nested parentheses</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }

</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: calc((50% - 20px) / 2)"></div>
  <div class="b" id="e2" style="width: calc(2 * (25% + 10px))"></div>
  <div class="b" id="e3" style="width: calc((100px + 100px) - (10px * 3))"></div>
  <div class="b" id="e4" style="width: calc(((40% )))"></div>
  <div class="b" id="e5" style="width: calc((100% - 40px) / 4 + 5px)"></div>
</div>
