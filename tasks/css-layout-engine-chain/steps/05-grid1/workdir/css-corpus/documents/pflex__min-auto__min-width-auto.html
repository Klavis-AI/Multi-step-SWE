<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: min-width: auto floors a shrinking item</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }

</style>

<div class="f" id="c1">
  <div class="i" id="e1" style="flex: 1 1 auto; width: 300px; min-width: 120px"></div>
  <div class="i" id="e2" style="flex: 1 1 auto; width: 300px; min-width: 0"></div>
</div>
<div class="f" id="c2">
  <div class="i" id="e3" style="flex: 0 1 400px; min-width: 200px"></div>
  <div class="i" id="e4" style="flex: 0 1 400px; min-width: 0"></div>
</div>
