<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: a spanning item swallows the gap it crosses</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.g { display: grid; width: 400px; height: 120px; background: #eef }
.i { background: #cfc }
.t4 { grid-template-columns: 100px 100px 100px 100px; grid-template-rows: 60px 60px }
.g { height: 140px }
</style>

<div class="g" id="c1" style="grid-template-columns: 100px 100px 100px; grid-template-rows: 60px 60px; gap: 20px">
  <div class="i" id="e1" style="grid-column: 1 / 3"></div>
  <div class="i" id="e2" style="grid-column: 3"></div>
  <div class="i" id="e3" style="grid-column: 1; grid-row: 2"></div>
</div>
