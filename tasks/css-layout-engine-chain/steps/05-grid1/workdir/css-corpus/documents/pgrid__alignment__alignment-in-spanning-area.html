<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: alignment inside an area that spans tracks</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.g { display: grid; width: 400px; height: 120px; background: #eef }
.i { background: #cfc }
.t4 { grid-template-columns: 100px 100px 100px 100px; grid-template-rows: 60px 60px }
.g { height: 120px } .i { width: 60px; height: 40px }
</style>

<div class="g" id="c1" style="grid-template-columns: 100px 100px 100px 100px; grid-template-rows: 60px 60px">
  <div class="i" id="e1" style="grid-column: 1 / 3; justify-self: center; align-self: center"></div>
  <div class="i" id="e2" style="grid-column: 3 / 5; grid-row: 2; justify-self: end; align-self: end"></div>
</div>
