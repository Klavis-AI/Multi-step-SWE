<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: cross-axis alignment on a column container</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }
.fc { display: flex; flex-direction: column; width: 300px; height: 200px; background: #eef } .i { height: 40px }
</style>

<div class="fc" id="c1" style="align-items: center">
  <div class="i" id="e1" style="width: 100px"></div>
  <div class="i" id="e2" style="width: 60px"></div>
</div>
<div class="fc" id="c2" style="align-items: flex-end">
  <div class="i" id="e3" style="width: 100px"></div>
  <div class="i" id="e4" style="width: 60px"></div>
</div>
