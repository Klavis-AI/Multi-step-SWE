<!DOCTYPE html>
<html lang="en">
<head>
  
  <style>

/* The Ahem font. See: https://github.com/Kozea/Ahem
   The "X" glyph in this font happens to be exactly 10 pixels wide by 10 high

   By combining X's with zero-width space characters (&#8203;) we can reliably set an elements
   min-content and max-content sizes.
*/
@font-face {
    font-family: 'ahem';
    src: url('Ahem.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}

/* Force Chrome to use space-taking scrollbars.
   The exact width (15px) must match the width assumed in the test runner */
::-webkit-scrollbar {
  width: 15px;
  height: 15px;
}

body {
  padding: 0;
  margin: 0;
}

div, span, img {
  box-sizing: border-box;
  position: relative;
  border: 0 solid red;
  margin: 0;
  padding: 0;
}

div {
  display: block;
}

body > * {
  position: absolute;
  border-color: red;
}

.viewport {
  display: block;
  
  
  /* Defaults: can be overridden in individual tests */
  width: auto;
  height: auto;
}

#test-root {
  font-family: ahem;
  line-height: 1;
  font-size: 10px;
  color: green;
}

.border-box, .border-box * {
  box-sizing: border-box;
}

.content-box, .content-box * {
  box-sizing: content-box;
}

.ltr * {
  direction: ltr;
}

.rtl * {
  direction: rtl;
}

div {
  background-color: #222;
}

div > div {
  background-color: #444;
}

div > div > div {
  background-color: #666;
}

div > div > div > div {
  background-color: #888;
}

div > div > div > div > div {
  background-color: #aaa;
}

div > div > div > div > div > div {
  background-color: #ccc;
}

div > div > div > div > div > div > div {
  background-color: #eee;
}
</style>
  <title>
    Floats whose percentage widths and margins sum to exactly 100% all fit on one row
  </title>
</head>
<body class="content-box rtl" id="e1">

<div id="test-root" style="display: block; width: 1628px;">
  <div style="float: left; width: 30%; height: 50px;" id="e2"></div>
  <div style="float: left; width: 30%; height: 50px; margin-left: 5%;" id="e3"></div>
  <div style="float: left; width: 30%; height: 50px; margin-left: 5%;" id="e4"></div>
</div>

</body>
</html>
