<!DOCTYPE html>
<style>@font-face { font-family: 'Ahem'; src: url('Ahem.ttf') format('truetype'); }</style>
<title>Test vertical-align: top and bottom do not affect the line height</title>
<link rel="match" href="vertical-align-negative-leading-001-ref.html">
<link rel="help" href="https://drafts.csswg.org/css2/visudet.html#propdef-vertical-align">
<link rel="author" href="mailto:kojii@chromium.org">

<style>
.container {
  margin: 30px 0;
  color: orange;
  background-color: blue;
  line-height: 10px;
  font-size: 30px;
  font-family: Ahem;
}
span { background: purple; }
.top { vertical-align: top; }
.bottom { vertical-align: bottom; }
.text-top { vertical-align: text-top; }
.text-bottom { vertical-align: text-bottom; }
</style>
<body id="e1">
<div class="container" id="e2">
  <span class="top" id="e3">XX</span>
  <span id="e4">XX</span>
  <span class="bottom" id="e5">XX</span>
</div>
<div class="container" id="e6">
  <span class="text-top" id="e7">XX</span>
  <span id="e8">XX</span>
  <span class="text-bottom" id="e9">XX</span>
</div>
<div class="container" id="e10"><span class="top" id="e11">XX</span></div>
<div class="container" id="e12"><span class="bottom" id="e13">XX</span></div>
<div class="container" id="e14"><span class="text-top" id="e15">XX</span></div>
<div class="container" id="e16"><span class="text-bottom" id="e17">XX</span></div>
</body>
