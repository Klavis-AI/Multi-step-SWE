<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: an invalid calc() leaves the earlier declaration standing</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }
.b { width: 120px }
</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: calc(100px / 0)"></div>
  <div class="b" id="e2" style="width: calc(10px * 20px)"></div>
  <div class="b" id="e3" style="width: calc(50% +)"></div>
  <div class="b" id="e4" style="width: calc(50%-10px)"></div>
  <div class="b" id="e5" style="width: calc()"></div>
  <div class="b" id="e6" style="width: calc(30px + 10px)"></div>
</div>
