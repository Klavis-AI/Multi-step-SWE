<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: zero and negative results from calc()</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }

</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: calc(50% - 50%)"></div>
  <div class="b" id="e2" style="width: calc(10px - 40px)"></div>
  <div class="b" id="e3" style="width: 100px; margin-left: calc(0px - 20px)"></div>
  <div class="b" id="e4" style="width: calc(0% + 60px)"></div>
</div>
