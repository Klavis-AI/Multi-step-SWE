<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: left and right: calc() on relatively positioned boxes</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 200px; margin: 0 100px; background: #eef } .r { position: relative; background: #cfc; height: 6px }
</style>

<div class="cb" id="c1">
  <div class="r" id="e1" style="left: calc(40px)"></div>
  <div class="r" id="e2" style="left: calc(-25%)"></div>
  <div class="r" id="e3" style="left: calc(30px + 25%)"></div>
  <div class="r" id="e4" style="left: calc(-150% / 2 + 40px)"></div>
  <div class="r" id="e5" style="left: calc(40px + 10% - 20% / 2)"></div>
  <div class="r" id="e6" style="left: calc(10% - 50px)"></div>
  <div class="r" id="e7" style="right: calc(25% - 10px)"></div>
  <div class="r" id="e8" style="right: calc(-20% + 70px)"></div>
</div>
