<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: sizes delivered by [class], [id] and [title] presence selectors</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef } div[class] { background: #cfc; height: 11px } div[id] { margin-left: calc(5% + 4px) } div[title] { width: calc(50% - 20px) } div[lang] { padding-left: calc(2% + 2px) }
</style>

<div class="cb" id="c1">
  <div class="x" id="e1"></div>
  <div class="x" title="t" id="e2"></div>
  <div class="x" lang="en" title="t" id="e3"></div>
  <div class="x" id="e4" style="width: calc(25% + 10px)"></div>
</div>
