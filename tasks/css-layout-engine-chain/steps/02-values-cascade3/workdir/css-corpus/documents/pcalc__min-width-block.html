<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: min-width: calc() clamps a narrower width</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }

</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: 10px; min-width: calc(50% - 20px)"></div>
  <div class="b" id="e2" style="width: 10px; min-width: calc(25% + 25%)"></div>
  <div class="b" id="e3" style="width: 300px; min-width: calc(10% )"></div>
  <div class="b" id="e4" style="width: 10px; min-width: calc(100px + 4em)"></div>
</div>
