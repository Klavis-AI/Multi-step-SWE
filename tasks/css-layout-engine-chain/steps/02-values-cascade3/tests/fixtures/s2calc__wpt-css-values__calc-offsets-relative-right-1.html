<!DOCTYPE HTML>
<html>
<head>
  <title>CSS Test: Test for right:calc() on relatively positioned elements</title>
  <link rel="author" title="L. David Baron" href="https://dbaron.org/">
  <link rel="help" href="http://www.w3.org/TR/css3-values/#calc-notation">
  <link rel="match" href="calc-offsets-relative-left-1-ref.html">
<style type="text/css">
body { margin: 0 100px; width: 100px }
div[style] { background: blue; position: relative; height: 3px; }
</style>
</head>
<body id="e1">

<div style="right: calc(-50px)" id="e2"></div>
<div style="right: calc(50%)" id="e3"></div>
<div style="right: calc(-25px - 50%)" id="e4"></div>
<div style="right: calc(150% / 2 - 30px)" id="e5"></div>
<div style="right: calc(-40px - 10% + 20% / 2)" id="e6"></div>
<div style="right: calc(-10% + 40px)" id="e7"></div>
</body>
</html>
