<!DOCTYPE HTML>
<html>
<head>
  <title>CSS Test: min-width: calc() on blocks</title>
  <link rel="author" title="L. David Baron" href="https://dbaron.org/">
  <link rel="help" href="http://www.w3.org/TR/css3-values/#calc-notation">
  <link rel="match" href="calc-width-block-1-ref.html">
<style type="text/css">

body { width: 500px }
p { background: green; color: white; margin: 1px 0; font-size: 10px; width: 0 }

</style>
</head>
<body id="e1">

<p style="min-width: calc(50% - 3px)" id="e2">50% - 3px</p>
<p style="min-width: calc(25% - 3px + 25%)" id="e3">25% - 3px + 25%</p>
<p style="min-width: calc(25% - 3px + 12.5% * 2)" id="e4">25% - 3px + 12.5% * 2</p>
<p style="min-width: calc(25% - 3px + 12.5%*2)" id="e5">25% - 3px + 12.5%*2</p>
<p style="min-width: calc(25% - 3px + 2*12.5%)" id="e6">25% - 3px + 2*12.5%</p>
<p style="min-width: calc(25% - 3px + 2 * 12.5%)" id="e7">25% - 3px + 2 * 12.5%</p>
<p style="min-width: calc(30% + 20%)" id="e8">30% + 20%</p>
</body>
</html>
