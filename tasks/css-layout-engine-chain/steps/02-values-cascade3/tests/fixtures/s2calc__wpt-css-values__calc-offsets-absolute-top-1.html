<!DOCTYPE HTML>
<html>
<head>
  <title>CSS Test: Test for top:calc() on absolutely positioned elements</title>
  <link rel="author" title="L. David Baron" href="https://dbaron.org/">
  <link rel="help" href="http://www.w3.org/TR/css3-values/#calc-notation">
  <link rel="match" href="calc-offsets-absolute-top-1-ref.html">
<style type="text/css">
body { margin: 0 }
body > div { float: left; height: 100px; width: 3px; position: relative }
div[style] { background: blue; position: absolute; height: 10px; width: 3px }
div.space { height: 100px }
</style>
</head>
<body id="e1">

<!-- tests with a fixed-height container -->
<div id="e2"><div style="top: calc(50px)" id="e3"></div></div>
<div id="e4"><div style="top: calc(50%)" id="e5"></div></div>
<div id="e6"><div style="top: calc(25px + 50%)" id="e7"></div></div>
<div id="e8"><div style="top: calc(150% / 2 - 30px)" id="e9"></div></div>
<div id="e10"><div style="top: calc(40px + 10% - 20% / 2)" id="e11"></div></div>
<div id="e12"><div style="top: calc(40px - 10%)" id="e13"></div></div>

<!-- tests with an auto-top container -->
<div id="e14"><div id="e15"><div style="top: calc(50px)" id="e16"></div><div class="space" id="e17"></div></div></div>
<div id="e18"><div id="e19"><div style="top: calc(50%)" id="e20"></div><div class="space" id="e21"></div></div></div>
<div id="e22"><div id="e23"><div style="top: calc(25px + 50%)" id="e24"></div><div class="space" id="e25"></div></div></div>
<div id="e26"><div id="e27"><div style="top: calc(150% / 2 - 30px)" id="e28"></div><div class="space" id="e29"></div></div></div>
<div id="e30"><div id="e31"><div style="top: calc(40px + 10% - 20% / 2)" id="e32"></div><div class="space" id="e33"></div></div></div>
<div id="e34"><div id="e35"><div style="top: calc(40px - 10%)" id="e36"></div><div class="space" id="e37"></div></div></div>
</body>
</html>
