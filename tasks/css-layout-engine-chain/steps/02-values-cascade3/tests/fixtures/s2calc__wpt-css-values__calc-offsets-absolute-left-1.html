<!DOCTYPE HTML>
<html>
<head>
  <title>CSS Test: Test for left:calc() on absolutely positioned elements</title>
  <link rel="author" title="L. David Baron" href="https://dbaron.org/">
  <link rel="help" href="http://www.w3.org/TR/css3-values/#calc-notation">
  <link rel="match" href="calc-offsets-relative-left-1-ref.html">
<style type="text/css">
body { margin: 0 100px; width: 200px }
body > div { height: 3px; position: relative }
div[style] { background: blue; position: absolute; height: 3px; width: 100px }
</style>
</head>
<body id="e1">

<div id="e2"><div style="left: calc(50px)" id="e3"></div></div>
<div id="e4"><div style="left: calc(-25%)" id="e5"></div></div>
<div id="e6"><div style="left: calc(25px + 25%)" id="e7"></div></div>
<div id="e8"><div style="left: calc(-75% / 2 + 30px)" id="e9"></div></div>
<div id="e10"><div style="left: calc(40px + 5% - 10% / 2)" id="e11"></div></div>
<div id="e12"><div style="left: calc(5% - 40px)" id="e13"></div></div>
</body>
</html>
