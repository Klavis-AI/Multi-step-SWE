<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: a percentage delivered through var() still resolves against the containing block</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef }
.b { background: #cfc; height: 20px }
.outer { width: 400px; background: #eef } .mid { width: 200px; background: #ffe } html { --p: 50% }
</style>

<div class="outer" id="c1">
  <div class="b" id="e1" style="width: var(--p)"></div>
  <div class="mid" id="e2">
    <div class="b" id="e3" style="width: var(--p)"></div>
    <div class="b" id="e4" style="width: calc(var(--p) - 20px)"></div>
  </div>
</div>
