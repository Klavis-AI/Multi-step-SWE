<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: relative offsets delivered by an attribute-presence selector</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 200px; margin: 0 80px; background: #eef } div[style] { position: relative; background: #cfc; height: 7px }
</style>

<div class="cb" id="c1">
  <div style="left: calc(40px)" id="e1"></div>
  <div style="left: calc(-25%)" id="e2"></div>
  <div style="left: calc(20px + 25%)" id="e3"></div>
  <div style="right: calc(150% / 2 - 60px)" id="e4"></div>
  <div style="right: calc(10% - 30px)" id="e5"></div>
</div>
