<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: calc() mixing absolute units</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }

</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: calc(1in + 1pc)"></div>
  <div class="b" id="e2" style="width: calc(10mm + 10px)"></div>
  <div class="b" id="e3" style="width: calc(2cm - 1pt)"></div>
  <div class="b" id="e4" style="width: calc(100px - 6pt)"></div>
</div>
