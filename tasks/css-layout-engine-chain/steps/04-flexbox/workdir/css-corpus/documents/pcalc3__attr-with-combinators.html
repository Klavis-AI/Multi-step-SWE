<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: an attribute selector inside a descendant and a child combinator</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef } .cb > div[data-k] { width: calc(50% - 10px); height: 10px; background: #cfc } .cb div[data-k] div { width: calc(50%); height: 6px; background: #9c9 } .cb > div[data-j] { margin-left: calc(10% - 8px); width: 100px; height: 10px; background: #cfc }
</style>

<div class="cb" id="c1">
  <div data-k="1" id="e1"><div id="e2"></div></div>
  <div data-j="1" id="e3"></div>
  <div id="e4"><div data-k="1" id="e5"></div></div>
</div>
