<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: align-self overrides align-items per item</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }
.f { height: 120px } .i { width: 60px; height: 40px }
</style>

<div class="f" id="c1" style="align-items: flex-start">
  <div class="i" id="e1" style="align-self: flex-end"></div>
  <div class="i" id="e2" style="align-self: center"></div>
  <div class="i" id="e3" style="align-self: auto"></div>
  <div class="i" id="e4" style="align-self: stretch; height: auto"></div>
</div>
