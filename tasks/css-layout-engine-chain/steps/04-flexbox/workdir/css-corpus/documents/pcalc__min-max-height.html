<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: min-height and max-height with calc()</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }

</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="height: 10px; min-height: calc(50% - 20px)"></div>
  <div class="b" id="e2" style="height: 180px; max-height: calc(25% + 10px)"></div>
  <div class="b" id="e3" style="height: 10px; min-height: calc(3em + 2px)"></div>
  <div class="b" id="e4" style="height: 10px; min-height: calc(20% * 2)"></div>
</div>
