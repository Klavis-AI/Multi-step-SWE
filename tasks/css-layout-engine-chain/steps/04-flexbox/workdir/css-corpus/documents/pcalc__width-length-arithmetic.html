<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: width: calc() over lengths only</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }

</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: calc(100px + 20px)"></div>
  <div class="b" id="e2" style="width: calc(200px - 50px)"></div>
  <div class="b" id="e3" style="width: calc(30px * 4)"></div>
  <div class="b" id="e4" style="width: calc(300px / 4)"></div>
  <div class="b" id="e5" style="width: calc(10em - 20px)"></div>
  <div class="b" id="e6" style="width: calc(1in - 24px)"></div>
</div>
