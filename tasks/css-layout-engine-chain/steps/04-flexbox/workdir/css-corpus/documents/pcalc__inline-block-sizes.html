<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: calc() sizes on inline-blocks</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }
.line { width: 400px; background: #eef; font-size: 0 } .ib { display: inline-block; background: #cfc; height: 20px }
</style>

<div class="line" id="c1">
  <span class="ib" id="e1" style="width: calc(25% - 10px)"></span>
  <span class="ib" id="e2" style="width: calc(50px + 25px)"></span>
</div>
