<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: over-constrained top/bottom with calc()</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }
.rel { position: relative; width: 400px; height: 200px; background: #eef } .a { position: absolute; background: #cfc; width: 40px }
</style>

<div class="rel" id="c1">
  <div class="a" id="e1" style="left: 0; top: calc(10% ); height: 30px"></div>
  <div class="a" id="e2" style="left: 50px; bottom: calc(25% - 10px); height: 30px"></div>
  <div class="a" id="e3" style="left: 100px; top: calc(5% + 5px); bottom: calc(5% + 5px)"></div>
  <div class="a" id="e4" style="left: 150px; top: calc(20px); bottom: 20px; height: 40px"></div>
</div>
