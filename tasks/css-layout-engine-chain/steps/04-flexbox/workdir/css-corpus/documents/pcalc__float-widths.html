<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: calc() widths on floats</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }
.cb3 { width: 400px; background: #eef; height: 120px } .f { float: left; background: #cfc; height: 40px }
</style>

<div class="cb3" id="c1">
  <div class="f" id="e1" style="width: calc(25% - 10px)"></div>
  <div class="f" id="e2" style="width: calc(25% - 10px)"></div>
  <div class="f" id="e3" style="width: calc(50% - 20px)"></div>
</div>
