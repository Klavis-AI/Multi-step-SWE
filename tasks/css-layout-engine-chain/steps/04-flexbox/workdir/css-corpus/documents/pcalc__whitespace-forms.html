<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: the whitespace rules of the calc() grammar</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }
.b2 { background: #cfc; height: 12px }
</style>

<div class="cb" id="c1">
  <div class="b2" id="e1" style="width: calc( 50% - 10px )"></div>
  <div class="b2" id="e2" style="width: calc(50%  -  10px)"></div>
  <div class="b2" id="e3" style="width: calc(50%*1)"></div>
  <div class="b2" id="e4" style="width: calc(50%/ 2)"></div>
  <div class="b2" id="e5" style="width: CALC(50% - 10px)"></div>
</div>
