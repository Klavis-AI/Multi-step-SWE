<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: auto margins beside a calc() width</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }

</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: calc(50% ); margin-left: auto; margin-right: auto; height: 20px"></div>
  <div class="b" id="e2" style="width: calc(100% - 100px); margin-left: auto; height: 20px"></div>
  <div class="b" id="e3" style="width: calc(25% + 25px); margin-right: auto; height: 20px"></div>
</div>
