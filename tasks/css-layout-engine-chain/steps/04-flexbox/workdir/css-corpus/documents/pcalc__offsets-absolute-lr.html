<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: over-constrained left/right with calc()</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }
.rel { position: relative; width: 400px; height: 200px; background: #eef } .a { position: absolute; background: #cfc; height: 20px }
</style>

<div class="rel" id="c1">
  <div class="a" id="e1" style="left: calc(10% ); width: 100px"></div>
  <div class="a" id="e2" style="top: 30px; right: calc(25% - 20px); width: 100px"></div>
  <div class="a" id="e3" style="top: 60px; left: calc(10% + 5px); right: calc(10% + 5px)"></div>
  <div class="a" id="e4" style="top: 90px; left: calc(50px); right: 50px; width: 100px"></div>
  <div class="a" id="e5" style="top: 120px; left: calc(25%); right: calc(25%); width: 100px; margin-left: auto; margin-right: auto"></div>
</div>
