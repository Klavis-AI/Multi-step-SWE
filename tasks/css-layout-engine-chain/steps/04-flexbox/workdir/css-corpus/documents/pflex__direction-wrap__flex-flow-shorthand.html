<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: the flex-flow shorthand</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }
.f { height: 200px }
</style>

<div class="f" id="c1" style="flex-flow: row wrap">
  <div class="i" id="e1" style="flex: 0 0 250px; height: 40px"></div>
  <div class="i" id="e2" style="flex: 0 0 250px; height: 40px"></div>
</div>
<div class="f" id="c2" style="flex-flow: column nowrap">
  <div class="i" id="e3" style="flex: 0 0 40px"></div>
  <div class="i" id="e4" style="flex: 0 0 40px"></div>
</div>
