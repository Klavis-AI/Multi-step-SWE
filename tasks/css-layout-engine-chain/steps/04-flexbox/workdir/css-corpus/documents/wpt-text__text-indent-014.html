<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN"
                      "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>CSS Test: text-indent on anonymous blocks</title>
  <link rel="author" title="Elika J. Etemad" href="http://fantasai.inkedblade.net/contact"/>
  <link rel="help" href="http://www.w3.org/TR/CSS21/text.html#indentation-prop"/>
  <link rel="help" href="https://drafts.csswg.org/css-text-3/#text-indent-property"/>
  <link rel="match" href="text-indent-014-ref.xht"/>
  <meta name="assert" content="text-indent affects only the first line of
    a block container if that line is also the first formatted line of an
    element."/>
  
  <style type="text/css"><![CDATA[
    .container {
      font: 20px/1 Ahem;
      border: solid orange;
      width: 12em;
    }
    .outer {
      text-indent: 6em;
    }
    .inner {
      text-indent: 0;
    }
    .outer {
    }
    .outer:before {
      content: "BlockA";
      display: block;
    }

    .controlA, .controlB {
      background: red;
      height: 3em;
      width: 6em;
    }
    .controlA {
      margin-left: 6em;
      margin-bottom: -3em;
    }
    .controlB {
      margin-top: -3em;
    }
  ]]></style>
<style>@font-face { font-family: 'Ahem'; src: url('Ahem.ttf') format('truetype'); }</style></head>
<body id="e1">
  <p id="e2">There must be a 4-square checkerboard pattern in the orange box below
    and no red present.</p>
  <div class="container" id="e3">
    <div class="controlA" id="e4"></div>
    <div class="outer" id="e5">
      <div id="e6">
        BlockA
        <div id="e7">BlockA</div>
        BlockB
        <div class="inner" id="e8">BlockB</div>
        BlockB
      </div>
    </div>
    <div class="controlB" id="e9"></div>
  </div>
</body>
</html>
