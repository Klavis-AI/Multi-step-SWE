<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: var() supplying offsets on positioned boxes</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef }
.b { background: #cfc; height: 20px }
html { --off: 40px } .rel { position: relative; width: 400px; height: 160px; background: #eef } .a { position: absolute; background: #cfc; width: 60px; height: 20px }
</style>

<div class="rel" id="c1">
  <div class="a" id="e1" style="left: var(--off); top: 0"></div>
  <div class="a" id="e2" style="left: calc(var(--off) * 2); top: 30px"></div>
  <div class="a" id="e3" style="right: var(--off); top: 60px"></div>
  <div class="a" id="e4" style="left: var(--none, 10px); top: 90px"></div>
</div>
