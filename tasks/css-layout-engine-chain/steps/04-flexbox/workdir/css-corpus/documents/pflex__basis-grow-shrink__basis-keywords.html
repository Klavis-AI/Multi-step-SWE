<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: flex: none, auto, initial and a bare number</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }
.i { width: 80px }
</style>

<div class="f" id="c1">
  <div class="i" id="e1" style="flex: none"></div>
  <div class="i" id="e2" style="flex: auto"></div>
</div>
<div class="f" id="c2">
  <div class="i" id="e3" style="flex: initial"></div>
  <div class="i" id="e4" style="flex: 1"></div>
</div>
<div class="f" id="c3">
  <div class="i" id="e5" style="flex: 1"></div>
  <div class="i" id="e6" style="flex-grow: 1"></div>
</div>
