<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: an attribute selector competing with a class and an id in the cascade</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; background: #eef } div[data-w] { width: calc(25%); height: 10px; background: #cfc } .wide { width: calc(50%) } #narrow { width: calc(10%) }
</style>

<div class="cb" id="c1">
  <div data-w="1" id="e1"></div>
  <div data-w="1" class="wide" id="e2"></div>
  <div data-w="1" id="narrow"></div>
  <div class="wide" id="e3" style="height: 10px; background: #cfc"></div>
</div>
