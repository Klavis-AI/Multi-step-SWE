<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: justify-content across its values</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }
.f { height: 40px }
</style>

<div class="f" id="c1" style="justify-content: flex-start">
  <div class="i" id="e1" style="flex: 0 0 80px"></div>
  <div class="i" id="e2" style="flex: 0 0 80px"></div>
</div>
<div class="f" id="c2" style="justify-content: flex-end">
  <div class="i" id="e3" style="flex: 0 0 80px"></div>
  <div class="i" id="e4" style="flex: 0 0 80px"></div>
</div>
<div class="f" id="c3" style="justify-content: center">
  <div class="i" id="e5" style="flex: 0 0 80px"></div>
  <div class="i" id="e6" style="flex: 0 0 80px"></div>
</div>
