<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: calc() nested inside calc()</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
div { display: block }
.cb { width: 400px; height: 200px; background: #eef }
.b { background: #cfc }

</style>

<div class="cb" id="c1">
  <div class="b" id="e1" style="width: calc(calc(50% ) - 20px)"></div>
  <div class="b" id="e2" style="width: calc(10px + calc(100px + calc(20px * 2)))"></div>
  <div class="b" id="e3" style="width: calc(calc(25%) + calc(25%) - 8px)"></div>
  <div class="b" id="e4" style="width: calc(calc(calc(200px)) / 2)"></div>
</div>
