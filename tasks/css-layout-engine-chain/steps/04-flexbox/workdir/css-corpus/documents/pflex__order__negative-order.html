<!DOCTYPE html>
<meta charset="utf-8">
<title>practice: negative order values come first</title>
<style>
html, body { margin: 0; padding: 0; font-size: 16px }
.f { display: flex; width: 400px; height: 100px; background: #eef }
.i { background: #cfc; border: 0 }
.f { height: 40px } .i { flex: 0 0 80px }
</style>

<div class="f" id="c1">
  <div class="i" id="e1"></div>
  <div class="i" id="e2" style="order: -1"></div>
  <div class="i" id="e3" style="order: -2"></div>
</div>
