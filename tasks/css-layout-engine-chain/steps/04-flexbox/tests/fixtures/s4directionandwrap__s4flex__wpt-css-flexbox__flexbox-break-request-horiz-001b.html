<!DOCTYPE html>

<html>
<head>
  <title>CSS Test: Testing page-break-after in horizontal multi-line flex containers</title>
  <link rel="author" title="Daniel Holbert" href="mailto:dholbert@mozilla.com">
  <link rel="help" href="https://drafts.csswg.org/css-flexbox-1/#change-201409-algo-breaks">
  <link rel="match" href="flexbox-break-request-horiz-001-ref.html">
  <meta charset="utf-8">
  <style>
    div.flexbox {
      display: flex;
      flex-wrap: wrap;
      border: 1px dashed black;
      width: 60px;
      height: 20px;
      margin: 2px;
      float: left;
    }
    div.item {
      width: 28px;
      border: 1px solid blue;
      background: lightblue;
    }
  </style>
</head>
<body id="e1">
  <!-- page-break-after specified on first (and only) item, at a point where
       we're already "breaking" (the end): -->
  <!-- * With 'page-break-after: auto, avoid' (not requesting a break): -->
  <div class="flexbox" id="e2">
    <div class="item" style="page-break-after: auto" id="e3"></div>
  </div>
  <div class="flexbox" id="e4">
    <div class="item" style="page-break-after: avoid" id="e5"></div>
  </div>
  <!-- * With 'page-break-after: always, left, right' (requesting a break): -->
  <div class="flexbox" id="e6">
    <div class="item" style="page-break-after: always" id="e7"></div>
  </div>
  <div class="flexbox" id="e8">
    <div class="item" style="page-break-after: left" id="e9"></div>
  </div>
  <div class="flexbox" id="e10">
    <div class="item" style="page-break-after: right" id="e11"></div>
  </div>
  <div style="clear: both" id="e12"></div>

  <!-- page-break-after specified on first item, at a point where breaking
       would otherwise be unnecessary: -->
  <!-- * With 'page-break-after: auto, avoid' (not requesting a break): -->
  <div class="flexbox" id="e13">
    <div class="item" style="page-break-after: auto" id="e14"></div>
    <div class="item" id="e15"></div>
  </div>
  <div class="flexbox" id="e16">
    <div class="item" style="page-break-after: avoid" id="e17"></div>
    <div class="item" id="e18"></div>
  </div>
  <!-- * With 'page-break-after: always, left, right' (requesting a break): -->
  <div class="flexbox" id="e19">
    <div class="item" style="page-break-after: always" id="e20"></div>
    <div class="item" id="e21"></div>
  </div>
  <div class="flexbox" id="e22">
    <div class="item" style="page-break-after: left" id="e23"></div>
    <div class="item" id="e24"></div>
  </div>
  <div class="flexbox" id="e25">
    <div class="item" style="page-break-after: right" id="e26"></div>
    <div class="item" id="e27"></div>
  </div>
  <div style="clear: both" id="e28"></div>

  <!-- page-break-after specified on second item, at a point where breaking
       is already necessary: -->
  <!-- * With 'page-break-after: auto, avoid' (not requesting a break): -->
  <div class="flexbox" id="e29">
    <div class="item" id="e30"></div>
    <div class="item" style="page-break-after: auto" id="e31"></div>
    <div class="item" id="e32"></div>
  </div>
  <div class="flexbox" id="e33">
    <div class="item" id="e34"></div>
    <div class="item" style="page-break-after: avoid" id="e35"></div>
    <div class="item" id="e36"></div>
  </div>
  <!-- * With 'page-break-after: always, left, right' (requesting a break): -->
  <div class="flexbox" id="e37">
    <div class="item" id="e38"></div>
    <div class="item" style="page-break-after: always" id="e39"></div>
    <div class="item" id="e40"></div>
  </div>
  <div class="flexbox" id="e41">
    <div class="item" id="e42"></div>
    <div class="item" style="page-break-after: left" id="e43"></div>
    <div class="item" id="e44"></div>
  </div>
  <div class="flexbox" id="e45">
    <div class="item" id="e46"></div>
    <div class="item" style="page-break-after: right" id="e47"></div>
    <div class="item" id="e48"></div>
  </div>
</body>
</html>
