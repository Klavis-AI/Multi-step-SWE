<!doctype html>
<meta charset="utf-8">
<title>CSS Test: nested flex containers with definite max-height</title>
<link rel="match" href="flexbox-definite-sizes-005-ref.html">
<link rel="author" href="mailto:dholbert@mozilla.com" title="Daniel Holbert">
<link rel="help" href="https://drafts.csswg.org/css-flexbox/#definite-sizes">
<link rel="help" href="https://bugzilla.mozilla.org/show_bug.cgi?id=1503173">
<style>
  .horizFlex {
    display: flex;
    margin-bottom: 2px;
  }
  .vertFlex {
    display: flex;
    flex-grow: 1;
    flex-direction: column;
    min-height: 60px;
  }
  .item {
    background: lime;
    height: 100%;
  }
</style>
<p id="e1">Test passes if you see four 60px-tall lime rows (with platform-appropriate scrollbars on the last one).</p>

<div class="horizFlex" id="e2">
  <div class="vertFlex" id="e3">
    <div class="item" id="e4"></div>
  </div>
</div>

<div class="horizFlex" id="e5">
  <div class="vertFlex" style="overflow: hidden" id="e6">
    <div class="item" id="e7"></div>
  </div>
</div>
<div class="horizFlex" id="e8">
  <div class="vertFlex" style="overflow: auto" id="e9">
    <div class="item" id="e10"></div>
  </div>
</div>

<div class="horizFlex" id="e11">
  <div class="vertFlex" style="overflow: scroll" id="e12">
    <div class="item" id="e13"></div>
  </div>
</div>
