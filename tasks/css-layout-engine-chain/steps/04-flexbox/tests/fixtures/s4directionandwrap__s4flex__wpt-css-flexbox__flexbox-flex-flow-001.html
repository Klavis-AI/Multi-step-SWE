<!DOCTYPE html>

<html>
<head>
  <title>CSS Test: Testing all the values of the "flex-flow" shorthand property, with 4 flex items in each container</title>
  <link rel="author" title="Daniel Holbert" href="mailto:dholbert@mozilla.com">
  <link rel="help" href="http://www.w3.org/TR/css-flexbox-1/#flex-flow-property">
  <link rel="match" href="flexbox-flex-flow-001-ref.html">
  <meta charset="utf-8">
  <style>
    .flexContainer {
      display: flex;
      height: 60px;
      width: 60px;
      font: 10px sans-serif;
      background: yellow;
      float: left;
      border: 1px solid black;
    }
    .flexContainer > * {
      border: 1px dotted gray;
      width: 28px;
      height: 28px;
      /* Explicitly set min-width & min-height to 0, to prevent their "auto"
         value from influencing the sizes of our flex items (particularly for
         the single-line chunks of this testcase, whose items may be shrunk a
         little below the numerals' intrinsic sizes): */
      min-width:  0;
      min-height: 0;
    }
  </style>
</head>
<body id="e1">
  <!-- single-line (flex-wrap unspecified): -->
  <div class="flexContainer" style="flex-flow: row" id="e2">
    <div id="e3">1</div><div id="e4">2</div><div id="e5">3</div><div id="e6">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: row-reverse" id="e7">
    <div id="e8">1</div><div id="e9">2</div><div id="e10">3</div><div id="e11">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: column" id="e12">
    <div id="e13">1</div><div id="e14">2</div><div id="e15">3</div><div id="e16">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: column-reverse" id="e17">
    <div id="e18">1</div><div id="e19">2</div><div id="e20">3</div><div id="e21">4</div>
  </div>

  <div style="clear:both" id="e22"></div>

  <!-- now using "wrap", after flex-direction: -->
  <div class="flexContainer" style="flex-flow: row wrap" id="e23">
    <div id="e24">1</div><div id="e25">2</div><div id="e26">3</div><div id="e27">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: row-reverse wrap" id="e28">
    <div id="e29">1</div><div id="e30">2</div><div id="e31">3</div><div id="e32">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: column wrap" id="e33">
    <div id="e34">1</div><div id="e35">2</div><div id="e36">3</div><div id="e37">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: column-reverse wrap" id="e38">
    <div id="e39">1</div><div id="e40">2</div><div id="e41">3</div><div id="e42">4</div>
  </div>

  <div style="clear:both" id="e43"></div>

  <!-- now using "wrap", before flex-direction: -->
  <div class="flexContainer" style="flex-flow: wrap row" id="e44">
    <div id="e45">1</div><div id="e46">2</div><div id="e47">3</div><div id="e48">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: wrap row-reverse" id="e49">
    <div id="e50">1</div><div id="e51">2</div><div id="e52">3</div><div id="e53">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: wrap column" id="e54">
    <div id="e55">1</div><div id="e56">2</div><div id="e57">3</div><div id="e58">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: wrap column-reverse" id="e59">
    <div id="e60">1</div><div id="e61">2</div><div id="e62">3</div><div id="e63">4</div>
  </div>

  <div style="clear:both" id="e64"></div>

  <!-- now using "wrap-reverse", after flex-direction: -->
  <div class="flexContainer" style="flex-flow: row wrap-reverse" id="e65">
    <div id="e66">1</div><div id="e67">2</div><div id="e68">3</div><div id="e69">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: row-reverse wrap-reverse" id="e70">
    <div id="e71">1</div><div id="e72">2</div><div id="e73">3</div><div id="e74">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: column wrap-reverse" id="e75">
    <div id="e76">1</div><div id="e77">2</div><div id="e78">3</div><div id="e79">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: column-reverse wrap-reverse" id="e80">
    <div id="e81">1</div><div id="e82">2</div><div id="e83">3</div><div id="e84">4</div>
  </div>

  <div style="clear:both" id="e85"></div>

  <!-- now using "wrap-reverse", before flex-direction: -->
  <div class="flexContainer" style="flex-flow: wrap-reverse row" id="e86">
    <div id="e87">1</div><div id="e88">2</div><div id="e89">3</div><div id="e90">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: wrap-reverse row-reverse" id="e91">
    <div id="e92">1</div><div id="e93">2</div><div id="e94">3</div><div id="e95">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: wrap-reverse column" id="e96">
    <div id="e97">1</div><div id="e98">2</div><div id="e99">3</div><div id="e100">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: wrap-reverse column-reverse" id="e101">
    <div id="e102">1</div><div id="e103">2</div><div id="e104">3</div><div id="e105">4</div>
  </div>

  <div style="clear:both" id="e106"></div>

  <!-- now just specifying flex-wrap (no flex-direction) -->
  <div class="flexContainer" style="flex-flow: wrap" id="e107">
    <div id="e108">1</div><div id="e109">2</div><div id="e110">3</div><div id="e111">4</div>
  </div>
  <div class="flexContainer" style="flex-flow: wrap-reverse" id="e112">
    <div id="e113">1</div><div id="e114">2</div><div id="e115">3</div><div id="e116">4</div>
  </div>

</body>
</html>
