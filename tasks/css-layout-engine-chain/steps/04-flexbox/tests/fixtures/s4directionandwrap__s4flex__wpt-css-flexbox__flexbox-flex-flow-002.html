<!DOCTYPE html>

     http://creativecommons.org/publicdomain/zero/1.0/
-->
<html>
<head>
  <title>CSS Test: Testing all the values of the "flex-flow" shorthand property, with 3 flex items in each container</title>
  <link rel="author" title="Daniel Holbert" href="mailto:dholbert@mozilla.com">
  <link rel="help" href="http://www.w3.org/TR/css-flexbox-1/#flex-flow-property">
  <link rel="match" href="flexbox-flex-flow-002-ref.html">
  <meta charset="utf-8">
  <style>
    .flexContainer {
      display: flex;
      height: 60px;
      width: 60px;
      font: 10px sans-serif;
      background: yellow;
      float: left;
      border: 1px solid black;
    }
    .flexContainer > * {
      border: 1px dotted gray;
      width: 28px;
      height: 28px;
      /* Explicitly set min-width & min-height to 0, to prevent their "auto"
         value from influencing the sizes of our flex items (particularly for
         the single-line chunks of this testcase, whose items may be shrunk a
         little below the numerals' intrinsic sizes): */
      min-width:  0;
      min-height: 0;
    }
  </style>
</head>
<body id="e1">
  <!-- single-line (flex-wrap unspecified): -->
  <div class="flexContainer" style="flex-flow: row" id="e2">
    <div id="e3">1</div><div id="e4">2</div><div id="e5">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: row-reverse" id="e6">
    <div id="e7">1</div><div id="e8">2</div><div id="e9">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: column" id="e10">
    <div id="e11">1</div><div id="e12">2</div><div id="e13">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: column-reverse" id="e14">
    <div id="e15">1</div><div id="e16">2</div><div id="e17">3</div>
  </div>

  <div style="clear:both" id="e18"></div>

  <!-- now using "wrap", after flex-direction: -->
  <div class="flexContainer" style="flex-flow: row wrap" id="e19">
    <div id="e20">1</div><div id="e21">2</div><div id="e22">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: row-reverse wrap" id="e23">
    <div id="e24">1</div><div id="e25">2</div><div id="e26">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: column wrap" id="e27">
    <div id="e28">1</div><div id="e29">2</div><div id="e30">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: column-reverse wrap" id="e31">
    <div id="e32">1</div><div id="e33">2</div><div id="e34">3</div>
  </div>

  <div style="clear:both" id="e35"></div>

  <!-- now using "wrap", before flex-direction: -->
  <div class="flexContainer" style="flex-flow: wrap row" id="e36">
    <div id="e37">1</div><div id="e38">2</div><div id="e39">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: wrap row-reverse" id="e40">
    <div id="e41">1</div><div id="e42">2</div><div id="e43">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: wrap column" id="e44">
    <div id="e45">1</div><div id="e46">2</div><div id="e47">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: wrap column-reverse" id="e48">
    <div id="e49">1</div><div id="e50">2</div><div id="e51">3</div>
  </div>

  <div style="clear:both" id="e52"></div>

  <!-- now using "wrap-reverse", after flex-direction: -->
  <div class="flexContainer" style="flex-flow: row wrap-reverse" id="e53">
    <div id="e54">1</div><div id="e55">2</div><div id="e56">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: row-reverse wrap-reverse" id="e57">
    <div id="e58">1</div><div id="e59">2</div><div id="e60">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: column wrap-reverse" id="e61">
    <div id="e62">1</div><div id="e63">2</div><div id="e64">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: column-reverse wrap-reverse" id="e65">
    <div id="e66">1</div><div id="e67">2</div><div id="e68">3</div>
  </div>

  <div style="clear:both" id="e69"></div>

  <!-- now using "wrap-reverse", before flex-direction: -->
  <div class="flexContainer" style="flex-flow: wrap-reverse row" id="e70">
    <div id="e71">1</div><div id="e72">2</div><div id="e73">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: wrap-reverse row-reverse" id="e74">
    <div id="e75">1</div><div id="e76">2</div><div id="e77">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: wrap-reverse column" id="e78">
    <div id="e79">1</div><div id="e80">2</div><div id="e81">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: wrap-reverse column-reverse" id="e82">
    <div id="e83">1</div><div id="e84">2</div><div id="e85">3</div>
  </div>

  <div style="clear:both" id="e86"></div>

  <!-- now just specifying flex-wrap (no flex-direction) -->
  <div class="flexContainer" style="flex-flow: wrap" id="e87">
    <div id="e88">1</div><div id="e89">2</div><div id="e90">3</div>
  </div>
  <div class="flexContainer" style="flex-flow: wrap-reverse" id="e91">
    <div id="e92">1</div><div id="e93">2</div><div id="e94">3</div>
  </div>

</body>
</html>
