<!DOCTYPE html>
<html>
  <meta charset="utf-8">
  <title>CSS Flexible Box Layout Test: Test flex container's overflow rect</title>
  <link rel="author" title="Ting-Yu Lin" href="mailto:tlin@mozilla.com">
  <link rel="author" title="Mozilla" href="https://www.mozilla.org/">
  <link rel="help" href="https://drafts.csswg.org/css-overflow-3/#scrollable">
  <link rel="help" href="https://bugzilla.mozilla.org/show_bug.cgi?id=1712496">
  <link rel="match" href="reference/overflow-area-003-ref.html">
  <meta name="assert" content="This test verifies that a flex container's padding rect should not not affect its overflow rect at all.">

  <style>
  .set {
    clear: both;
    margin: 1em;
  }

  .test {
    display: flex;
    overflow: auto;
    padding: 10px;
    width: 60px;
    height: 60px;
    background: teal;
    margin: 0.5em;
    float: left;
  }

  .item {
    width: 10px;
    height: 10px;
  }

  .absolute {
    position: absolute;
  }

  .center {
    justify-content: center;
    align-items: center
  }

  .relative {
    position: relative;
  }

  .relative > .item {
    flex-shrink: 0;
    width: 60px;
    height: 60px;
  }

  .top-left {
    left: -10px;
    top: -10px;
  }

  .bottom-right {
    bottom: -10px;
    right: -10px;
  }
  </style>

  <p id="e1">Test passes if all the teal boxes have no scrollbars.</p>

  <!-- This set tests empty flex containers. -->
  <div class="set" id="e2">
    <div class="test" style="flex-direction: row;" id="e3"></div>
    <div class="test" style="flex-direction: column;" id="e4"></div>
    <div class="test" style="flex-direction: row-reverse;" id="e5"></div>
    <div class="test" style="flex-direction: column-reverse;" id="e6"></div>
  </div>

  <!-- This set tests flex containers having only a abs-pos child, but no flex items. -->
  <div class="set" id="e7">
    <div class="test" style="flex-direction: row;" id="e8">
      <div class="absolute item" id="e9"></div>
    </div>
    <div class="test" style="flex-direction: column;" id="e10">
      <div class="absolute item" id="e11"></div>
    </div>
    <div class="test" style="flex-direction: row-reverse;" id="e12">
      <div class="absolute item" id="e13"></div>
    </div>
    <div class="test" style="flex-direction: column-reverse;" id="e14">
      <div class="absolute item" id="e15"></div>
    </div>
  </div>

  <!-- This set tests flex containers having a small centered flex item. -->
  <div class="set" id="e16">
    <div class="test center" style="flex-direction: row;" id="e17">
      <div class="item" id="e18"></div>
    </div>
    <div class="test center" style="flex-direction: column;" id="e19">
      <div class="item" id="e20"></div>
    </div>
    <div class="test center" style="flex-direction: row-reverse;" id="e21">
      <div class="item" id="e22"></div>
    </div>
    <div class="test center" style="flex-direction: column-reverse;" id="e23">
      <div class="item" id="e24"></div>
    </div>
  </div>

  <!-- This set tests flex containers having a relative positioned flex item. -->
  <div class="set" id="e25">
    <div class="test relative" style="flex-direction: row;" id="e26">
      <div class="item relative bottom-right" id="e27"></div>
    </div>
    <div class="test relative" style="flex-direction: column;" id="e28">
      <div class="item relative bottom-right" id="e29"></div>
    </div>
    <div class="test relative" style="flex-direction: row-reverse;" id="e30">
      <div class="item relative top-left" id="e31"></div>
    </div>
    <div class="test relative" style="flex-direction: column-reverse;" id="e32">
      <div class="item relative top-left" id="e33"></div>
    </div>
  </div>

</html>
