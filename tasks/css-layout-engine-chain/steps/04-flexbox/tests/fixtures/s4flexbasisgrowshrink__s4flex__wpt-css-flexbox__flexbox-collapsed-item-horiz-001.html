<!DOCTYPE html>

<html>
<head>
  <title>CSS Test: Testing that visibility:collapse on a flex item in a single-line flex container maintains the containers's cross size, but doesn't otherwise impact flex layout</title>
  <link rel="author" title="Daniel Holbert" href="mailto:dholbert@mozilla.com">
  <link rel="help" href="http://www.w3.org/TR/css-flexbox-1/#algo-visibility">
  <link rel="match" href="flexbox-collapsed-item-horiz-001-ref.html">
  <meta charset="utf-8">
  <style>
    .flexContainer {
      display: flex;
      background: yellow;
      border: 1px dotted black;
      float: left;
      margin: 5px;
    }
    .flexContainer > * {
      /* All flex items have 20px base size */
      width: 20px;
    }
    .collapse {
      visibility: collapse;
    }
    .flexible {
      flex: 1 auto;
    }
    .heightTall {
      height: 40px;
      background: purple;
    }
    .heightAuto {
      background: teal;
    }
    .heightShort {
      height: 10px;
      background: pink;
    }
  </style>
</head>
<body id="e1">
  <!-- FIRST ROW: -->
  <!-- Just one (collapsed) flex item, which ends up establishing
       the container's size (even though it's collapsed): -->
  <div class="flexContainer" id="e2">
    <div class="heightTall collapse" id="e3"></div>
  </div>

  <div style="clear: both" id="e4"></div>

  <!-- SECOND ROW: -->
  <!-- One collapsed flex item, one short flex item.
       (Container ends up with collapsed item's height) -->
  <div class="flexContainer" id="e5">
    <div class="heightTall collapse" id="e6"></div>
    <div class="heightShort" id="e7"></div>
  </div>
  <!-- (same, but with items in opposite order) -->
  <div class="flexContainer" id="e8">
    <div class="heightShort" id="e9"></div>
    <div class="heightTall collapse" id="e10"></div>
  </div>

  <div style="clear: both" id="e11"></div>

  <!-- THIRD ROW: -->
  <!-- One collapsed flex item, one stretched flex item.
       (Container and stretched item end up with collapsed item's height) -->
  <div class="flexContainer" id="e12">
    <div class="heightTall collapse" id="e13"></div>
    <div class="heightAuto" id="e14"></div>
  </div>
  <!-- (again, with items in opposite order) -->
  <div class="flexContainer" id="e15">
    <div class="heightAuto" id="e16"></div>
    <div class="heightTall collapse" id="e17"></div>
  </div>

  <div style="clear: both" id="e18"></div>

  <!-- FOURTH ROW: -->
  <!-- One collapsed flex item, one other flex item; both are flexible.
       (The non-collapsed one should take all of the available width.) -->
  <div class="flexContainer" id="e19">
    <div class="heightAuto flexible collapse" id="e20"></div>
    <div class="heightTall flexible" id="e21"></div>
  </div>
  <!-- (again, with items in opposite order) -->
  <div class="flexContainer" id="e22">
    <div class="heightTall flexible" id="e23"></div>
    <div class="heightAuto flexible collapse" id="e24"></div>
  </div>

</body>
</html>
