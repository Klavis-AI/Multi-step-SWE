<!-- This testcase checks that we correctly handle the "overflow" property on
     a horizontal flex container. -->
<html>
<head>
  <title>CSS Test: Testing 'overflow' property on a horizontal flex container, with contents not overflowing</title>
  <link rel="author" title="Daniel Holbert" href="mailto:dholbert@mozilla.com">
  <link rel="help" href="http://www.w3.org/TR/css-flexbox-1/#flex-containers">
  <link rel="match" href="flexbox-overflow-horiz-001-ref.html">
  <style>
    .flexContainer {
      background: purple;
      display: flex;
      width: 70px;
      height: 70px;
      float: left;
      margin-right: 5px;
    }
    .bigItem {
      background: blue;
      height: 200px;
      flex: 3;
    }
    .smallItem {
      background: teal;
      margin-bottom: 10px;
      flex: 1;
    }
    .scroll { overflow: scroll }
    .auto   { overflow: auto   }
    .hidden { overflow: hidden }
  </style>
</head>
<body id="e1">
  <div class="flexContainer" id="e2"><!-- (overflow un-set) -->
    <div class="bigItem" id="e3"></div>
    <div class="smallItem" id="e4"></div>
  </div>
  <div class="flexContainer hidden" id="e5">
    <div class="bigItem" id="e6"></div>
    <div class="smallItem" id="e7"></div>
  </div>
  <div class="flexContainer scroll" id="e8">
    <div class="bigItem" id="e9"></div>
    <div class="smallItem" id="e10"></div>
  </div>
  <div class="flexContainer auto" id="e11">
    <div class="bigItem" id="e12"></div>
    <div class="smallItem" id="e13"></div>
  </div>
</body>
</html>
