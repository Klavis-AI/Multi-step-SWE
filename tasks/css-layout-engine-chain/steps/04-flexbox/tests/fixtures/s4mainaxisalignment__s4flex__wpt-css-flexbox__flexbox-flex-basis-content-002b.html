<!DOCTYPE html>

<html>
<head>
  <title>
    CSS Test: Testing "flex-basis: content" (set via the "flex" shorthand)
    in a column-oriented flex container.
  </title>
  <meta charset="utf-8">
  <link rel="author" title="Daniel Holbert" href="mailto:dholbert@mozilla.com">
  <link rel="help" href="https://www.w3.org/TR/css-flexbox-1/#propdef-flex-basis">
  <link rel="match" href="flexbox-flex-basis-content-002-ref.html">
  
  <style>
  .container {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 2px solid purple;
    padding: 2px;
    margin-right: 2em;
    width: 50px;
    height: 200px;
    float: left;
  }

  .container > * {
    /* All flex items have "flex-basis: content" (and zero flex-shrink and
       min-main-size, to avoid any influence from those). */
    flex: 0 0 content;
    min-height: 0;
    border: 2px solid teal;
  }

  .smallText { font: 10px Ahem; }
  .bigText   { font: 20px Ahem; }
  .spacerChild::before {
    content: '';
    display: block;
    background: brown;
    height: 10px;
    width: 10px;
  }
  .justPadding {
    /* Empty div with 5px padding on each side */
    padding: 5px;
    background: cyan;
  }
  canvas { background: fuchsia }
  </style>
<style>@font-face { font-family: 'Ahem'; src: url('Ahem.ttf') format('truetype'); }</style></head>
<body id="e1">
<!-- Flex items have unspecified size properties: -->
<div class="container" id="e2">
  <div class="smallText" id="e3">a b</div>
  <div class="bigText" id="e4">c</div>
  <div class="spacerChild" id="e5"></div>
  <div class="justPadding" id="e6"></div>
  <canvas height="20"></canvas>
</div>

<!-- Various specified main-size values (should be ignored): -->
<div class="container" id="e7">
  <div class="smallText"    style="height: 0px" id="e8">a b</div>
  <div class="bigText"      style="height: 40px" id="e9">c</div>
  <div class="spacerChild"  style="height: 20px" id="e10"></div>
  <div class="justPadding"  style="height: 10px" id="e11"></div>
  <canvas height="20"       style="height: 8px"></canvas>
</div>

<!-- Various specified cross-size values (should be honored): -->
<div class="container" id="e12">
  <div class="smallText"    style="width: 0px" id="e13">a b</div>
  <div class="bigText"      style="width: 40px" id="e14">c</div>
  <div class="spacerChild"  style="width: 20px" id="e15"></div>
  <div class="justPadding"  style="width: 10px" id="e16"></div>
  <canvas height="20"       style="width: 8px"></canvas>
</div>

</body>
</html>
