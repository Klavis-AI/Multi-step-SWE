<!DOCTYPE html>
<link rel="help" href="https://drafts.csswg.org/css-flexbox-2/#algo-balance">
<meta name="assert" content="Various widths which may cause a line-count mis-match.">
<style>
.flex {
  display: flex;
  flex-wrap: balance;
  width: 100px;
  row-gap: 10px;
  border: solid 2px;
  margin: 10px;
}
.flex > div {
  min-width: var(--width);
  outline: dashed green 2px;
}
</style>

<!-- A single small item. -->
<div class="flex" style="--width: 50px" id="e1">
  <div id="e2"></div>
</div>

<!-- A single "perfect" item. -->
<div class="flex" style="--width: 100px" id="e3">
  <div id="e4"></div>
</div>

<!-- A single "large" item. -->
<div class="flex" style="--width: 150px" id="e5">
  <div id="e6"></div>
</div>

<!-- Many "perfect" items. -->
<div class="flex" style="--width: 100px" id="e7">
  <div id="e8"></div>
  <div id="e9"></div>
  <div id="e10"></div>
</div>

<!-- Many items which will create "perfect" lines. -->
<div class="flex" style="--width: 50px" id="e11">
  <div id="e12"></div>
  <div id="e13"></div>
  <div id="e14"></div>
  <div id="e15"></div>
</div>

<!-- Many large items. -->
<div class="flex" style="--width: 150px" id="e16">
  <div id="e17"></div>
  <div id="e18"></div>
</div>
