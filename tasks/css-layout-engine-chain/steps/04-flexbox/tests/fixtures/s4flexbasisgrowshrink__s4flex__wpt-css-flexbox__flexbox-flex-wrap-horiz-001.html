<!DOCTYPE html>

<html>
<head>
  <title>CSS Test: Testing flex-wrap in horizontal flex containers</title>
  <link rel="author" title="Daniel Holbert" href="mailto:dholbert@mozilla.com">
  <link rel="help" href="http://www.w3.org/TR/css-flexbox-1/#flex-wrap-property">
  <link rel="match" href="flexbox-flex-wrap-horiz-001-ref.html">
  <meta charset="utf-8">
  <style>
    div.flexbox {
      display: flex;
      flex-wrap: wrap;
      border: 1px dashed black;
      width: 100px;
      height: 12px;
      margin-bottom: 2px;
    }
    div.halfMainSize {
      width: 48px;
      border: 1px solid blue;
      background: lightblue;
    }
    div.hugeMainSize {
      width: 148px;
      border: 1px solid purple;
      background: fuchsia;
    }
  </style>
</head>
<body id="e1">

  <!-- Single small flex item -->
  <div class="flexbox" id="e2">
    <div class="halfMainSize" id="e3"></div>
  </div>

  <!-- Single small flex item with 'margin-left' set to push it to protrude
       from the far edge of the container (and to shrink as a result) -->
  <div class="flexbox" id="e4">
    <div class="halfMainSize" style="margin-left: 80px" id="e5"></div>
  </div>

  <!-- Single small inflexible flex item with 'margin-left' set to push it to
       protrude from the far edge of the container -->
  <div class="flexbox" id="e6">
    <div class="halfMainSize" style="margin-left: 80px; flex: none" id="e7"></div>
  </div>

  <!-- Two flex items, exactly large enough to fit in line (no wrapping): -->
  <div class="flexbox" id="e8">
    <div class="halfMainSize" id="e9"></div>
    <div class="halfMainSize" id="e10"></div>
  </div>

  <!-- and now with some margin on first item, to force second item to wrap: -->
  <div class="flexbox" id="e11">
    <div class="halfMainSize" style="margin-right: 1px" id="e12"></div>
    <div class="halfMainSize" id="e13"></div>
  </div>

  <!-- and now with some margin on second item, again forcing it to wrap: -->
  <div class="flexbox" id="e14">
    <div class="halfMainSize" id="e15"></div>
    <div class="halfMainSize" style="margin-right: 1px" id="e16"></div>
  </div>

  <!-- Single large flex item: overflows (but does not wrap) and is shrunk
       to fit container's main-size -->
  <div class="flexbox" id="e17">
    <div class="hugeMainSize" id="e18"></div>
  </div>

  <!-- Single large flex item: overflows (but does not wrap) -->
  <div class="flexbox" id="e19">
    <div class="hugeMainSize" style="flex: none" id="e20"></div>
  </div>

  <!-- Small flex item, followed by large flex item (which wraps to
       its own line and then shrink to container's main-size) -->
  <div class="flexbox" id="e21">
    <div class="halfMainSize" id="e22"></div>
    <div class="hugeMainSize" id="e23"></div>
  </div>

  <!-- Small flex item, followed by large inflexible flex item (which wraps to
       its own line and then shrink to container's main-size) -->
  <div class="flexbox" id="e24">
    <div class="halfMainSize" id="e25"></div>
    <div class="hugeMainSize" style="flex: none" id="e26"></div>
  </div>

</body>
</html>
