# Dovecot 2.3.21 configuration. Keys are documented at doc.dovecot.org.
listen = 127.0.0.1
protocols = imap
base_dir = /app/var/run/dovecot
log_path = /app/var/log/dovecot.log
info_log_path = /app/var/log/dovecot.log
mail_location = maildir:~/Maildir
mail_privileged_group = root
disable_plaintext_auth = no
auth_mechanisms = plain login
ssl = no
ssl_cert = </app/etc/ssl/server.certificate
ssl_key = </app/etc/ssl/server.private
default_login_user = root
default_internal_user = root

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /app/etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = username_format=%u /app/etc/dovecot/users
}

service imap-login {
  inet_listener imap {
    address = 127.0.0.1
    port = 2143
  }
  process_min_avail = 0
}

service imap {
  process_min_avail = 0
}

service auth {
  unix_listener auth-userdb {
    mode = 0600
  }
}

namespace inbox {
  inbox = yes
  separator = /
  prefix =
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Trash {
    special_use = \Trash
  }
}

first_valid_uid = 1
mail_access_groups = root
