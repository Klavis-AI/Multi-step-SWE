schema_version = "1.4"

# Trial reward = the mean of each step's `reward`.  A step's reward is
# `correctness x mean_f( ln(max(1, speedup_f)) )` over the functions in its
# scope -- i.e. correctness x ln(geometric mean of the per-function speedups).
# Correctness is binary and multiplies, so a tree that changes behaviour scores
# 0 however fast it is; a correct but unimproved tree scores 0 too.
#
# Measured on step 01: oracle 1.50 (geometric mean 4.5x over 18 entry points).
multi_step_reward_strategy = "mean"

# The cumulative /app reaches the separate verifier container through this
# stanza only.  `build` is the meson build directory the task tells the agent
# to use; it is regenerated by the verifier, so shipping it costs a large
# transfer and buys nothing.
artifacts = [
  { source = "/app", destination = "workspace", exclude = ["build", "build/**"] },
]

[task]
name = "harbor/parasail-align-simd"
version = "1.0.0"
description = "Vectorize parasail's sequence-alignment families one family at a time. Seven cumulative steps, each rewarded by measured per-entry-point speedup gated on bit-identical alignment output."
authors = [{ name = "Klavis AI", email = "connect@klavis.ai" }]
keywords = ["performance", "optimization", "simd", "bioinformatics", "multi-step"]

[metadata]
difficulty = "very hard"
category = "programming"
tags = ["performance-optimization", "multi-step", "c", "simd", "sequence-alignment"]

[environment]
build_timeout_sec = 2700.0
# The verifier pins to cores 0 and 1, so the agent container needs at least
# four for the pin to be meaningful and for a 4-way build to stay within the
# shared host's budget.
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
mcp_servers = []
workdir = "/app"
network_mode = "public"

[verifier]
environment_mode = "separate"

# The verifier image clones the pin, strips it to this step's base and builds
# that base; at grading time test.sh builds the candidate and times both.
# cpus must stay >= 2 because measurement pins to cores 0,1.
[verifier.environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
workdir = "/app"
network_mode = "public"

# Per-step verifier ceiling, derived from test.sh rather than copied:
#   candidate build        300 (meson setup) + 2400 (ninja)          = 2700
#   scope dump, both sides, one pass                                   =  120
#   width/envelope pass                                                =   60
#   library-wide digest, both sides                                    =  300
#   upstream suite, twice: 2 x (600 + 600 + 1200)                      = 4800
#   per-function timing, both sides                                    =  900
#   slack                                                              = 1020
#                                                                     ------
#                                                                      9900
# 10800.0 is that sum with headroom.  It is a ceiling, not a budget: a normal
# step's verifier finishes in about fifteen minutes.
[[steps]]
name = "01-sw-score"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 10800.0

[[steps]]
name = "02-nw-score"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 10800.0

[[steps]]
name = "03-sg-score"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 10800.0

[[steps]]
name = "04-sw-stats"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 10800.0

[[steps]]
name = "05-sw-trace"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 10800.0

[[steps]]
name = "06-nw-detail"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 10800.0

[[steps]]
name = "07-sg-detail"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 10800.0

[agent]
# The agent's work runs against an allowlist: only the inference endpoint is
# reachable at the network layer, so an upstream copy cannot be fetched by any
# route -- git, release tarball, package registry or docs mirror. The runner
# merges its own model host in at launch, so no host is pinned here.
network_mode = "allowlist"
