schema_version = "1.4"

# Trial reward = the mean of each step's `reward`. A step's reward is
# `correctness x mean_f( ln(max(1, speedup_f)) )` over the functions in its
# scope -- i.e. correctness x ln(geometric mean of the per-function speedups).
# Correctness is binary and multiplies, so a tree that changes behaviour scores
# 0 however fast it is; a correct but unimproved tree scores 0 too.
# Headroom screened at package time: 66 scored functions (84 restored functions
# screened), geometric mean 5.53x across the seven steps (per-step 3.70 to
# 7.23x).
multi_step_reward_strategy = "mean"

# `build` and `bld` are the two build trees the documented recipe creates
# (workdir/BENCHMARK.md): the project's ctest tree in `/app/build` and the
# timer's tree in `/app/tools/bld`. An exclude pattern matches a path component
# at ANY depth, so this was audited against the real image rather than against
# intent (docs/…/taskgen-instruction.md §10): the only directories named `build`
# or `bld` anywhere under /app are those two. Notably simdutf's own `tools/`
# and `tests/reference/` are NOT excluded -- excluding those two names is the
# shipped bug that removed `Tools/build/` from every CPython candidate's tree.
#
# The list is now a size/cleanliness choice only.  It used to be load-bearing:
# an upstream build rule planted an ABSOLUTE symlink
# (`<builddir>/tools/fastbase64.coreutils -> <absolute>/tools/fastbase64`) in
# every CMake tree of this source, and the artifact snapshot extracts the /app
# tarball host-side with Python's `tarfile` "data" filter, which raises
# `AbsoluteLinkError` for any symlink whose target is absolute.  That aborts
# the whole /app download (best-effort: logged, manifest entry
# `status=failed`), the verifier's separate container receives no
# `/app/simdutf`, and the step reads `missing /app/simdutf` -> correctness 0 on
# a correct tree.  The offender follows the build directory, and candidates
# choose their own scratch names -- graded runs used `tools/bld`, `m7/bld_base`
# and `dev/base_bld` -- so no component list can cover them all.  The class is
# therefore closed at the source instead: `environment/Dockerfile` runs
# `vendor/relativize-fastbase64-symlink.py`, which rewrites that POST_BUILD
# rule to the relative target upstream's own install rule uses, and a build
# into ANY directory then creates no absolute symlink.  Do not re-introduce a
# build tree under /app without re-checking that (the audit command is in
# tmp/simdutf-transcoding-simd/fix2/repro_rollout2.out.txt).
artifacts = [
  { source = "/app", destination = "workspace", exclude = ["build", "bld", "m7"] },
]

[task]
name = "harbor/simdutf-transcoding-simd"
version = "1.0.0"
description = "Optimize simdutf's Unicode transcoding surface one operation family at a time. Seven cumulative steps, each rewarded by the measured per-function speedup of the family that step owns, gated on bit-exact output and an unchanged error-position contract."
authors = [{ name = "Klavis AI", email = "connect@klavis.ai" }]
keywords = ["performance", "optimization", "simd", "unicode", "simdutf", "multi-step"]

[metadata]
difficulty = "very hard"
category = "programming"
tags = ["performance-optimization", "multi-step", "c++", "simd", "unicode", "transcoding"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
mcp_servers = []
workdir = "/app"
network_mode = "public"

[verifier]
environment_mode = "separate"

# The verifier image builds the pinned tree once, routes all seven families at
# the portable reference and runs upstream's 90-test suite over it; the grading
# run then builds the candidate with the same flags and runs the same suite
# against the recorded base failures. cpus must stay >= 2 because measurement
# pins to cores 0,1.
[verifier.environment]
build_timeout_sec = 2700.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
workdir = "/app"
network_mode = "public"

[[steps]]
name = "01-utf8-decode"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "02-utf16-to-utf8"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "03-utf32-to-utf8"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "04-utf16-utf32"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "05-latin1"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "06-base64"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "07-validate-find"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[agent]
# The agent's work runs against an allowlist: only the inference endpoint is
# reachable at the network layer, so an upstream copy cannot be fetched by any
# route -- git, release tarball, package registry or docs mirror. The runner
# merges its own model host in at launch, so no host is pinned here.
network_mode = "allowlist"
