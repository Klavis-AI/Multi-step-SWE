schema_version = "1.4"

# Task reward = the mean of each step's `reward`. No min_reward gate, so every
# step runs and each verifier reports a step-local score.
multi_step_reward_strategy = "mean"

# The cumulative /app workspace is the only thing that reaches the verifier
# container. The decoder is JavaScript, so nothing is excluded and nothing is
# rebuilt: the verifier runs `node` against the sources the agent left behind.
artifacts = [
  { source = "/app", destination = "workspace", exclude = [] },
]

[task]
name = "harbor/h264-decoder-profile-chain"
version = "1.0.0"
description = "Five-step H.264/AVC decoder task: carry one decoder written in JavaScript from the Baseline profile to the MVC amendment, keeping every earlier profile bit-exact on the ITU-T H.264.1 conformance bitstreams."
authors = [{ name = "Klavis AI", email = "connect@klavis.ai" }]
keywords = ["h264", "avc", "video", "decoder", "itu-t", "conformance", "multi-step"]

[metadata]
difficulty = "very hard"
category = "programming"
tags = ["h264", "video-codec", "conformance", "javascript", "multi-step"]

[environment]
build_timeout_sec = 1800.0
cpus = 7
memory_mb = 16384
storage_mb = 20480
gpus = 0
mcp_servers = []
workdir = "/app"
# Public only for image setup: Harbor installs the agent harness under this
# baseline. The agent phase has no network; see [agent].
network_mode = "public"

[verifier]
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 2400.0
cpus = 7
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/app"
network_mode = "public"

# No network while the agent works (the oracle's solve.sh runs in this phase
# too): everything a solution needs is installed in environment/Dockerfile.
# Runs must let the agent reach its model API: `--allow-agent-host <api host>`.
[agent]
network_mode = "no-network"

[[steps]]
name = "01-baseline"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "02-main"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "03-extended"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "04-frext-high"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "05-mvc"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0
