schema_version = "1.4"

# Trial reward = the mean of each step's `reward`. A step's reward is
# `correctness x mean_f( ln(max(1, speedup_f)) )` over the functions in its
# scope -- i.e. correctness x ln(geometric mean of the per-function speedups).
# Correctness is binary and multiplies, so a tree that changes behaviour scores
# 0 however fast it is; a correct but unimproved tree scores 0 too.
multi_step_reward_strategy = "mean"

# The verifier rebuilds from source, so build output is not carried forward.
artifacts = [
  { source = "/app", destination = "workspace", exclude = ["build"] },
]

[task]
name = "harbor/simd-image-primitives"
version = "1.0.0"
description = "Optimize the Simd computer-vision primitive library one algorithm family at a time, portable C++ to hand-written SSE4.1/AVX2. Eight cumulative steps, each measured by per-function speedup gated on bit-exact output."
authors = [{ name = "Klavis AI", email = "connect@klavis.ai" }]
keywords = ["performance", "optimization", "simd", "sse41", "avx2", "computer-vision", "multi-step"]

[metadata]
difficulty = "very hard"
category = "programming"
tags = ["performance-optimization", "multi-step", "c++", "simd", "image-processing"]

[environment]
build_timeout_sec = 2700.0
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0
mcp_servers = []
workdir = "/app"
network_mode = "public"

# The verifier gets the candidate's cumulative /app, restores the frozen set
# from the pin, and builds one tree.  cpus=4 because measurement pins to cores
# 0,1 and the build is 600 translation units.
[verifier]
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0
workdir = "/app"
network_mode = "public"

[[steps]]
name = "01-resizer"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 7200.0

[[steps]]
name = "02-blur"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 7200.0

[[steps]]
name = "03-edges"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 7200.0

[[steps]]
name = "04-cascade"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 7200.0

[[steps]]
name = "05-hog"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 7200.0

[[steps]]
name = "06-warp"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 7200.0

[[steps]]
name = "07-stats"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 7200.0

[[steps]]
name = "08-background"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 7200.0

[agent]
# The agent's work runs against an allowlist: only the inference endpoint is
# reachable at the network layer, so an upstream copy cannot be fetched by any
# route -- git, release tarball, package registry or docs mirror. The runner
# merges its own model host in at launch, so no host is pinned here.
network_mode = "allowlist"
