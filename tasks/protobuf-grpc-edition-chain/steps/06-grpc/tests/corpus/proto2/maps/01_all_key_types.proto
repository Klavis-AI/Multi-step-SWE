// DESC: All twelve legal map key types in one message
syntax = "proto2";
package c2.maps.all_key_types;

// Every legal map key type, each with a string value.
message AllKeyTypes {
  map<int32, string> k_int32 = 1;
  map<int64, string> k_int64 = 2;
  map<uint32, string> k_uint32 = 3;
  map<uint64, string> k_uint64 = 4;
  map<sint32, string> k_sint32 = 5;
  map<sint64, string> k_sint64 = 6;
  map<fixed32, string> k_fixed32 = 7;
  map<fixed64, string> k_fixed64 = 8;
  map<sfixed32, string> k_sfixed32 = 9;
  map<sfixed64, string> k_sfixed64 = 10;
  map<bool, string> k_bool = 11;
  map<string, string> k_string = 12;
}
