// DESC: Enum fields where the implicit default is the first declared value, not zero
syntax = "proto2";
package c2.enums.enum_default_selection;

enum Pick {
  PICK_FIRST = 3;
  PICK_SECOND = 4;
  PICK_THIRD = 5;
}

message DefaultSelection {
  // No default: the implicit default is the FIRST declared value (3), not zero.
  optional Pick implicit = 1;
  optional Pick explicit_first = 2 [default = PICK_FIRST];
  optional Pick explicit_other = 3 [default = PICK_THIRD];
  required Pick required_explicit = 4 [default = PICK_SECOND];
}
