// DESC: Enum reserved numbers, ranges, to-max and reserved names
syntax = "proto2";
package c2.enums.enum_reserved;

enum ReservedEnum {
  RESERVED_ENUM_ZERO = 0;
  RESERVED_ENUM_ONE = 1;
  reserved 2, 3;
  reserved 10 to 20;
  reserved 1000 to max;
  reserved "RESERVED_ENUM_REMOVED", "RESERVED_ENUM_ALSO_GONE";
}

message UsesReservedEnum {
  optional ReservedEnum r = 1;
}
