// DESC: Enum reserved numbers, ranges, to-max, names and negative reserved ranges
syntax = "proto2";
package c2.reserved.reserved_in_enums;

enum ReservedInEnum {
  RESERVED_IN_ENUM_ZERO = 0;
  reserved 1;
  reserved 2 to 4;
  reserved 5, 6;
  reserved 9000 to max;
  reserved "REMOVED_ONE";
  reserved "REMOVED_TWO", "REMOVED_THREE";
  RESERVED_IN_ENUM_SEVEN = 7;
}

// Enum reserved ranges may include negative numbers.
enum NegativeReserved {
  NEGATIVE_RESERVED_ZERO = 0;
  reserved -10 to -2;
  reserved -100;
}
