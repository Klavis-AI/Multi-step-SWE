// DESC: Extension numbers at 1, 15, 16, 18999, 20000 and 536870911
syntax = "proto2";
package c2.extensions.extension_number_boundaries;

message Host {
  extensions 1 to 18999;
  extensions 20000 to max;
}

extend Host {
  optional int32 lowest = 1;
  optional int32 one_byte_tag_end = 15;
  optional int32 two_byte_tag_start = 16;
  optional int32 last_before_impl_reserved = 18999;
  optional int32 first_after_impl_reserved = 20000;
  optional int32 highest = 536870911;
}
