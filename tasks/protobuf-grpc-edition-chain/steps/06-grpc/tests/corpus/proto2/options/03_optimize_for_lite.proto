// DESC: optimize_for = LITE_RUNTIME with Java naming options
syntax = "proto2";
package c2.options.optimize_for_lite;

option optimize_for = LITE_RUNTIME;
option java_package = "com.example.corpus.lite";
option java_outer_classname = "LiteProto";

message Lite {
  optional int32 v = 1;
  repeated string s = 2;
}
