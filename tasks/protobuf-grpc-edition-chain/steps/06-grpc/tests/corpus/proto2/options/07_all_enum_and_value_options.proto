// DESC: Every EnumOptions and EnumValueOptions field settable in a .proto file
syntax = "proto2";
package c2.options.all_enum_and_value_options;

enum AllEnumOptions {
  option allow_alias = true;
  option deprecated = true;
  ALL_ENUM_OPTIONS_ZERO = 0;
  ALL_ENUM_OPTIONS_ONE = 1 [deprecated = true];
  ALL_ENUM_OPTIONS_ONE_ALIAS = 1;
  ALL_ENUM_OPTIONS_SECRET = 2 [debug_redact = true];
  ALL_ENUM_OPTIONS_BOTH = 3 [deprecated = true, debug_redact = true];
}

enum PlainEnum {
  option deprecated = false;
  PLAIN_ENUM_ZERO = 0;
}

message M { optional AllEnumOptions a = 1; optional PlainEnum p = 2; }
