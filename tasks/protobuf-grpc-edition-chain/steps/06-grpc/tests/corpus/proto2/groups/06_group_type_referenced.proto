// DESC: The implicit message a group declares referenced relatively and fully qualified
syntax = "proto2";
package c2.groups.group_type_referenced;

// The implicit message a group declares can be referenced by name elsewhere,
// both relatively and fully-qualified.
message Holder {
  optional group Slot = 1 {
    optional int32 v = 1;
  }
}

message User {
  optional Holder.Slot relative_ref = 1;
  optional .c2.groups.group_type_referenced.Holder.Slot qualified_ref = 2;
  repeated Holder.Slot many = 3;
}
