// DESC: An unlabelled group as a oneof member, which protoc v32.1 accepts
syntax = "proto2";
package c2.groups.group_in_oneof;

// protoc v32.1 accepts an unlabelled group as a oneof member; the synthesized
// field carries type TYPE_GROUP and an oneof_index.
message GroupInOneof {
  oneof choice {
    int32 number = 1;
    string text = 2;
    group Structured = 3 {
      optional int32 a = 1;
      repeated string b = 2;
    }
  }
}
