// DESC: A group body declaring nested messages, enums, reserved, extensions and a oneof
syntax = "proto2";
package c2.groups.group_with_nested_types;

// A group body is a full message body: it may declare nested messages, enums,
// extension ranges, reserved ranges and oneofs of its own.
message GroupWithNestedTypes {
  optional group Body = 1 {
    message Helper { optional int32 h = 1; }
    enum Mode { MODE_A = 0; MODE_B = 1; }
    reserved 50 to 60;
    reserved "gone";
    extensions 100 to 200;
    optional Helper helper = 1;
    optional Mode mode = 2;
    oneof pick { int32 i = 3; string s = 4; }
  }
}
