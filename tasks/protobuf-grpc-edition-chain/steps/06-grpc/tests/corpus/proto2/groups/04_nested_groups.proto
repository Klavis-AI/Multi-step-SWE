// DESC: Three levels of groups nested inside one another
syntax = "proto2";
package c2.groups.nested_groups;

message NestedGroups {
  optional group Outer = 1 {
    optional int32 o = 1;
    optional group Middle = 2 {
      optional int32 m = 1;
      repeated group Inner = 2 {
        optional int32 i = 1;
      }
    }
  }
}
