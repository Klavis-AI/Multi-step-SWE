// DESC: Nested type names reused as field names and as enum names in inner scopes
syntax = "proto2";
package c2.nested.nested_type_name_reuse;

// A nested message may share its simple name with its own field names and with
// enum types in a different scope.
message Outer {
  message Outer2 {
    message Outer3 { optional int32 v = 1; }
    optional Outer3 outer3 = 1;
  }
  optional Outer2 outer2 = 1;
  optional int32 outer = 2;

  enum Kind { KIND_ZERO = 0; }
  optional Kind kind = 3;

  message Kind2 {
    enum Kind { KIND_ZERO = 0; }
    optional Kind kind = 1;
    optional .c2.nested.nested_type_name_reuse.Outer.Kind outer_kind = 2;
  }
  optional Kind2 kind2 = 4;
}
