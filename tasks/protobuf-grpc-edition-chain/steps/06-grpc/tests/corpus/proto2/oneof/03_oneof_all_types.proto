// DESC: A oneof containing every scalar type plus a message and an enum member
syntax = "proto2";
package c2.oneof.oneof_all_types;

message OneofAllTypes {
  oneof everything {
    double o_double = 1;
    float o_float = 2;
    int32 o_int32 = 3;
    int64 o_int64 = 4;
    uint32 o_uint32 = 5;
    uint64 o_uint64 = 6;
    sint32 o_sint32 = 7;
    sint64 o_sint64 = 8;
    fixed32 o_fixed32 = 9;
    fixed64 o_fixed64 = 10;
    sfixed32 o_sfixed32 = 11;
    sfixed64 o_sfixed64 = 12;
    bool o_bool = 13;
    string o_string = 14;
    bytes o_bytes = 15;
    Sub o_message = 16;
    Kind o_enum = 17;
  }
  message Sub { optional int32 v = 1; }
  enum Kind { KIND_ZERO = 0; KIND_ONE = 1; }
}
