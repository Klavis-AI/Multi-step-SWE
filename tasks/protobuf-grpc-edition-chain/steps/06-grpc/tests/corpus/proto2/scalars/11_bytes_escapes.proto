// DESC: bytes defaults covering NUL, high bytes, hex, octal and concatenated literals
syntax = "proto2";
package c2.scalars.bytes_escapes;

message BytesEscapes {
  optional bytes nul_and_high = 1 [default = "\000\001\376\377"];
  optional bytes hex_bytes = 2 [default = "\xde\xad\xbe\xef"];
  optional bytes octal_bytes = 3 [default = "\336\255\276\357"];
  optional bytes control_chars = 4 [default = "\a\b\f\n\r\t\v"];
  optional bytes mixed = 5 [default = "ABC\x00DEF\377"];
  optional bytes empty_bytes = 6 [default = ""];
  optional bytes backslash = 7 [default = "back\\slash"];
  optional bytes concatenated = 8 [default = "\x01\x02" "\x03\x04"];
}
