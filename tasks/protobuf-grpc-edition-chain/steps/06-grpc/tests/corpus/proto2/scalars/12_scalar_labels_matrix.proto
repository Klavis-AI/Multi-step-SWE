// DESC: Each label crossed with one scalar from every wire-type class
syntax = "proto2";
package c2.scalars.scalar_labels_matrix;

// Each label applied to a representative scalar of each wire class.
message ScalarLabelsMatrix {
  required int32 req_varint = 1;
  required fixed64 req_fixed64 = 2;
  required fixed32 req_fixed32 = 3;
  required string req_delimited = 4;
  optional int32 opt_varint = 5;
  optional fixed64 opt_fixed64 = 6;
  optional fixed32 opt_fixed32 = 7;
  optional bytes opt_delimited = 8;
  repeated int32 rep_varint = 9;
  repeated fixed64 rep_fixed64 = 10;
  repeated fixed32 rep_fixed32 = 11;
  repeated string rep_delimited = 12;
}
