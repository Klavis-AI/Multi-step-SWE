// DESC: int32/sint32/sfixed32 defaults at the 32-bit signed minimum and maximum
syntax = "proto2";
package c2.scalars.int32_boundaries;

message Int32Boundaries {
  optional int32 min_int32 = 1 [default = -2147483648];
  optional int32 max_int32 = 2 [default = 2147483647];
  optional int32 minus_one = 3 [default = -1];
  optional int32 zero = 4 [default = 0];
  optional sint32 min_sint32 = 5 [default = -2147483648];
  optional sint32 max_sint32 = 6 [default = 2147483647];
  optional sfixed32 min_sfixed32 = 7 [default = -2147483648];
  optional sfixed32 max_sfixed32 = 8 [default = 2147483647];
}
