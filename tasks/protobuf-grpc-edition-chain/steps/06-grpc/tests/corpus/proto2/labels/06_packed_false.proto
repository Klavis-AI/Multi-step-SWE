// DESC: Every packable numeric and enum type with explicit packed=false
syntax = "proto2";
package c2.labels.packed_false;

// Same set as packed_true but explicitly unpacked (proto2's default).
message PackedFalse {
  repeated int32 u_int32 = 1 [packed = false];
  repeated int64 u_int64 = 2 [packed = false];
  repeated uint32 u_uint32 = 3 [packed = false];
  repeated uint64 u_uint64 = 4 [packed = false];
  repeated sint32 u_sint32 = 5 [packed = false];
  repeated sint64 u_sint64 = 6 [packed = false];
  repeated fixed32 u_fixed32 = 7 [packed = false];
  repeated fixed64 u_fixed64 = 8 [packed = false];
  repeated sfixed32 u_sfixed32 = 9 [packed = false];
  repeated sfixed64 u_sfixed64 = 10 [packed = false];
  repeated float u_float = 11 [packed = false];
  repeated double u_double = 12 [packed = false];
  repeated bool u_bool = 13 [packed = false];
  repeated Shade u_enum = 14 [packed = false];
}
enum Shade { SHADE_LIGHT = 0; SHADE_DARK = 1; }
