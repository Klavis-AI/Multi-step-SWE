// DESC: Every packable numeric and enum type with explicit packed=true
syntax = "proto2";
package c2.labels.packed_true;

// Every packable numeric type explicitly packed.
message PackedTrue {
  repeated int32 p_int32 = 1 [packed = true];
  repeated int64 p_int64 = 2 [packed = true];
  repeated uint32 p_uint32 = 3 [packed = true];
  repeated uint64 p_uint64 = 4 [packed = true];
  repeated sint32 p_sint32 = 5 [packed = true];
  repeated sint64 p_sint64 = 6 [packed = true];
  repeated fixed32 p_fixed32 = 7 [packed = true];
  repeated fixed64 p_fixed64 = 8 [packed = true];
  repeated sfixed32 p_sfixed32 = 9 [packed = true];
  repeated sfixed64 p_sfixed64 = 10 [packed = true];
  repeated float p_float = 11 [packed = true];
  repeated double p_double = 12 [packed = true];
  repeated bool p_bool = 13 [packed = true];
  repeated Color p_enum = 14 [packed = true];
}
enum Color { COLOR_RED = 0; COLOR_GREEN = 1; }
