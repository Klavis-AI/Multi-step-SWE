syntax = "proto3";
package p3.maps;
message AllKeys {
  map<int32,string> a = 1; map<int64,string> b = 2; map<uint32,string> c = 3;
  map<uint64,string> d = 4; map<sint32,string> e = 5; map<sint64,string> f = 6;
  map<fixed32,string> g = 7; map<fixed64,string> h = 8;
  map<sfixed32,string> i = 9; map<sfixed64,string> j = 10;
  map<bool,string> k = 11; map<string,string> l = 12;
}
