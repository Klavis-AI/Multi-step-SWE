// DESC: Custom ExtensionRangeOptions extensions attached to extension ranges
syntax = "proto2";
package c2.extensions.custom_extension_range_options;

import "google/protobuf/descriptor.proto";

extend google.protobuf.ExtensionRangeOptions {
  optional string range_owner = 50401;
  repeated int32 range_codes = 50402;
}

message Host {
  optional int32 a = 1;
  extensions 100 to 200 [(range_owner) = "team-a", (range_codes) = 1, (range_codes) = 2];
  extensions 300 to 400 [(range_owner) = "team-b"];
  extensions 500 to max;
}

extend Host { optional int32 in_team_a = 100; optional int32 in_team_b = 300; }
