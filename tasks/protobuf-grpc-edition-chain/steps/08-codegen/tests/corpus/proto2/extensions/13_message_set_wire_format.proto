// DESC: A message_set_wire_format host extended by two message_set_extension items
syntax = "proto2";
package c2.extensions.message_set_wire_format;

message LegacySet {
  option message_set_wire_format = true;
  extensions 4 to max;
}

message ItemA {
  extend LegacySet { optional ItemA message_set_extension = 1000; }
  optional int32 v = 1;
}

message ItemB {
  extend LegacySet { optional ItemB message_set_extension = 1001; }
  optional string s = 1;
}
