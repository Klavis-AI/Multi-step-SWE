// DESC: extend blocks nested one, two and three messages deep
syntax = "proto2";
package c2.extensions.nested_extend;

message Host { extensions 1 to 1000; }

// `extend` blocks may appear inside messages at any depth; the extension's
// full name is scoped by the enclosing message.
message Holder {
  extend Host { optional int32 one_deep = 10; }
  optional int32 own_field = 1;

  message Deeper {
    extend Host { optional string two_deep = 11; }
    message Deepest {
      extend Host { optional bool three_deep = 12; }
    }
  }
}

message OtherHolder {
  // Same simple extension name as Holder.one_deep, different scope.
  extend Host { optional int32 one_deep = 13; }
}
