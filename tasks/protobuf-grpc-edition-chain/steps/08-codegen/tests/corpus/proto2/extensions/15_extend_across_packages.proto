// DESC: One file extending messages from two different foreign packages
syntax = "proto2";
package c2.extensions.extend_across_packages;

import "imports/01_dep_base.proto";
import "extensions/01_extend_local.proto";

// Extending two messages from two different foreign packages in one file.
extend c2.imports.dep_base.BaseMessage {
  optional string from_other_package = 200;
}

extend c2.extensions.extend_local.Host {
  optional string from_sibling_stratum = 150;
}

message Combined {
  optional c2.imports.dep_base.BaseMessage a = 1;
  optional c2.extensions.extend_local.Host b = 2;
}
