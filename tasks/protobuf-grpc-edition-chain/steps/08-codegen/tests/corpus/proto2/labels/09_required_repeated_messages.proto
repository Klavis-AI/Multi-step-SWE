// DESC: required/repeated/optional message fields plus a repeated group
syntax = "proto2";
package c2.labels.required_repeated_messages;

message Leaf {
  required int32 id = 1;
  optional string label = 2;
}

message RequiredRepeatedMessages {
  required Leaf head = 1;
  repeated Leaf tail = 2;
  optional Leaf maybe = 3;
  repeated group Entry = 4 {
    required int32 key = 1;
    optional Leaf value = 2;
  }
}
