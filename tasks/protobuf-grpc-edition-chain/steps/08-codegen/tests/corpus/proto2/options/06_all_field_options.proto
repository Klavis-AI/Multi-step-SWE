// DESC: Every FieldOptions field settable in a .proto file, including all ctype/jstype values
syntax = "proto2";
package c2.options.all_field_options;

message AllFieldOptions {
  optional string ctype_string = 1 [ctype = STRING];
  optional bytes ctype_cord = 2 [ctype = CORD];
  optional string ctype_piece = 3 [ctype = STRING_PIECE];
  repeated int32 packed_on = 4 [packed = true];
  repeated int32 packed_off = 5 [packed = false];
  optional int64 jstype_normal = 6 [jstype = JS_NORMAL];
  optional int64 jstype_string = 7 [jstype = JS_STRING];
  optional int64 jstype_number = 8 [jstype = JS_NUMBER];
  optional Sub lazy_field = 9 [lazy = true];
  optional Sub unverified_lazy_field = 10 [unverified_lazy = true];
  optional int32 deprecated_field = 11 [deprecated = true];
  optional string redacted_field = 12 [debug_redact = true];
  optional int32 renamed = 13 [json_name = "customJsonName"];
  optional int32 defaulted = 14 [default = 99];
  optional int32 many_options = 15 [
    deprecated = true,
    json_name = "many",
    default = 1,
    jstype = JS_NORMAL
  ];

  message Sub { optional int32 v = 1; }
}
