// DESC: Every ServiceOptions and MethodOptions field, including all idempotency levels
syntax = "proto2";
package c2.options.all_service_and_method_options;

message M { optional int32 v = 1; }

service AllServiceOptions {
  option deprecated = true;
  rpc A(M) returns (M) { option deprecated = true; }
  rpc B(M) returns (M) { option idempotency_level = IDEMPOTENCY_UNKNOWN; }
  rpc C(M) returns (M) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc D(M) returns (M) { option idempotency_level = IDEMPOTENT; }
  rpc E(stream M) returns (stream M) {
    option deprecated = false;
    option idempotency_level = IDEMPOTENT;
  }
}
