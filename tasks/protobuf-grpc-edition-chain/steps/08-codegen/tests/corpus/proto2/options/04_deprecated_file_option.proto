// DESC: java_generate_equals_and_hash, a deprecated file option protoc still accepts
syntax = "proto2";
package c2.options.deprecated_file_option;

// java_generate_equals_and_hash is itself marked deprecated in descriptor.proto
// but is still accepted by protoc v32.1.
option java_generate_equals_and_hash = true;

message M { optional int32 v = 1; }
