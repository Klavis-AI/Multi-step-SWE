// DESC: allow_alias, deprecated on the enum, and deprecated/debug_redact on values
syntax = "proto2";
package c2.enums.enum_options;

enum WithOptions {
  option allow_alias = true;
  option deprecated = true;
  WITH_OPTIONS_ZERO = 0;
  WITH_OPTIONS_OLD = 1 [deprecated = true];
  WITH_OPTIONS_NEW = 1;
  WITH_OPTIONS_REDACTED = 2 [debug_redact = true];
}

message UsesWithOptions {
  optional WithOptions w = 1;
}
