// DESC: Enums nested one and two levels deep, referenced relatively and fully qualified
syntax = "proto2";
package c2.enums.nested_enum;

message Outer {
  enum Status {
    STATUS_UNKNOWN = 0;
    STATUS_OK = 1;
    STATUS_FAIL = 2;
  }
  optional Status status = 1;

  message Inner {
    enum Kind {
      KIND_NONE = 0;
      KIND_SOME = 1;
    }
    optional Kind kind = 1;
    optional Status outer_status = 2;
  }
  optional Inner inner = 2;
}

message RefersToNested {
  optional Outer.Status rel = 1;
  optional .c2.enums.nested_enum.Outer.Inner.Kind fq = 2;
}
