// DESC: allow_alias with several names mapping to the same numbers, plus an alias default
syntax = "proto2";
package c2.enums.allow_alias;

enum Aliased {
  option allow_alias = true;
  ALIASED_ZERO = 0;
  ALIASED_ORIGINAL = 1;
  ALIASED_SYNONYM = 1;
  ALIASED_THIRD_NAME = 1;
  ALIASED_TWO = 2;
  ALIASED_TWO_ALIAS = 2;
}

message UsesAliased {
  optional Aliased a = 1 [default = ALIASED_SYNONYM];
}
