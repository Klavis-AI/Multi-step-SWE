// DESC: Three oneofs interleaved with ordinary fields in one message
syntax = "proto2";
package c2.oneof.multiple_oneofs;

message MultipleOneofs {
  optional int32 plain = 1;
  oneof first {
    int32 f1 = 2;
    string f2 = 3;
  }
  optional int32 between = 4;
  oneof second {
    bool s1 = 5;
    double s2 = 6;
  }
  oneof third {
    fixed32 t1 = 7;
  }
  repeated int32 trailing = 8;
}
