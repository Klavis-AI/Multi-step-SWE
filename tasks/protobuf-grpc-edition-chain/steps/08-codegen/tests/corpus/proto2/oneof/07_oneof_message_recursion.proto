// DESC: A recursive expression tree built from a oneof of message members
syntax = "proto2";
package c2.oneof.oneof_message_recursion;

message Expr {
  oneof node {
    int64 literal = 1;
    string variable = 2;
    Binary binary = 3;
    Unary unary = 4;
  }
  message Binary {
    required Expr lhs = 1;
    required Expr rhs = 2;
    required Op op = 3;
  }
  message Unary {
    required Expr operand = 1;
  }
  enum Op { OP_ADD = 0; OP_SUB = 1; OP_MUL = 2; }
}
