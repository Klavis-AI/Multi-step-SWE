// DESC: Reserved declarations inside nested messages, an enum and a group body
syntax = "proto2";
package c2.reserved.reserved_nested_scopes;

message Outer {
  reserved 5 to 9;
  reserved "outer_gone";
  optional int32 a = 1;

  message Inner {
    reserved 1 to 3;
    reserved "inner_gone";
    optional int32 b = 4;

    enum InnerEnum {
      INNER_ENUM_ZERO = 0;
      reserved 1 to 5;
      reserved "INNER_ENUM_GONE";
    }
  }
  optional Inner inner = 10;

  optional group Grp = 11 {
    reserved 7 to 12;
    reserved "grp_gone";
    optional int32 c = 1;
  }
}
