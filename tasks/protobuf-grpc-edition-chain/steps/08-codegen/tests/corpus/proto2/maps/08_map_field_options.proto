// DESC: Field options applied to map fields
syntax = "proto2";
package c2.maps.map_field_options;

message MapFieldOptions {
  map<string, int32> deprecated_map = 1 [deprecated = true];
  map<string, int32> renamed_map = 2 [json_name = "rm"];
  map<string, string> redacted_map = 3 [debug_redact = true];
  map<int64, int64> plain_map = 4;
}
