// DESC: Maps with message values, including a self-recursive map value
syntax = "proto2";
package c2.maps.message_values;

message Value {
  optional int32 id = 1;
  optional string label = 2;
}

message MessageValues {
  map<string, Value> by_name = 1;
  map<int32, Value> by_id = 2;
  map<string, Nested> by_nested = 3;
  map<string, MessageValues> recursive = 4;

  message Nested { optional bool flag = 1; }
}
