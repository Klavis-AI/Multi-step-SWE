// DESC: Field names of varied shape, exercising synthetic MapEntry nested-type naming
syntax = "proto2";
package c2.maps.map_entry_naming;

// The synthetic map-entry nested message name is the CamelCased field name with
// "Entry" appended; these names must not collide with real nested types.
message MapEntryNaming {
  map<string, int32> simple = 1;
  map<string, int32> snake_case_name = 2;
  map<string, int32> withDigits123 = 3;
  map<string, int32> a = 4;
  map<string, int32> _leading_underscore = 5;
  map<string, int32> trailing_ = 6;
}
