// DESC: Plain, public, weak and well-known-type imports in one file
syntax = "proto2";
package c2.imports.multi_import_mixed_kinds;

// Plain, public and weak imports in one file.
import "imports/06_dep_mid_a.proto";
import public "imports/09_transitive_chain_1.proto";
import weak "imports/07_dep_mid_b.proto";
import "google/protobuf/duration.proto";

message MixedKinds {
  optional c2.imports.dep_mid_a.MidA plain = 1;
  optional c2.imports.transitive_chain_1.Link1 public_dep = 2;
  optional c2.imports.dep_mid_b.MidB weak_dep = 3;
  optional google.protobuf.Duration wkt = 4;
}
