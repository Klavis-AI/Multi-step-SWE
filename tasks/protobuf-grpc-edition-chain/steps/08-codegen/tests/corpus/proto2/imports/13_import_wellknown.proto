// DESC: Imports and uses twelve well-known types from google/protobuf
syntax = "proto2";
package c2.imports.import_wellknown;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";

message ImportWellKnown {
  optional google.protobuf.Any any = 1;
  optional google.protobuf.Duration duration = 2;
  optional google.protobuf.Timestamp timestamp = 3;
  optional google.protobuf.Empty empty = 4;
  optional google.protobuf.FieldMask mask = 5;
  optional google.protobuf.Struct strukt = 6;
  optional google.protobuf.Value value = 7;
  optional google.protobuf.ListValue list_value = 8;
  optional google.protobuf.NullValue null_value = 9;
  optional google.protobuf.Int32Value i32 = 10;
  optional google.protobuf.StringValue s = 11;
  optional google.protobuf.BoolValue b = 12;
}
