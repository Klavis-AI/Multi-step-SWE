// DESC: Diamond import: two arms that both import the same base file
syntax = "proto2";
package c2.imports.diamond_import;

// Diamond: this file imports two files that both import 01_dep_base.proto.
import "imports/06_dep_mid_a.proto";
import "imports/07_dep_mid_b.proto";

message DiamondImport {
  optional c2.imports.dep_mid_a.MidA a = 1;
  optional c2.imports.dep_mid_b.MidB b = 2;
  // Not directly importable here: BaseMessage is only reachable through the
  // mid files, which import it non-publicly, so it is referenced via MidA/MidB.
  optional int32 marker = 3;
}
