// DESC: Uses link 1 and link 2 types reached through two hops of import public
syntax = "proto2";
package c2.imports.transitive_chain_leaf;

// Only imports Link3, but Link1 and Link2 arrive through two hops of
// `import public`.
import "imports/11_transitive_chain_3.proto";

message Leaf {
  optional c2.imports.transitive_chain_3.Link3 third = 1;
  optional c2.imports.transitive_chain_2.Link2 second = 2;
  optional c2.imports.transitive_chain_1.Link1 first = 3;
}
