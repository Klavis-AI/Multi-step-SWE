// DESC: A plain import, using the imported message, nested message and enum
syntax = "proto2";
package c2.imports.plain_import;

import "imports/01_dep_base.proto";

message PlainImport {
  optional c2.imports.dep_base.BaseMessage m = 1;
  optional c2.imports.dep_base.BaseMessage.BaseNested n = 2;
  optional c2.imports.dep_base.BaseEnum e = 3;
  optional .c2.imports.dep_base.BaseMessage fq = 4;
  repeated c2.imports.dep_base.BaseMessage many = 5;
  map<string, c2.imports.dep_base.BaseMessage> by_name = 6;
}
