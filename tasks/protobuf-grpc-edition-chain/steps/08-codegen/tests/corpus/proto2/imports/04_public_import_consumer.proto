// DESC: Uses types reached only through another file's import public
syntax = "proto2";
package c2.imports.public_import_consumer;

import "imports/03_dep_republisher.proto";

// BaseMessage is reachable transitively through the public import.
message PublicImportConsumer {
  optional c2.imports.dep_base.BaseMessage via_public = 1;
  optional c2.imports.dep_base.BaseEnum via_public_enum = 2;
  optional c2.imports.dep_republisher.Republished direct = 3;
}
