// DESC: Re-exports the base dependency with import public
syntax = "proto2";
package c2.imports.dep_republisher;

// Publicly re-exports 01_dep_base.proto, so importers of this file may use
// BaseMessage without importing it directly.
import public "imports/01_dep_base.proto";

message Republished {
  optional c2.imports.dep_base.BaseMessage inner = 1;
}
