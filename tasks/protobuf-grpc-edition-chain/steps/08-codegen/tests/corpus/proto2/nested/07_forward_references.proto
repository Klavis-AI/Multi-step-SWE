// DESC: Types referenced before they are declared, at several nesting depths
syntax = "proto2";
package c2.nested.forward_references;

// Types may be referenced before they are declared, at any nesting depth.
message UsesLater {
  optional Later l = 1;
  optional Later.Inner li = 2;
  optional .c2.nested.forward_references.Later.Inner.Deepest lid = 3;
  optional LaterEnum le = 4;
}

message Later {
  message Inner {
    message Deepest { optional int32 v = 1; }
    optional Deepest d = 1;
  }
  optional Inner i = 1;
  optional UsesLater back = 2;
}

enum LaterEnum { LATER_ENUM_ZERO = 0; }
