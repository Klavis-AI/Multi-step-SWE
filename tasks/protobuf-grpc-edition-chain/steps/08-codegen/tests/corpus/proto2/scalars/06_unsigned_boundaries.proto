// DESC: uint32/uint64/fixed32/fixed64 defaults at zero and the unsigned maximum
syntax = "proto2";
package c2.scalars.unsigned_boundaries;

message UnsignedBoundaries {
  optional uint32 zero_u32 = 1 [default = 0];
  optional uint32 max_uint32 = 2 [default = 4294967295];
  optional uint64 zero_u64 = 3 [default = 0];
  optional uint64 max_uint64 = 4 [default = 18446744073709551615];
  optional fixed32 max_fixed32 = 5 [default = 4294967295];
  optional fixed64 max_fixed64 = 6 [default = 18446744073709551615];
}
