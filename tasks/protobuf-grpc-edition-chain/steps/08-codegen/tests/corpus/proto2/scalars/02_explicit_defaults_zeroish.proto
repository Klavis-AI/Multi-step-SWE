// DESC: Every scalar type given an explicit default equal to its implicit default
syntax = "proto2";
package c2.scalars.explicit_defaults_zeroish;

// Every scalar type with an explicit default equal to the implicit default.
message ExplicitZeroDefaults {
  optional double f_double = 1 [default = 0];
  optional float f_float = 2 [default = 0];
  optional int32 f_int32 = 3 [default = 0];
  optional int64 f_int64 = 4 [default = 0];
  optional uint32 f_uint32 = 5 [default = 0];
  optional uint64 f_uint64 = 6 [default = 0];
  optional sint32 f_sint32 = 7 [default = 0];
  optional sint64 f_sint64 = 8 [default = 0];
  optional fixed32 f_fixed32 = 9 [default = 0];
  optional fixed64 f_fixed64 = 10 [default = 0];
  optional sfixed32 f_sfixed32 = 11 [default = 0];
  optional sfixed64 f_sfixed64 = 12 [default = 0];
  optional bool f_bool = 13 [default = false];
  optional string f_string = 14 [default = ""];
  optional bytes f_bytes = 15 [default = ""];
}
