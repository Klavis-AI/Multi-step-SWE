syntax = "proto3";
package s3.presence;
message AllOpt {
  optional int32 i32 = 1; optional uint32 u32 = 2; optional sint32 s32 = 3;
  optional fixed32 f32 = 4; optional sfixed32 sf32 = 5; optional float fl = 6;
  int32 gap = 7;
  optional int64 i64 = 8; optional uint64 u64 = 9; optional sint64 s64 = 10;
}
