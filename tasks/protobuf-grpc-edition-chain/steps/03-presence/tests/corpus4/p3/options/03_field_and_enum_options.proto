syntax = "proto3";
package s3.options;
import "google/protobuf/descriptor.proto";
extend google.protobuf.FieldOptions { bool secret = 50003; }
extend google.protobuf.EnumValueOptions { string note = 50004; }
enum E { E_ZERO = 0 [(note) = "zero"]; E_ONE = 1; }
message M { int32 a = 1 [(secret) = true]; optional int32 b = 2 [(secret) = false]; }
