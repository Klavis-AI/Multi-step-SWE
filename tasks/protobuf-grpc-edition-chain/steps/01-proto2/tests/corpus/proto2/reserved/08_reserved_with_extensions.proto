// DESC: Non-overlapping reserved and extension ranges in one message
syntax = "proto2";
package c2.reserved.reserved_with_extensions;

// Reserved ranges and extension ranges coexist as long as they do not overlap.
message ReservedWithExtensions {
  optional int32 a = 1;
  reserved 10 to 20;
  extensions 100 to 200;
  reserved 300 to 400;
  extensions 500 to max;
  reserved "dropped";
}
