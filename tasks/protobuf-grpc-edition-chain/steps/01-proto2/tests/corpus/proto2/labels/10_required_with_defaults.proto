// DESC: required fields that also carry default values, including an enum default
syntax = "proto2";
package c2.labels.required_with_defaults;

// `required` fields may still carry a default value in proto2.
message RequiredWithDefaults {
  required int32 a = 1 [default = 11];
  required string b = 2 [default = "dee"];
  required bool c = 3 [default = true];
  required double d = 4 [default = -inf];
  required Pick e = 5 [default = PICK_SECOND];
}
enum Pick { PICK_FIRST = 0; PICK_SECOND = 1; }
