// DESC: Repeated numerics with no packed option, so FieldOptions.packed stays absent
syntax = "proto2";
package c2.labels.packed_default_unset;

// No packed option at all: proto2 default is unpacked, and the descriptor must
// carry no `packed` entry in FieldOptions.
message PackedDefaultUnset {
  repeated int32 d_int32 = 1;
  repeated double d_double = 2;
  repeated bool d_bool = 3;
  repeated Level d_enum = 4;
  repeated string not_packable = 5;
  repeated bytes also_not_packable = 6;
}
enum Level { LEVEL_ZERO = 0; LEVEL_ONE = 1; }
