// DESC: packed=true, packed=false and unset packed in a single message
syntax = "proto2";
package c2.labels.packed_mixed_in_one_message;

message PackedMixed {
  repeated int32 packed_a = 1 [packed = true];
  repeated int32 unpacked_a = 2 [packed = false];
  repeated int32 default_a = 3;
  repeated sfixed64 packed_b = 4 [packed = true];
  repeated sfixed64 unpacked_b = 5 [packed = false];
  optional int32 singular = 6;
  required int32 mandatory = 7;
}
