// DESC: Methods using nested message types, relatively and fully qualified
syntax = "proto2";
package c2.services.service_nested_types;

message Api {
  message GetRequest { optional string id = 1; }
  message GetResponse { optional string body = 1; }
  message WatchEvent { optional int32 seq = 1; }
}

service NestedTypeService {
  rpc Get(Api.GetRequest) returns (Api.GetResponse);
  rpc Watch(Api.GetRequest) returns (stream Api.WatchEvent);
  rpc Upload(stream Api.GetRequest) returns (Api.GetResponse);
  rpc Qualified(.c2.services.service_nested_types.Api.GetRequest)
      returns (.c2.services.service_nested_types.Api.GetResponse);
}
