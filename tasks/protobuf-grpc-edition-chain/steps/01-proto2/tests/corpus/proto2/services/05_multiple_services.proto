// DESC: Three services in one file, two sharing a method name
syntax = "proto2";
package c2.services.multiple_services;

message A { optional int32 v = 1; }
message B { optional string v = 1; }

service First {
  rpc Method(A) returns (B);
}

service Second {
  rpc Method(B) returns (A);
}

service Third {
  rpc SameNameAsOthers(A) returns (A);
  rpc Another(B) returns (B);
}
