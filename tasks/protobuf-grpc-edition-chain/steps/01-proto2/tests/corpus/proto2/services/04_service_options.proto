// DESC: Service-level deprecated option set both true and false
syntax = "proto2";
package c2.services.service_options;

message M { optional int32 v = 1; }

service DeprecatedService {
  option deprecated = true;
  rpc Call(M) returns (M);
}

service PlainService {
  option deprecated = false;
  rpc Call(M) returns (M);
}
