// DESC: Method options: deprecated and every idempotency_level, plus an empty body
syntax = "proto2";
package c2.services.method_options;

message M { optional int32 v = 1; }

service MethodOptions {
  rpc Deprecated(M) returns (M) { option deprecated = true; }
  rpc NoSideEffects(M) returns (M) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc Idempotent(M) returns (M) { option idempotency_level = IDEMPOTENT; }
  rpc Unknown(M) returns (M) { option idempotency_level = IDEMPOTENCY_UNKNOWN; }
  rpc Both(stream M) returns (stream M) {
    option deprecated = true;
    option idempotency_level = IDEMPOTENT;
  }
  rpc EmptyBody(M) returns (M) {}
}
