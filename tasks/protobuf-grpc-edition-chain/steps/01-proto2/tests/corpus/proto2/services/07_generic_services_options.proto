// DESC: cc/java/py generic_services file options together with a service
syntax = "proto2";
package c2.services.generic_services_options;

option cc_generic_services = true;
option java_generic_services = true;
option py_generic_services = true;

message M { optional int32 v = 1; }

service GenericServices {
  rpc Call(M) returns (M);
  rpc Stream(stream M) returns (stream M);
}
