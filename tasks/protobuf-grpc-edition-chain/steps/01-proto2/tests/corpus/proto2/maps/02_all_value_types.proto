// DESC: All fifteen scalar map value types in one message
syntax = "proto2";
package c2.maps.all_value_types;

message AllValueTypes {
  map<string, double> v_double = 1;
  map<string, float> v_float = 2;
  map<string, int32> v_int32 = 3;
  map<string, int64> v_int64 = 4;
  map<string, uint32> v_uint32 = 5;
  map<string, uint64> v_uint64 = 6;
  map<string, sint32> v_sint32 = 7;
  map<string, sint64> v_sint64 = 8;
  map<string, fixed32> v_fixed32 = 9;
  map<string, fixed64> v_fixed64 = 10;
  map<string, sfixed32> v_sfixed32 = 11;
  map<string, sfixed64> v_sfixed64 = 12;
  map<string, bool> v_bool = 13;
  map<string, string> v_string = 14;
  map<string, bytes> v_bytes = 15;
}
