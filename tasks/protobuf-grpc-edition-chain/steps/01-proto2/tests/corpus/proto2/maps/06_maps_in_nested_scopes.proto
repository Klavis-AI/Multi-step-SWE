// DESC: Maps declared at three nesting levels and inside a group body
syntax = "proto2";
package c2.maps.maps_in_nested_scopes;

message Outer {
  map<string, int32> top = 1;
  message Inner {
    map<int64, string> mid = 1;
    message Deepest {
      map<bool, bytes> deep = 1;
    }
    optional Deepest d = 2;
  }
  optional Inner i = 2;
  optional group WithMap = 3 {
    map<string, Outer.Inner> in_group = 1;
  }
}
