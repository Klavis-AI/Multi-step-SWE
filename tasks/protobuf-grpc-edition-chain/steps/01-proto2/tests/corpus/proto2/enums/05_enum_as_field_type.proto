// DESC: An enum used as singular, required, repeated, packed, map-value, oneof and group field
syntax = "proto2";
package c2.enums.enum_as_field_type;

enum Flavor {
  FLAVOR_PLAIN = 0;
  FLAVOR_SWEET = 1;
  FLAVOR_SOUR = 2;
}

message EnumFields {
  optional Flavor single = 1;
  required Flavor mandatory = 2;
  repeated Flavor unpacked = 3;
  repeated Flavor packed = 4 [packed = true];
  optional Flavor with_default = 5 [default = FLAVOR_SOUR];
  map<string, Flavor> by_name = 6;
  oneof pick { Flavor chosen = 7; }
  optional group Wrapper = 8 { optional Flavor inside = 1; }
}
