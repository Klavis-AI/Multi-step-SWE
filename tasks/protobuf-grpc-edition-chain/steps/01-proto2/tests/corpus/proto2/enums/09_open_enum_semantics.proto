// DESC: Sparse, non-contiguous, negative open-enum numbering used as a packed field
syntax = "proto2";
package c2.enums.open_enum_semantics;

// proto2 enums are open: sparse and non-contiguous numbering is legal and the
// zero value is not required.
enum Sparse {
  SPARSE_A = 0;
  SPARSE_B = 7;
  SPARSE_C = 100;
  SPARSE_D = 65536;
  SPARSE_E = -9;
}

message OpenEnumUser {
  optional Sparse s = 1 [default = SPARSE_C];
  repeated Sparse many = 2 [packed = true];
}
