// DESC: Every MessageOptions field settable in a .proto file
syntax = "proto2";
package c2.options.all_message_options;

message StandardAccessors {
  option no_standard_descriptor_accessor = true;
  optional int32 v = 1;
}

message DeprecatedMessage {
  option deprecated = true;
  optional int32 v = 1;
}

message MessageSet {
  option message_set_wire_format = true;
  extensions 4 to max;
}

message AllAtOnce {
  option no_standard_descriptor_accessor = true;
  option deprecated = true;
  optional int32 v = 1;
}
