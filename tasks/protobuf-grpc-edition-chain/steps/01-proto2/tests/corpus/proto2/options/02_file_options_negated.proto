// DESC: The boolean file options set to their opposite values, file marked deprecated
syntax = "proto2";
package c2.options.file_options_negated;

// The same boolean file options set to their opposite values, and the file
// itself marked deprecated.
option java_multiple_files = false;
option java_string_check_utf8 = false;
option cc_generic_services = false;
option java_generic_services = false;
option py_generic_services = false;
option deprecated = true;
option cc_enable_arenas = false;
option optimize_for = CODE_SIZE;

message M { optional int32 v = 1; }
