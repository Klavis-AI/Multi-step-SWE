// DESC: Custom option values at integer extremes and inf/-inf/nan, hex and concatenated strings
syntax = "proto2";
package c2.options.option_value_forms;

import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
  optional int32 i32 = 50701;
  optional int64 i64 = 50702;
  optional uint32 u32 = 50703;
  optional uint64 u64 = 50704;
  optional double dbl = 50705;
  optional float flt = 50706;
  optional bool bl = 50707;
  optional string str = 50708;
  optional bytes byt = 50709;
  optional Choice enm = 50710;
}

enum Choice { CHOICE_ZERO = 0; CHOICE_ONE = 1; }

message OptionValueForms {
  optional int32 a = 1 [(i32) = -2147483648, (i64) = -9223372036854775808];
  optional int32 b = 2 [(u32) = 4294967295, (u64) = 18446744073709551615];
  optional int32 c = 3 [(dbl) = inf, (flt) = -inf];
  optional int32 d = 4 [(dbl) = nan];
  optional int32 e = 5 [(dbl) = 1.5e-300, (flt) = 1.5e30];
  optional int32 f = 6 [(bl) = true];
  optional int32 g = 7 [(bl) = false];
  optional int32 h = 8 [(str) = "plain", (byt) = "\x00\xff"];
  optional int32 i = 9 [(enm) = CHOICE_ONE];
  optional int32 j = 10 [(i32) = 0x7fffffff];
  optional int32 k = 11 [(str) = "concat" "enated"];
}
