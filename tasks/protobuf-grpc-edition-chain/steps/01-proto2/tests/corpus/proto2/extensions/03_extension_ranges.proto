// DESC: Extension ranges: single, multiple, single-number, to-max and adjacent
syntax = "proto2";
package c2.extensions.extension_ranges;

message SingleRange { extensions 10 to 20; }
message MultiRange { extensions 4 to 8, 12, 900 to 1000; }
message SingleNumber { extensions 7; }
message ToMax { extensions 1000 to max; }
message AdjacentRanges { extensions 1 to 10; extensions 11 to 20; extensions 21 to 30; }
message AroundImplementationReserved { extensions 1 to 18999; extensions 20000 to max; }

extend ToMax { optional int32 highest = 536870911; }
extend SingleNumber { optional string only = 7; }
