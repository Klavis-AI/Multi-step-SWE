// DESC: extend of a message declared in the same file, covering several field types
syntax = "proto2";
package c2.extensions.extend_local;

message Host {
  optional int32 base = 1;
  extensions 100 to 200;
}

extend Host {
  optional int32 ext_int32 = 100;
  optional string ext_string = 101;
  optional bytes ext_bytes = 102;
  optional bool ext_bool = 103;
  optional double ext_double = 104;
  repeated int32 ext_repeated = 105;
  repeated int32 ext_packed = 106 [packed = true];
}
