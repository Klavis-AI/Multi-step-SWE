// DESC: Extension fields of enum type, including repeated, packed and defaulted
syntax = "proto2";
package c2.extensions.extension_of_enum_type;

enum Colour {
  COLOUR_NONE = 0;
  COLOUR_RED = 1;
  COLOUR_BLUE = 2;
}

message Host { extensions 100 to 200; }

extend Host {
  optional Colour single_enum = 100;
  repeated Colour repeated_enum = 101;
  repeated Colour packed_enum = 102 [packed = true];
  optional Colour defaulted_enum = 103 [default = COLOUR_BLUE];
}
