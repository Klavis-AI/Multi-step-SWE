// DESC: Extension fields whose type is a message, a nested message or the host itself
syntax = "proto2";
package c2.extensions.extension_of_message_type;

message Payload {
  optional int32 a = 1;
  optional string b = 2;
  message Inner { optional bool c = 1; }
}

message Host { extensions 100 to 200; }

extend Host {
  optional Payload single_msg = 100;
  repeated Payload repeated_msg = 101;
  optional Payload second_msg = 102;   // extensions may never be `required`
  optional Payload.Inner nested_msg = 103;
  optional Host recursive_msg = 104;
}
