// DESC: sint vs int vs sfixed defaults side by side to separate zigzag from two's complement
syntax = "proto2";
package c2.scalars.zigzag_and_fixed;

// Signed-varint (zigzag) vs fixed-width encodings side by side.
message ZigZagAndFixed {
  optional sint32 zz32_neg = 1 [default = -12345];
  optional sint32 zz32_pos = 2 [default = 12345];
  optional sint64 zz64_neg = 3 [default = -1234567890123];
  optional sint64 zz64_pos = 4 [default = 1234567890123];
  optional int32 plain32_neg = 5 [default = -12345];
  optional int64 plain64_neg = 6 [default = -1234567890123];
  optional sfixed32 sfx32_neg = 7 [default = -12345];
  optional sfixed64 sfx64_neg = 8 [default = -1234567890123];
  optional fixed32 fx32 = 9 [default = 12345];
  optional fixed64 fx64 = 10 [default = 1234567890123];
}
