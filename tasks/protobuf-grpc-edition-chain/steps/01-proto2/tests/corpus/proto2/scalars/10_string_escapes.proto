// DESC: string defaults covering simple, hex, octal, unicode and concatenated literals
syntax = "proto2";
package c2.scalars.string_escapes;

message StringEscapes {
  optional string simple_escapes = 1 [default = "\a\b\f\n\r\t\v\\\'\"\?"];
  optional string hex_escape = 2 [default = "\x41\x7a\x30"];
  optional string octal_escape = 3 [default = "\101\172\060"];
  optional string unicode_short = 4 [default = "é中文"];
  optional string unicode_long = 5 [default = "\U0001F600"];
  optional string raw_utf8 = 6 [default = "caf\303\251 \344\270\255"];
  optional string embedded_quote = 7 [default = "she said \"hi\""];
  optional string empty = 8 [default = ""];
  optional string concatenated = 9 [default = "part one " "part two"];
  optional string single_quoted = 10 [default = 'single \'quoted\' text'];
}
