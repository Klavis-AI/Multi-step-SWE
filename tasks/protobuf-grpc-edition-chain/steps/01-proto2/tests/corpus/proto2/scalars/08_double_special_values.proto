// DESC: double defaults inf, -inf, nan, -0.0 and the subnormal/huge extremes
syntax = "proto2";
package c2.scalars.double_special_values;

message DoubleSpecialValues {
  optional double pos_inf = 1 [default = inf];
  optional double neg_inf = 2 [default = -inf];
  optional double not_a_number = 3 [default = nan];
  optional double neg_zero = 4 [default = -0.0];
  optional double tiny = 5 [default = 2.2250738585072014e-308];
  optional double huge = 6 [default = 1.7976931348623157e+308];
  optional double exp_form = 7 [default = 1.5E100];
  optional double neg_exp_form = 8 [default = -1.5e-100];
}
