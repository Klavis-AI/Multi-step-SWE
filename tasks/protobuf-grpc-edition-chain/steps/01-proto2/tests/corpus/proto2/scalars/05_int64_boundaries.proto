// DESC: int64/sint64/sfixed64 defaults at the 64-bit signed minimum and maximum
syntax = "proto2";
package c2.scalars.int64_boundaries;

message Int64Boundaries {
  optional int64 min_int64 = 1 [default = -9223372036854775808];
  optional int64 max_int64 = 2 [default = 9223372036854775807];
  optional int64 minus_one = 3 [default = -1];
  optional sint64 min_sint64 = 4 [default = -9223372036854775808];
  optional sint64 max_sint64 = 5 [default = 9223372036854775807];
  optional sfixed64 min_sfixed64 = 6 [default = -9223372036854775808];
  optional sfixed64 max_sfixed64 = 7 [default = 9223372036854775807];
}
