// DESC: Group names of varied casing, exercising the lowercased field name and json_name
syntax = "proto2";
package c2.groups.group_field_naming;

// A group's declared name is CamelCase; the generated field name is its
// lowercased form, and json_name is derived from that lowercased field name.
message GroupFieldNaming {
  optional group ABC = 1 { optional int32 v = 1; }
  optional group CamelCaseName = 2 { optional int32 v = 1; }
  optional group Snake_Case_Name = 3 { optional int32 v = 1; }
  optional group X = 4 { optional int32 v = 1; }
  repeated group HTTPRequest = 5 { optional int32 v = 1; }
}
