// DESC: A group whose body refers back to its own implicit message type
syntax = "proto2";
package c2.groups.recursive_group;

// A group that contains a field of its own implicit message type.
message RecursiveGroup {
  optional group Node = 1 {
    optional int32 value = 1;
    repeated Node children = 2;
    optional RecursiveGroup back_ref = 3;
  }
}
