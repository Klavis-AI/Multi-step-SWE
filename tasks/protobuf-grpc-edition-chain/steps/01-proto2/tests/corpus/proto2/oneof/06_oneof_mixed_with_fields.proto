// DESC: Oneofs interleaved with required, repeated, map fields and an extension range
syntax = "proto2";
package c2.oneof.oneof_mixed_with_fields;

// Oneof members interleaved with required / optional / repeated / map fields
// so oneof_index bookkeeping cannot rely on contiguous field ordering.
message OneofMixed {
  required int32 head = 1;
  oneof pick_a {
    int32 pa1 = 2;
    string pa2 = 3;
  }
  repeated int32 middle = 4 [packed = true];
  map<string, int32> lookup = 5;
  oneof pick_b {
    bytes pb1 = 6;
    bool pb2 = 7;
  }
  optional int32 tail = 8;
  extensions 100 to 200;
}
