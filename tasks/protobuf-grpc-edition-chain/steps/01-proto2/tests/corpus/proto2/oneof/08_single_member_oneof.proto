// DESC: One-member proto2 oneofs, which must not be marked proto3_optional
syntax = "proto2";
package c2.oneof.single_member_oneof;

// A one-member oneof in proto2 is a real oneof (unlike proto3's synthetic
// oneofs for `optional`), so proto3_optional must NOT be set on it.
message SingleMemberOneof {
  oneof solo {
    int32 only = 1;
  }
  oneof also_solo {
    Sub only_msg = 2;
  }
  optional int32 genuinely_optional = 3;
  message Sub { optional int32 v = 1; }
}
