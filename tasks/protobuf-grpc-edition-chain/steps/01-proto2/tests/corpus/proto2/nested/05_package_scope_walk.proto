// DESC: One type referenced unqualified, partially qualified and fully qualified
syntax = "proto2";
package c2.nested.package_scope_walk;

// Name lookup walks outward through package components. `Target` here is
// reachable unqualified, by partial qualification, and fully qualified.
message Target { optional int32 v = 1; }

message Walker {
  optional Target unqualified = 1;
  optional package_scope_walk.Target partially_qualified = 2;
  optional nested.package_scope_walk.Target more_qualified = 3;
  optional .c2.nested.package_scope_walk.Target fully_qualified = 4;
}
