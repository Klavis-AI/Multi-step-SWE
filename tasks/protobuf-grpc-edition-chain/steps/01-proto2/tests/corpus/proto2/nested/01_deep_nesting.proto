// DESC: Seven levels of nested messages plus a fully-qualified reference to the deepest
syntax = "proto2";
package c2.nested.deep_nesting;

message L1 {
  message L2 {
    message L3 {
      message L4 {
        message L5 {
          message L6 {
            message L7 {
              optional int32 leaf = 1;
            }
            optional L7 l7 = 1;
          }
          optional L6 l6 = 1;
        }
        optional L5 l5 = 1;
      }
      optional L4 l4 = 1;
    }
    optional L3 l3 = 1;
  }
  optional L2 l2 = 1;
  optional .c2.nested.deep_nesting.L1.L2.L3.L4.L5.L6.L7 direct_leaf = 2;
}
