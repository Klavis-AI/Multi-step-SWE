// DESC: Aggregate option value names a field the option message does not have
syntax = "proto2";
package rej.aggregate_option_unknown_field;
import "google/protobuf/descriptor.proto";
message Cfg { optional int32 a = 1; optional int32 no_such_subfield = 2; }
extend google.protobuf.MessageOptions { optional Cfg cfg = 51102; }
message M {
  option (cfg) = { a: 1 no_such_subfield: 2 };
  optional int32 x = 1;
}
