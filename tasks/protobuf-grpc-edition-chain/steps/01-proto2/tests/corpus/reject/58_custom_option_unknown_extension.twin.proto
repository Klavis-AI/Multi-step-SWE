// DESC: Custom option names an extension that is never declared
syntax = "proto2";
package rej.custom_option_unknown_extension;
import "google/protobuf/descriptor.proto";
extend google.protobuf.MessageOptions { optional string not_declared_anywhere = 51100; }
message M {
  option (not_declared_anywhere) = "x";
  optional int32 a = 1;
}
