// DESC: FieldOptions extension used as a message option
syntax = "proto2";
package rej.custom_option_wrong_target;
import "google/protobuf/descriptor.proto";
extend google.protobuf.FieldOptions { optional string field_only = 51101; }
message M {
  option (field_only) = "used on a message instead of a field";
  optional int32 a = 1;
}
