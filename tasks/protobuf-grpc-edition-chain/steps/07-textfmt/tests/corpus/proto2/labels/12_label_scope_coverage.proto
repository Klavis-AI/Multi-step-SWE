// DESC: Labels applied at top level, inside nested messages and inside a group body
syntax = "proto2";
package c2.labels.label_scope_coverage;

// Labels applied at every nesting level including inside groups and nested
// messages, so label handling cannot be special-cased to top level.
message LabelScopeCoverage {
  required int32 top_req = 1;
  repeated Nested nested = 2;
  optional group TopGroup = 3 {
    required int32 g_req = 1;
    optional int32 g_opt = 2;
    repeated int32 g_rep = 3 [packed = true];
  }

  message Nested {
    required string n_req = 1;
    optional string n_opt = 2;
    repeated string n_rep = 3;
    message Deeper {
      required bool d_req = 1;
      repeated fixed32 d_rep = 2 [packed = true];
    }
    optional Deeper deeper = 4;
  }
}
