// DESC: required/optional/repeated over both scalar and message field types
syntax = "proto2";
package c2.labels.mixed_labels;

message MixedLabels {
  required int32 req = 1;
  optional int32 opt = 2;
  repeated int32 rep = 3;
  required Sub req_msg = 4;
  optional Sub opt_msg = 5;
  repeated Sub rep_msg = 6;

  message Sub { optional int32 v = 1; }
}
