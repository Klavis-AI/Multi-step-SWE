// DESC: packed combined with jstype, deprecated and json_name on the same field
syntax = "proto2";
package c2.labels.packed_field_option_combos;

// packed combined with other field options on the same field.
message PackedOptionCombos {
  repeated int64 packed_jstype = 1 [packed = true, jstype = JS_STRING];
  repeated int32 packed_deprecated = 2 [packed = true, deprecated = true];
  repeated int32 unpacked_deprecated = 3 [packed = false, deprecated = true];
  repeated int64 packed_number = 4 [packed = true, jstype = JS_NUMBER];
  repeated int64 packed_normal = 5 [packed = true, jstype = JS_NORMAL];
  repeated int32 packed_named_json = 6 [packed = true, json_name = "pnj"];
}
