// DESC: Base dependency: a message, a nested message, an enum and an extension range
syntax = "proto2";
package c2.imports.dep_base;

message BaseMessage {
  optional int32 id = 1;
  optional string name = 2;
  message BaseNested { optional bool flag = 1; }
  optional BaseNested nested = 3;
  extensions 100 to max;
}

enum BaseEnum {
  BASE_ENUM_ZERO = 0;
  BASE_ENUM_ONE = 1;
}
