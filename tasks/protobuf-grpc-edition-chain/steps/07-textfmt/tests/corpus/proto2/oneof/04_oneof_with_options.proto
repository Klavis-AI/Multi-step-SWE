// DESC: Field options on oneof members: deprecated, json_name, debug_redact, jstype, lazy
syntax = "proto2";
package c2.oneof.oneof_with_options;

message OneofWithOptions {
  oneof tagged {
    int32 deprecated_member = 1 [deprecated = true];
    string renamed_member = 2 [json_name = "rm"];
    string redacted_member = 3 [debug_redact = true];
    int64 js_string_member = 4 [jstype = JS_STRING];
    Sub lazy_member = 5 [lazy = true];
  }
  message Sub { optional int32 v = 1; }
}
