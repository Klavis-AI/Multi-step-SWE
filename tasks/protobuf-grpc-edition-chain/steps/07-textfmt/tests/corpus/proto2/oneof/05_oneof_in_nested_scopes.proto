// DESC: Oneofs declared three messages deep and inside a group body
syntax = "proto2";
package c2.oneof.oneof_in_nested_scopes;

message Outer {
  oneof outer_choice {
    int32 a = 1;
    Inner b = 2;
  }
  message Inner {
    oneof inner_choice {
      string x = 1;
      Deepest y = 2;
    }
    message Deepest {
      oneof deepest_choice {
        bool z = 1;
        fixed64 w = 2;
      }
    }
  }
  optional group WithOneof = 3 {
    oneof group_choice {
      int32 g1 = 1;
      string g2 = 2;
    }
  }
}
