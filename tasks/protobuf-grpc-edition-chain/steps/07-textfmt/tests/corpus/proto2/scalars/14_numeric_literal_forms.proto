// DESC: Hex, octal, decimal and float literal spellings accepted in default values
syntax = "proto2";
package c2.scalars.numeric_literal_forms;

// Hex, octal and decimal integer literal forms plus float literal shapes.
message NumericLiteralForms {
  optional int32 hex_lower = 1 [default = 0xff];
  optional int32 hex_upper = 2 [default = 0XFF];
  optional int32 octal = 3 [default = 0777];
  optional int32 decimal = 4 [default = 255];
  optional int64 hex64 = 5 [default = 0x7fffffffffffffff];
  optional uint32 hex_u32 = 6 [default = 0xffffffff];
  optional int32 neg_hex = 7 [default = -0x10];
  optional double no_leading_digit = 8 [default = .5];
  optional double trailing_dot = 9 [default = 5.];
  optional double plain_int_as_double = 10 [default = 7];
  optional float cap_exponent = 11 [default = 1E5];
}
