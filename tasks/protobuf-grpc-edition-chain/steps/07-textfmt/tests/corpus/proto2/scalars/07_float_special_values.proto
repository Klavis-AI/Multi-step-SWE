// DESC: float defaults inf, -inf, nan, -0.0 and the subnormal/huge extremes
syntax = "proto2";
package c2.scalars.float_special_values;

message FloatSpecialValues {
  optional float pos_inf = 1 [default = inf];
  optional float neg_inf = 2 [default = -inf];
  optional float not_a_number = 3 [default = nan];
  optional float neg_zero = 4 [default = -0.0];
  optional float tiny = 5 [default = 1.17549435e-38];
  optional float huge = 6 [default = 3.4028234663852886e+38];
  optional float exp_form = 7 [default = 1.5e10];
  optional float neg_exp_form = 8 [default = -1.5e-10];
}
