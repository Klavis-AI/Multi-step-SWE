// DESC: bool with implicit, explicit false, explicit true and required-with-default
syntax = "proto2";
package c2.scalars.bool_defaults;

message BoolDefaults {
  optional bool implicit = 1;
  optional bool explicit_false = 2 [default = false];
  optional bool explicit_true = 3 [default = true];
  repeated bool many = 4;
  required bool required_with_default = 5 [default = true];
}
