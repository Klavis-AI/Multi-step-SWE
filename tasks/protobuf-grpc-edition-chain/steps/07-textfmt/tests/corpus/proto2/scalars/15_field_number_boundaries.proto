// DESC: Legal field-number extremes including 1, 18999, 20000 and 536870911
syntax = "proto2";
package c2.scalars.field_number_boundaries;

// Legal field number extremes: 1, just below/above the reserved implementation
// range, and the maximum legal field number.
message FieldNumberBoundaries {
  optional int32 first = 1;
  optional int32 last_before_reserved = 18999;
  optional int32 first_after_reserved = 20000;
  optional int32 two_byte_tag_start = 16;
  optional int32 one_byte_tag_end = 15;
  optional int32 max_field_number = 536870911;
}
