// DESC: Every scalar type given a non-zero explicit default
syntax = "proto2";
package c2.scalars.nonzero_defaults;

// Every scalar type with a non-zero explicit default.
message NonZeroDefaults {
  optional double f_double = 1 [default = 3.14159265358979];
  optional float f_float = 2 [default = 2.5];
  optional int32 f_int32 = 3 [default = 42];
  optional int64 f_int64 = 4 [default = 4242424242];
  optional uint32 f_uint32 = 5 [default = 7];
  optional uint64 f_uint64 = 6 [default = 99999999999];
  optional sint32 f_sint32 = 7 [default = -7];
  optional sint64 f_sint64 = 8 [default = -4242424242];
  optional fixed32 f_fixed32 = 9 [default = 305419896];
  optional fixed64 f_fixed64 = 10 [default = 1311768467463790320];
  optional sfixed32 f_sfixed32 = 11 [default = -305419896];
  optional sfixed64 f_sfixed64 = 12 [default = -1311768467463790320];
  optional bool f_bool = 13 [default = true];
  optional string f_string = 14 [default = "hello"];
  optional bytes f_bytes = 15 [default = "world"];
}
