// DESC: Every non-deprecated FileOptions field protoc v32.1 knows, set at once
syntax = "proto2";
package c2.options.all_file_options;

// Every non-deprecated, non-feature FileOptions field protoc v32.1 knows.
option java_package = "com.example.corpus.alloptions";
option java_outer_classname = "AllFileOptionsProto";
option java_multiple_files = true;
option java_string_check_utf8 = true;
option optimize_for = SPEED;
option go_package = "example.invalid/corpus/alloptions;alloptions";
option cc_generic_services = true;
option java_generic_services = true;
option py_generic_services = true;
option deprecated = false;
option cc_enable_arenas = true;
option objc_class_prefix = "CRP";
option csharp_namespace = "Example.Corpus.AllOptions";
option swift_prefix = "CRP";
option php_class_prefix = "CRP";
option php_namespace = "Example\\Corpus\\AllOptions";
option php_metadata_namespace = "Example\\Corpus\\AllOptions\\Metadata";
option ruby_package = "Example::Corpus::AllOptions";

message M { optional int32 v = 1; }
