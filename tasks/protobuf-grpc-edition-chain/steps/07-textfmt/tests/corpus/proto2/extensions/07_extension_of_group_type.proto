// DESC: Extension fields declared as groups, at file scope and nested in a message
syntax = "proto2";
package c2.extensions.extension_of_group_type;

message Host { extensions 100 to 200; }

extend Host {
  optional group SingleGroup = 100 {
    optional int32 a = 1;
    optional string b = 2;
  }
  repeated group RepeatedGroup = 101 {
    required int32 id = 1;
  }
}

message NestedGroupExtender {
  extend Host {
    optional group ScopedGroup = 102 {
      optional bool flag = 1;
    }
  }
}
