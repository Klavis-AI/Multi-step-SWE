// DESC: extend of a message declared in an imported file
syntax = "proto2";
package c2.extensions.extend_imported;

import "imports/01_dep_base.proto";

// Extending a message declared in another file.
extend c2.imports.dep_base.BaseMessage {
  optional int32 remote_int = 100;
  optional string remote_string = 101;
  optional Local remote_msg = 102;
  optional c2.imports.dep_base.BaseEnum remote_enum = 103;
}

message Local { optional int32 v = 1; }
