// DESC: All four streaming shapes: unary, client, server and bidirectional
syntax = "proto2";
package c2.services.streaming_shapes;

message Req { optional int32 n = 1; }
message Resp { optional int32 n = 1; }

service StreamingShapes {
  rpc Unary(Req) returns (Resp);
  rpc ClientStream(stream Req) returns (Resp);
  rpc ServerStream(Req) returns (stream Resp);
  rpc BidiStream(stream Req) returns (stream Resp);
}
