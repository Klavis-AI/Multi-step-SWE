// DESC: Methods whose types come from an imported file and from well-known types
syntax = "proto2";
package c2.services.cross_file_service;

import "imports/01_dep_base.proto";
import "google/protobuf/empty.proto";

service CrossFileService {
  rpc UsesImported(c2.imports.dep_base.BaseMessage) returns (c2.imports.dep_base.BaseMessage);
  rpc UsesWellKnown(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc UsesNested(c2.imports.dep_base.BaseMessage.BaseNested)
      returns (stream c2.imports.dep_base.BaseMessage.BaseNested);
  rpc FullyQualified(.c2.imports.dep_base.BaseMessage) returns (.google.protobuf.Empty);
}
