// DESC: One message declaring every kind of nested construct at once
syntax = "proto2";
package c2.nested.nested_all_kinds;

// One message declaring every kind of nested construct at once.
message Everything {
  message NestedMessage { optional int32 v = 1; }
  enum NestedEnum { NESTED_ENUM_ZERO = 0; NESTED_ENUM_ONE = 1; }

  optional NestedMessage m = 1;
  optional NestedEnum e = 2;
  map<string, NestedMessage> mm = 3;
  oneof pick {
    NestedMessage om = 4;
    NestedEnum oe = 5;
  }
  optional group NestedGroup = 6 {
    message DeeperMessage { optional int32 v = 1; }
    enum DeeperEnum { DEEPER_ENUM_ZERO = 0; }
    optional DeeperMessage dm = 1;
    optional DeeperEnum de = 2;
  }
  reserved 100 to 110;
  extensions 200 to 300;
}
