// DESC: Two messages that refer to each other through fields, maps and a group
syntax = "proto2";
package c2.nested.mutual_recursion;

message Tree {
  optional string name = 1;
  repeated Tree children = 2;
  optional Leaf leaf = 3;
  map<string, Tree> index = 4;
}

message Leaf {
  optional Tree parent = 1;
  optional int32 value = 2;
  optional group Back = 3 {
    optional Tree tree = 1;
    optional Leaf leaf = 2;
  }
}
