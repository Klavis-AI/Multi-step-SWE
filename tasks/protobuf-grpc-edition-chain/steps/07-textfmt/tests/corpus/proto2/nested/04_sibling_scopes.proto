// DESC: Two siblings each declaring a nested type of the same simple name
syntax = "proto2";
package c2.nested.sibling_scopes;

// Two sibling messages each declare a nested type of the same simple name; a
// reference inside one must pick its own sibling, not the other's.
message First {
  message Payload { optional int32 first_v = 1; }
  optional Payload p = 1;
}

message Second {
  message Payload { optional string second_v = 1; }
  optional Payload p = 1;
  optional First.Payload other = 2;
}
