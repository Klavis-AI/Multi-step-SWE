// DESC: An inner type shadowing a top-level type of the same name
syntax = "proto2";
package c2.nested.name_shadowing;

message Shadowed { optional string top_level = 1; }

message Container {
  message Shadowed { optional int32 inner = 1; }
  // `Shadowed` resolves to the innermost match (Container.Shadowed).
  optional Shadowed resolves_to_inner = 1;
  // The fully-qualified form reaches the top-level type.
  optional .c2.nested.name_shadowing.Shadowed resolves_to_top = 2;
}
