// DESC: The same nested type reached by one-, two- and three-component relative names
syntax = "proto2";
package c2.nested.relative_resolution;

message A {
  message B {
    message C { optional int32 v = 1; }
    optional C from_b = 1;
  }
  optional B from_a = 1;
  optional B.C two_levels = 2;
}

message User {
  optional A a = 1;
  optional A.B ab = 2;
  optional A.B.C abc = 3;
  optional .c2.nested.relative_resolution.A.B.C fq_abc = 4;
}
