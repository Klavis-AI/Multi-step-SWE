// DESC: Maps with top-level and nested enum values
syntax = "proto2";
package c2.maps.enum_values;

enum State {
  STATE_UNKNOWN = 0;
  STATE_ON = 1;
  STATE_OFF = 2;
}

message EnumValues {
  map<string, State> by_name = 1;
  map<int32, State> by_id = 2;
  map<bool, InnerEnum> by_flag = 3;

  enum InnerEnum { INNER_ENUM_ZERO = 0; INNER_ENUM_ONE = 1; }
}
