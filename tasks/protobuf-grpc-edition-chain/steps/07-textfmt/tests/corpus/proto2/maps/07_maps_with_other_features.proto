// DESC: A map alongside required, packed, group, reserved, extensions and oneof
syntax = "proto2";
package c2.maps.maps_with_other_features;

message MapsWithOtherFeatures {
  required int32 head = 1;
  map<string, int32> counts = 2;
  repeated int32 packed_nums = 3 [packed = true];
  optional group Grp = 4 { map<string, string> inner = 1; }
  map<string, Sub> subs = 5;
  reserved 900 to 950;
  extensions 1000 to 1100;
  oneof pick { int32 x = 6; string y = 7; }

  message Sub { optional int32 v = 1; }
}
