// DESC: Reserved numbers, ranges, to-max and names mixed in one message
syntax = "proto2";
package c2.reserved.reserved_mixed;

message ReservedMixed {
  reserved 2, 15, 9 to 11, 40 to max;
  reserved "alpha", "beta";
  reserved "gamma";
  reserved 3 to 5;
  optional int32 one = 1;
  optional int32 six = 6;
  optional int32 seven = 7;
  optional int32 eight = 8;
  optional int32 twelve = 12;
}
