// DESC: The same enum value name reused in three different parent scopes
syntax = "proto2";
package c2.enums.enum_value_name_scoping;

// Enum value names live in the enum's *parent* scope, so two enums in
// different parents may reuse the same value name.
enum TopEnum {
  SHARED_NAME = 0;
}

message Container {
  enum InnerEnum {
    SHARED_NAME = 0;
    INNER_ONLY = 1;
  }
  optional InnerEnum inner = 1;
  optional TopEnum top = 2;
}

message OtherContainer {
  enum AnotherEnum {
    SHARED_NAME = 0;
  }
  optional AnotherEnum a = 1;
}
