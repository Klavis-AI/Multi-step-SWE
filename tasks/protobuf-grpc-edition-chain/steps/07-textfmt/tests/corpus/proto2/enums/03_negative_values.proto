// DESC: Negative enum values, a non-zero first value and the int32 extremes
syntax = "proto2";
package c2.enums.negative_values;

// proto2 enums are open and may hold negative values; the first value need not
// be zero.
enum Signed {
  SIGNED_MINUS_TWO = -2;
  SIGNED_MINUS_ONE = -1;
  SIGNED_ZERO = 0;
  SIGNED_ONE = 1;
}

enum StartsNonZero {
  STARTS_NON_ZERO_FIVE = 5;
  STARTS_NON_ZERO_SIX = 6;
}

enum ExtremeValues {
  EXTREME_MIN = -2147483648;
  EXTREME_MAX = 2147483647;
  EXTREME_ZERO = 0;
}

message UsesSigned {
  optional Signed s = 1 [default = SIGNED_MINUS_TWO];
  optional StartsNonZero n = 2;
  optional ExtremeValues e = 3 [default = EXTREME_MIN];
}
