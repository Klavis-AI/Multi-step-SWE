// DESC: Field options on group fields, including deprecated, json_name and debug_redact
syntax = "proto2";
package c2.groups.group_with_options;

message GroupWithOptions {
  optional group Deprecated = 1 [deprecated = true] {
    optional int32 v = 1;
  }
  repeated group Named = 2 [json_name = "renamed"] {
    optional int32 v = 1;
  }
  optional group MultiOption = 3 [deprecated = false, json_name = "mo"] {
    optional int32 v = 1;
  }
  optional group Redacted = 4 [debug_redact = true] {
    optional string secret = 1;
  }
}
