# Six entries, one per directory under steps/. A step that crashes leaves no
# reward.json and therefore vanishes from the mean instead of scoring 0. After
# every multi-step run, count steps/*/verifier/reward.json against the
# [[steps]] entries above and grep the log for "failed, aborting".
