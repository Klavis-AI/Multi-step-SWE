schema_version = "1.4"

# Trial reward = the mean of the ten steps' own rewards. There is no
# min_reward on any step, so no step can stop the trial and no step inherits or
# pads credit for another: each verifier reports only its own milestone, as the
# weighted fraction of that milestone's scored groups which passed.
multi_step_reward_strategy = "mean"

# A separate verifier receives the cumulative source only through this declared
# artifact. The verifier rebuilds the library from source, so no agent build
# output belongs in the snapshot -- but `vendor/` does: it is the pinned
# dependency set the workspace was seeded with, not a build product, and
# dropping it would make grading depend on a live module proxy.
artifacts = [
  { source = "/app", destination = "workspace", exclude = [".git", ".git/**"] },
]

[task]
name = "harbor/ooxml-spreadsheet-engine-multiversion"
version = "1.0.0"
description = "Implement seedcalc, an OOXML SpreadsheetML package reader, writer and formula engine, across ten public release milestones of qax-os/excelize -- from the OPC container and the SpreadsheetML writer, through worksheet and workbook features, pivot caches, a streaming writer and drawings, a formula tokenizer and evaluator with a growing function library, and ECMA-376 decryption, to a number-format engine."
authors = [{ name = "Klavis AI", email = "connect@klavis.ai" }]
keywords = ["ooxml", "spreadsheetml", "xlsx", "formula-engine", "multi-step"]

[metadata]
difficulty = "very hard"
category = "programming"
tags = ["ooxml", "go", "file-format", "spreadsheet", "formula-evaluation", "conformance", "multi-step"]

[environment]
# Agent environment, built from environment/Dockerfile: the pinned Go
# toolchain plus poppler-utils, because the normative specifications seeded
# into the workspace are PDFs.
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []
workdir = "/app"
network_mode = "public"

# Grade each step in an isolated verifier container built from that step's
# tests/Dockerfile. The cumulative /app artifact is restored at /app inside the
# image before /tests/test.sh runs. Every verifier writes
# {"reward": <step-local 0-1>} and exits 0; reward_details.json carries the
# per-group breakdown.

[agent]
# The agent's work runs against an allowlist: only the inference endpoint is
# reachable at the network layer, so an upstream copy cannot be fetched by any
# route -- git, release tarball, package registry or docs mirror. The runner
# merges its own model host in at launch, so no host is pinned here.
network_mode = "allowlist"

[verifier]
environment_mode = "separate"

[verifier.environment]
# The image build warms a standard-library build cache so grading does not pay
# for it in every scored group; size the timeout for that build, not for the
# test run.
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
workdir = "/app"
# Grading does not use the network: GOPROXY=off is set in every verifier
# image, the dependency set is vendored and checksummed, and every fixture is
# baked into the image.
network_mode = "public"

# SIZING `[steps.verifier].timeout_sec`. For every step:
#
#   ceiling = 2 * BUILD_TIMEOUT          (one `go build ./...`, retried once
#                                         after the pinned dependency set is
#                                         restored)
#           + GROUP_TIMEOUT * <test groups in that step's groups.tsv>
#                                        -- gate and scored alike, `build`
#                                        excluded, because each one is its own
#                                        `go test` invocation
#           + FIXED_OVERHEAD            (verifier image build, /app artifact
#                                         round trip, slack)
#
# with BUILD_TIMEOUT=600, GROUP_TIMEOUT=240 and FIXED_OVERHEAD=900; the first
# two are the BUILD_TIMEOUT and GROUP_TIMEOUT that test.sh uses. The per-group
# term scales with the group count, so recompute a step's timeout whenever its
# groups.tsv gains or loses a group.

[[steps]]
# OPC package and the SpreadsheetML writer -- excelize v1.1.0
name = "01-opc-package-and-writer"
[steps.agent]
# Keep synchronized with environment/timer.sh and this step's instruction.
timeout_sec = 7200.0
[steps.verifier]
# 15 test groups (gate and scored, `build` excluded): 2*600 + 240*15 + 900, rounded up.
timeout_sec = 5700.0

[[steps]]
# Worksheet features and iteration -- excelize v1.4.1
name = "02-worksheet-features-and-iteration"
[steps.agent]
# Keep synchronized with environment/timer.sh and this step's instruction.
timeout_sec = 7200.0
[steps.verifier]
# 16 test groups (gate and scored, `build` excluded): 2*600 + 240*16 + 900, rounded up.
timeout_sec = 6000.0

[[steps]]
# Workbook metadata and the error contract -- excelize v2.0.1
name = "03-workbook-metadata-and-errors"
