id = "conflicts-groups-parsed"
step = 7
group = "conflicts-declaration"
mode = "bare"
argv = ["lock"]
observe = ["status", "glob:uv.lock"]
[env]
UV_INDEX_URL = "{INDEX}"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
g1 = ["a==1.0.0"]
g2 = ["a==2.0.0"]

[tool.uv]
package = false
conflicts = [[{ group = "g1" }, { group = "g2" }]]
"""
[index.packages.a.versions."1.0.0"]
[index.packages.a.versions."2.0.0"]
