# `uv sync --only-dev` installs the development dependencies and nothing
# else.
id = "s05-sync-only-dev"
step = 5
group = "sync-install-flags"
python = "3.12"
mode = "bare"
argv = ["sync", "--only-dev"]
observe = ["status", "glob:.venv/lib/python*/site-packages/*.dist-info"]

[env]
UV_INDEX_URL = "{INDEX}"

[files]
"pyproject.toml" = '''
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["a"]

[tool.uv]
dev-dependencies = ["b"]
'''

[index.packages.a.versions."1.0.0"]
[index.packages.b.versions."1.0.0"]
