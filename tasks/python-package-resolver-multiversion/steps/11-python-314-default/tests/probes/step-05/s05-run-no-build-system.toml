# `uv run` in a project without a [build-system] no longer has to build the
# project first, so it runs the command.
id = "s05-run-no-build-system"
step = 5
group = "project-packaging-default"
python = "3.12"
mode = "bare"
argv = ["run", "--offline", "python", "-c", "print('ok')"]
observe = ["status", "stdout"]

[files]
"pyproject.toml" = '''
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []
'''
