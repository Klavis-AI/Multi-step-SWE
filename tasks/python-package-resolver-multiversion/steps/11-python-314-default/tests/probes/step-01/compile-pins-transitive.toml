id = "compile-pins-transitive"
step = 1
group = "compile-output"
python = "3.12"
mode = "venv"
argv = ["pip", "compile", "--index-url", "{INDEX}", "--no-cache", "--no-header", "--no-annotate", "-o", "out.txt", "req.in"]
observe = ["status", "file:out.txt"]

[files]
"req.in" = """
ctop
"""

[index.packages.ctop.versions."1.0.0"]
requires = ["cmid<2.0.0"]
[index.packages.cmid.versions."1.5.0"]
requires = ["cleaf"]
[index.packages.cmid.versions."2.0.0"]
[index.packages.cleaf.versions."3.1.0"]
