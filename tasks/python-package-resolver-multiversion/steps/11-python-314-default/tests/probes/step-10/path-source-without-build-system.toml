id = "path-source-without-build-system"
step = 10
group = "virtual-dependency-install"
mode = "bare"
timeout = 180
argv = ["sync", "--offline"]
observe = ["status", "glob:.venv/lib/python3.12/site-packages/*.dist-info"]
[files]
"pyproject.toml" = """
[project]
name = "root"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["foo"]

[tool.uv.sources]
foo = { path = "./foo" }
"""
"foo/pyproject.toml" = """
[project]
name = "foo"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = []
"""
"foo/foo/__init__.py" = ""
