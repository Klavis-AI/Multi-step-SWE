id = "run-with-ephemeral-environment"
step = 10
group = "run-with-ephemeral-env"
mode = "bare"
timeout = 180
argv = ["run", "--no-project", "--with", "a", "--index-url", "{INDEX}", "python", "-c", "import os,sys,a;print('SELF_CONTAINED', os.path.realpath(a.__file__).startswith(os.path.realpath(sys.prefix)))"]
observe = ["status", "stdout"]
[index.packages.a.versions."1.0.0"]
