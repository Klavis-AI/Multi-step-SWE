id = "uv-python-env-implementation-request"
step = 3
group = "interpreter-search-continues"
mode = "bare"
argv = ["venv", ".venv"]
observe = ["status", "glob:.venv/lib/python3.*"]

[env]
UV_PYTHON = "cpython@3.12"
PATH = "{PYROOT}/cpython-3.9-linux-x86_64-gnu/bin:{PYROOT}/cpython-3.10-linux-x86_64-gnu/bin:{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin:/usr/bin:/bin"
