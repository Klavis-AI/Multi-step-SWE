id = "s11-python-platform-simulator-arm64"
step = 11
group = "ios-platform-target"
python = "3.12"
mode = "venv"
timeout = 180
# One version per iOS tag set: the version that resolves names which tag set
# `--python-platform arm64-apple-ios-simulator` generated.
argv = ["pip", "compile", "--python-platform", "arm64-apple-ios-simulator", "--index-url", "{INDEX}", "--no-cache", "req.in"]
observe = ["status", "pinset"]
[files]
"req.in" = "a\n"
[index.packages.a.versions."1.0.0"]
sdist = false
wheel_tags = ["py3-none-ios_13_0_arm64_iphoneos"]
[index.packages.a.versions."2.0.0"]
sdist = false
wheel_tags = ["py3-none-ios_13_0_arm64_iphonesimulator"]
[index.packages.a.versions."3.0.0"]
sdist = false
wheel_tags = ["py3-none-ios_13_0_x86_64_iphonesimulator"]
