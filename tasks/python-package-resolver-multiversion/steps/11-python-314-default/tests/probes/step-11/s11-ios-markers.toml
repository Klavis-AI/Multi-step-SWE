id = "s11-ios-markers"
step = 11
group = "ios-platform-target"
python = "3.12"
mode = "venv"
timeout = 180
# An iOS target makes `sys_platform` evaluate to `ios` and `platform_system` to
# `iOS`; the Darwin-guarded requirement must stay out.
argv = ["pip", "compile", "--python-platform", "arm64-apple-ios", "--index-url", "{INDEX}", "--no-cache", "req.in"]
observe = ["status", "pinset"]
[files]
"req.in" = """
onsysplatform; sys_platform == "ios"
onplatformsystem; platform_system == "iOS"
ondarwin; sys_platform == "darwin"
"""
[index.packages.onsysplatform.versions."1.0.0"]
sdist = false
wheel_tags = ["py3-none-any"]
[index.packages.onplatformsystem.versions."1.0.0"]
sdist = false
wheel_tags = ["py3-none-any"]
[index.packages.ondarwin.versions."1.0.0"]
sdist = false
wheel_tags = ["py3-none-any"]
