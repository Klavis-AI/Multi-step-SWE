id = "s11-ios-deployment-target-override"
step = 11
group = "ios-platform-target"
python = "3.12"
mode = "venv"
timeout = 180
# `IPHONEOS_DEPLOYMENT_TARGET` raises the tag set's minimum to 15.0, which
# brings the 15.0 wheel into range.
argv = ["pip", "compile", "--python-platform", "arm64-apple-ios", "--index-url", "{INDEX}", "--no-cache", "req.in"]
observe = ["status", "pinset"]
[env]
IPHONEOS_DEPLOYMENT_TARGET = "15.0"
[files]
"req.in" = "a\n"
[index.packages.a.versions."1.0.0"]
sdist = false
wheel_tags = ["py3-none-ios_13_0_arm64_iphoneos"]
[index.packages.a.versions."2.0.0"]
sdist = false
wheel_tags = ["py3-none-ios_15_0_arm64_iphoneos"]
