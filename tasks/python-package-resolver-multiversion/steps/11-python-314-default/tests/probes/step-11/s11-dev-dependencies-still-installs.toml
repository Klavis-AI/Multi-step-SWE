id = "s11-dev-dependencies-still-installs"
step = 11
group = "pyproject-field-diagnostics"
python = "3.12"
mode = "bare"
# The deprecation warning does not disable the field: the requirement it names
# is still resolved into the lock.
argv = ["lock", "--offline"]
observe = ["status", "lockset"]
[files]
"pyproject.toml" = """
[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
dev-dependencies = ["kid"]

[tool.uv.sources]
kid = { path = "kid" }
"""
"kid/pyproject.toml" = """
[project]
name = "kid"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0,<1000"]
build-backend = "uv_build"
"""
"kid/src/kid/__init__.py" = ""
