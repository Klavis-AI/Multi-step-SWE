id = "s02-compile-no-strip-extras"
step = 2
group = "compile-output-surface"
python = "3.12"
mode = "bare"
argv = ["pip", "compile", "--no-header", "--no-strip-extras", "requirements.in"]
observe = ["status"]
[env]
UV_INDEX_URL = "{INDEX}"
[files]
"requirements.in" = """
a[extra_b]
"""
[index.packages.b.versions."1.0.0"]
[index.packages.a.versions."1.0.0".extras]
extra_b = ["b"]
