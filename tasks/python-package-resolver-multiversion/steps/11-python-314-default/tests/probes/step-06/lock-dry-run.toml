# `uv lock --dry-run` reports what would change without writing `uv.lock`.
id = "lock-dry-run"
step = 6
group = "export-interface"
python = "3.12"
mode = "bare"
timeout = 300
argv = ["lock", "--dry-run"]
observe = ["status", "glob:uv.lock"]
[env]
UV_INDEX_URL = "{INDEX}"
UV_NO_CACHE = "1"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["a"]
"""
[index.packages.a.versions."1.0.0"]
