# `uv pip list --outdated` queries the index for newer releases.
id = "pip-list-outdated"
step = 6
group = "pip-interface-additions"
python = "3.12"
mode = "venv"
setup_argv = [["pip", "install", "--index-url", "{INDEX}", "--no-cache", "a==1.0.0"]]
argv = ["pip", "list", "--outdated"]
observe = ["status", "stdout"]
[env]
UV_INDEX_URL = "{INDEX}"
UV_NO_CACHE = "1"
[files]
"uv.toml" = """
[pip]
index-url = "{INDEX}"
"""
[index.packages.a.versions."1.0.0"]
[index.packages.a.versions."2.0.0"]
