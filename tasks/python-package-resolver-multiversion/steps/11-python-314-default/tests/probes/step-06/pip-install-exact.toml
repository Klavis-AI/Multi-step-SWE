# `uv pip install --exact` prunes packages the requirements do not name.
id = "pip-install-exact"
step = 6
group = "pip-interface-additions"
python = "3.12"
mode = "venv"
setup_argv = [["pip", "install", "--index-url", "{INDEX}", "--no-cache", "a", "b"]]
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "--exact", "a"]
observe = ["status", "freeze"]
[index.packages.a.versions."1.0.0"]
[index.packages.b.versions."1.0.0"]
