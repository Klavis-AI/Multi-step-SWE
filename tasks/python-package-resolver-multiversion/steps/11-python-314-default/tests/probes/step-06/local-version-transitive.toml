# The same rule applies to a transitive pin coming out of package metadata.
id = "local-version-transitive"
step = 6
group = "local-version-semantics"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "a"]
observe = ["status", "freeze"]
[index.packages.a.versions."1.0.0"]
requires = ["b==2.0.0"]
[index.packages.b.versions."2.0.0+local"]
