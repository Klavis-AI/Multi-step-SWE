# packse scenario 'fork-upgrade'
id = "scen-fork-fork-upgrade"
step = 4
group = "scenario-fork"
python = "3.12"
mode = "bare"
argv = ["lock", "--index-url", "{INDEX}", "--python", "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin/python3.12"]
observe = ["status", "lockset"]

[files]
"pyproject.toml" = '''
[project]
name = "project"
version = "0.1.0"
dependencies = [
  "foo"
]
'''

[index]

[index.packages]

[index.packages.foo]

[index.packages.foo.versions]

[index.packages.foo.versions."1.0.0"]
requires = ["bar==1; sys_platform == 'linux'", "bar==2; sys_platform != 'linux'"]

[index.packages.foo.versions."2.0.0"]
requires = ["bar==2"]

[index.packages.bar]

[index.packages.bar.versions]

[index.packages.bar.versions."1.0.0"]

[index.packages.bar.versions."2.0.0"]
