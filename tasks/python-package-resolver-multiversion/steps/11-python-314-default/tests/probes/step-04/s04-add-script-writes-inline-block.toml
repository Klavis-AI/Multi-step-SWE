id = "s04-add-script-writes-inline-block"
step = 4
group = "script-metadata"
python = "3.12"
mode = "bare"
argv = ["add", "--script", "s.py", "leafpkg==1.0.0"]
observe = ["status", "file:s.py"]

[env]
UV_INDEX_URL = "{INDEX}"

[files]
"s.py" = '''
print("hi")
'''

[index.packages.leafpkg.versions."1.0.0"]
[index.packages.midpkg.versions."2.1.0"]
requires = ["leafpkg>=1"]
[index.packages.toppkg.versions."3.0.0"]
requires = ["midpkg"]
