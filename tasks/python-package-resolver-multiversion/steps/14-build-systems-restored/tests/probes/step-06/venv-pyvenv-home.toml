# The `home =` key of the generated `pyvenv.cfg`, read back through the
# interpreter that the venv wraps: from 0.5.0 it is the directory of
# `sys._base_executable`, not of its canonicalised realpath, so a stabilised
# version directory (`cpython-3.12-*` -> `cpython-3.12.14-*`) survives.
id = "venv-pyvenv-home"
step = 6
group = "venv-base-executable"
python = "3.12"
mode = "venv"
argv = ["run", "--no-project", "python", "-c", "import os,sys; print([l for l in open(os.path.join(sys.prefix,'pyvenv.cfg')) if l.startswith('home')][0].strip())"]
observe = ["status", "stdout"]
