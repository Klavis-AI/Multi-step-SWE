id = "venv-relocatable-flag-wins"
step = 13
group = "env-var-configuration"
mode = "bare"
argv = ["venv", "--python", "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin/python3.12", "--relocatable", ".venv"]
observe = ["status", "glob:.venv/bin/activate", "exists:.venv/bin/activate"]
[env]
UV_VENV_RELOCATABLE = "1"
