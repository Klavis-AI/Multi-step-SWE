id = "workspace-empty-member-sync"
step = 13
group = "workspace-member-discovery"
mode = "bare"
argv = ["sync", "--offline"]
observe = ["status", "stderr", "glob:.venv/pyvenv.cfg"]
[files]
"pyproject.toml" = """
[project]
name = "root"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["pkgs/*"]
"""
".gitignore" = "*.log\n"
".git/HEAD" = "ref: refs/heads/main\n"
"pkgs/scratch/build.log" = "noise\n"
