id = "install-freeze-roundtrip"
step = 1
group = "install-lifecycle"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "-r", "req.txt"]
observe = ["status", "freeze", "glob:.venv/lib/python3.12/site-packages/*.dist-info"]

[files]
"req.txt" = """
alpha==1.0.0
beta
"""

[index.packages.alpha.versions."1.0.0"]
requires = ["gamma>=2.0.0"]
[index.packages.alpha.versions."2.0.0"]
[index.packages.beta.versions."1.4.0"]
[index.packages.gamma.versions."2.1.0"]
