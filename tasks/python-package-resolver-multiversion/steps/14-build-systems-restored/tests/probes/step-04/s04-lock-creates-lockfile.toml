id = "s04-lock-creates-lockfile"
step = 4
group = "project-lock"
python = "3.12"
mode = "bare"
argv = ["lock"]
observe = ["status", "glob:uv.lock"]

[files]
"pyproject.toml" = '''
[project]
name = "root"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["toppkg"]

[tool.uv]
index-url = "{INDEX}"
'''

[index.packages.leafpkg.versions."1.0.0"]
[index.packages.midpkg.versions."2.1.0"]
requires = ["leafpkg>=1"]
[index.packages.toppkg.versions."3.0.0"]
requires = ["midpkg"]
