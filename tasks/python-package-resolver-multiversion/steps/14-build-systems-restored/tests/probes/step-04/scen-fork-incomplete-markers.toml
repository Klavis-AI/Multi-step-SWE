[project]
name = "project"
version = "0.1.0"
dependencies = [
  "a==1; python_version < '3.10'",
  "a==2; python_version >= '3.11'",
  "b"
]
'''

[index]

[index.packages]

[index.packages.a]

[index.packages.a.versions]

[index.packages.a.versions."1.0.0"]

[index.packages.a.versions."2.0.0"]

[index.packages.b]

[index.packages.b.versions]

[index.packages.b.versions."1.0.0"]
requires = ["c; python_version == '3.10'"]

[index.packages.c]

