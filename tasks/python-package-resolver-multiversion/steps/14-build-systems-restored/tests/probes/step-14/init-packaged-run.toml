# The project created by `uv init` is installed into its own environment and
# exposes a console script named after the project.
id = "init-packaged-run"
step = 14
group = "init-packaged-by-default"
mode = "bare"
timeout = 300
setup_argv = [["init", "demo"]]
argv = ["run", "--directory", "demo", "demo"]
observe = ["status", "stdout"]
