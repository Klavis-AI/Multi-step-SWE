# packse prereleases/transitive-package-only-prereleases-in-range: the only
# candidate inside a transitive range is a pre-release.
id = "prerelease-transitive-range"
step = 14
group = "prerelease-fallback"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "a"]
observe = ["status", "freeze"]
[index.packages.a.versions."0.1.0"]
requires = ["b>0.1"]
[index.packages.b.versions."0.1.0"]
[index.packages.b.versions."1.0.0a1"]
