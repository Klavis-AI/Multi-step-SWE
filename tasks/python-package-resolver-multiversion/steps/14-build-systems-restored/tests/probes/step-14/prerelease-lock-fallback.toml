# The same fallback reached through the project resolver: `uv lock` must
# produce a lockfile rather than fail.
id = "prerelease-lock-fallback"
step = 14
group = "prerelease-fallback"
mode = "bare"
argv = ["lock"]
observe = ["status", "glob:uv.lock"]
[env]
UV_INDEX_URL = "{INDEX}"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["a", "b"]
"""
[index.packages.a.versions."1.0.0"]
requires = ["c==2.0.0b1"]
[index.packages.b.versions."1.0.0"]
requires = ["c>=1.0.0,<=3.0.0"]
[index.packages.c.versions."1.0.0"]
[index.packages.c.versions."2.0.0b1"]
