# `--no-annotate` suppresses the excluded-package footer as well as the
# per-requirement annotations.
id = "compile-no-annotate-footer"
step = 14
group = "compile-annotations"
mode = "bare"
argv = ["pip", "compile", "--index-url", "{INDEX}", "--no-cache", "--no-annotate", "--unsafe-package", "b", "-o", "out.txt", "reqs.in"]
observe = ["status", "file:out.txt"]
[files]
"reqs.in" = "a\n"
[index.packages.a.versions."1.0.0"]
requires = ["b"]
[index.packages.b.versions."1.0.0"]
