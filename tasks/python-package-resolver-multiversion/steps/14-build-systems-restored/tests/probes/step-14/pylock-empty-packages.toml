# `packages = []` is a valid PEP 751 lockfile meaning an empty lockfile, which
# is the counterpart of `pylock-missing-packages`: the absent key is malformed
# input, the empty array is a well-formed request to install nothing.
id = "pylock-empty-packages"
step = 14
group = "pylock-validation"
mode = "venv"
argv = ["pip", "sync", "pylock.toml"]
observe = ["status", "freeze"]
[files]
"pylock.toml" = """
lock-version = "1.0"
created-by = "probe"
requires-python = ">=3.12"
packages = []
"""
