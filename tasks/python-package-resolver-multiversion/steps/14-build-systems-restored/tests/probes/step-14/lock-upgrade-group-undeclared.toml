# `--upgrade-group` names a dependency group the project declares; a name that
# is not declared anywhere is refused rather than silently accepted, and no
# lockfile is written.
id = "lock-upgrade-group-undeclared"
step = 14
group = "lock-upgrade-group"
mode = "bare"
argv = ["lock", "--upgrade-group", "notdeclared"]
observe = ["status", "glob:uv.lock"]
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
docs = []
"""
