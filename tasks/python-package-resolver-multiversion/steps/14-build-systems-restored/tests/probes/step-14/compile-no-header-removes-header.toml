# The header is controlled by `--no-header`, not by `--no-annotate`: the same
# compile that keeps its two header lines under `--no-annotate` alone writes
# the pins and nothing else once `--no-header` is added -- and the excluded-
# package footer is gone in both.
id = "compile-no-header-removes-header"
step = 14
group = "compile-annotations"
mode = "bare"
argv = ["pip", "compile", "--index-url", "{INDEX}", "--no-cache", "--no-header", "--no-annotate", "--unsafe-package", "b", "-o", "out.txt", "reqs.in"]
observe = ["status", "file:out.txt"]
[files]
"reqs.in" = "a\n"
[index.packages.a.versions."1.0.0"]
requires = ["b"]
[index.packages.b.versions."1.0.0"]
