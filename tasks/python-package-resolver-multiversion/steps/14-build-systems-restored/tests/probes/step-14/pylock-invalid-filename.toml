# PEP 751 lockfile names must be `pylock.toml` or `pylock.<name>.toml`.
id = "pylock-invalid-filename"
step = 14
group = "pylock-validation"
mode = "venv"
argv = ["pip", "install", "-r", "pylock.foo.bar.toml"]
observe = ["status"]
[files]
"pylock.foo.bar.toml" = """
lock-version = "1.0"
created-by = "probe"
requires-python = ">=3.12"
packages = []
"""
