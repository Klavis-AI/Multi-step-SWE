# `uv export` writes a requirements.txt for the locked project.  The index
# serves wheels only so no sdist hash is recorded.
id = "s05-export-requirements"
step = 5
group = "export-command"
python = "3.12"
mode = "bare"
argv = ["export", "-o", "req.txt"]
observe = ["status", "glob:req.txt"]

[env]
UV_INDEX_URL = "{INDEX}"

[files]
"pyproject.toml" = '''
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["a"]
'''

[index.packages.a.versions."1.0.0"]
sdist = false
