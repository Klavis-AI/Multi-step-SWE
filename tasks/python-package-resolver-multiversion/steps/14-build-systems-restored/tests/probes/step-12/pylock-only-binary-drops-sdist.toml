id = "pylock-only-binary-drops-sdist"
step = 12
group = "pep751-artifact-filtering"
python = "3.12"
mode = "bare"
argv = ["pip", "compile", "requirements.in", "--index-url", "{INDEX}", "--no-cache",
        "--format", "pylock.toml", "--only-binary", ":all:", "-o", "pylock.toml"]
observe = ["status", "file:pylock.toml"]
[files]
"requirements.in" = "b==1.0.0\n"
[index.packages.b.versions."1.0.0"]
