# PROFILE.md 8 `uv sync` and `uv tree` flags: "`uv tree` accepts `--no-dev` and
# `--invert` in the same invocation; the combination is not a usage error and
# exits 0." That is all this probe reads: status 0 and the rendering the
# sentence implies. The project depends on nothing, so the tree is the project
# node alone under either flag, and this fixture cannot tell a pair that was
# honoured from one that was parsed and discarded -- the effect of each flag is
# fixed where it is introduced, not here.
id = "tree-no-dev-invert"
step = 8
group = "project-command-flags"
python = "3.12"
mode = "bare"
argv = ["tree", "--offline", "--no-dev", "--invert"]
observe = ["status", "stdout"]
timeout = 300

[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = []
"""
