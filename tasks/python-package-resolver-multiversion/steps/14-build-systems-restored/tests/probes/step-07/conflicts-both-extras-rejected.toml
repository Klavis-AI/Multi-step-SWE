id = "conflicts-both-extras-rejected"
step = 7
group = "conflicts-declaration"
python = "3.12"
mode = "bare"
argv = ["sync", "--extra", "x", "--extra", "y"]
observe = ["status", "glob:.venv/lib/python3.12/site-packages/*.dist-info"]
[env]
UV_INDEX_URL = "{INDEX}"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
x = ["a==1.0.0"]
y = ["a==2.0.0"]

[tool.uv]
package = false
conflicts = [[{ extra = "x" }, { extra = "y" }]]
"""
[index.packages.a.versions."1.0.0"]
[index.packages.a.versions."2.0.0"]
