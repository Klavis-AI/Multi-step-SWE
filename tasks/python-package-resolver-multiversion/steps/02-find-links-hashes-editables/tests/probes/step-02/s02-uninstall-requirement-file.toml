id = "s02-uninstall-requirement-file"
step = 2
group = "install-flag-surface"
python = "3.12"
mode = "venv"
setup_argv = [["pip", "install", "--index-url", "{INDEX}", "a", "b"]]
argv = ["pip", "uninstall", "-r", "unwanted.txt"]
