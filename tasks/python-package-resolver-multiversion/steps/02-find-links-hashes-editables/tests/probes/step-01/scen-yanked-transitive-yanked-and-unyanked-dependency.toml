# packse scenario 'transitive-yanked-and-unyanked-dependency'
id = "scen-yanked-transitive-yanked-and-unyanked-dependency"
step = 1
group = "scenario-yanked"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--no-cache", "--index-url", "{INDEX}", "a", "b"]
observe = ["status", "freeze"]

[index]

[index.packages]

[index.packages.a]

[index.packages.a.versions]

[index.packages.a.versions."1.0.0"]
requires = ["c==2.0.0"]

[index.packages.b]

[index.packages.b.versions]

[index.packages.b.versions."1.0.0"]
requires = ["c>=1.0.0,<=3.0.0"]

[index.packages.c]

[index.packages.c.versions]

[index.packages.c.versions."1.0.0"]

[index.packages.c.versions."2.0.0"]
yanked = true
