# Proof of life: resolve one requirement against a PEP 503 index, install the
# wheel, and report it back through `pip freeze`. This is the smallest end to
# end path through the product and it must work at every step.
id = "pol-install-freeze"
step = 0
group = "proof-of-life"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "polpkg"]
observe = ["status", "freeze"]

[index.packages.polpkg.versions."1.0.0"]
sdist = false
