# `--prerelease` defaults to off: with no flag, a pre-release is not eligible
# for a range specifier that a final release already satisfies, so the same
# index and the same range that `global-prerelease-allow-compile` resolves to
# `a==2.0.0b1` resolve to `a==1.0.0` here.
id = "global-prerelease-default-off"
step = 1
group = "compile-output"
python = "3.12"
mode = "venv"
argv = ["pip", "compile", "--index-url", "{INDEX}", "--no-cache", "--no-header", "--no-annotate", "-o", "out.txt", "req.in"]
observe = ["status", "file:out.txt"]

[files]
"req.in" = """
a>=1.0.0
"""

[index.packages.a.versions."1.0.0"]
[index.packages.a.versions."2.0.0b1"]
