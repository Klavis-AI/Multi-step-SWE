# Normalisation follows `pypa-name-normalization.rst` everywhere a name is
# compared, printed in a resolved set, or used as a lookup key. The request
# `My.Pkg_Example`, the index project `my_pkg.example` and the distribution's
# own `my_pkg_example-1.0.0.dist-info` are three different spellings of one
# name; the resolution must find the project and `uv pip freeze` must print the
# normalised form, which is what makes the lookup and the printed set one key.
id = "index-name-normalisation"
step = 1
group = "index-metadata"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "My.Pkg_Example"]
observe = ["status", "freeze", "glob:.venv/lib/python3.12/site-packages/*.dist-info"]

[index.packages."my_pkg.example".versions."1.0.0"]
