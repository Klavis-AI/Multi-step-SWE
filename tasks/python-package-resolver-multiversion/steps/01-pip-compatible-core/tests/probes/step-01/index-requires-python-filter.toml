id = "index-requires-python-filter"
step = 1
group = "index-metadata"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "rppkg"]
observe = ["status", "freeze"]

[index.packages.rppkg.versions."1.0.0"]
requires_python = ">=3.8"
[index.packages.rppkg.versions."2.0.0"]
requires_python = ">=3.13"
