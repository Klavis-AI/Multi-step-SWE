# `--prerelease` takes a value and `allow` makes pre-releases eligible for
# every package unconditionally. The install half of that is already driven by
# the `scen-prereleases-*-opt-in` probes; this is the compile half, and the
# pair with `global-prerelease-default-off` is the flag: same index, same
# range, and the pre-release is chosen only when the flag is given.
id = "global-prerelease-allow-compile"
step = 1
group = "compile-output"
python = "3.12"
mode = "venv"
argv = ["pip", "compile", "--index-url", "{INDEX}", "--no-cache", "--no-header", "--no-annotate", "--prerelease=allow", "-o", "out.txt", "req.in"]
observe = ["status", "file:out.txt"]

[files]
"req.in" = """
a>=1.0.0
"""

[index.packages.a.versions."1.0.0"]
[index.packages.a.versions."2.0.0b1"]
