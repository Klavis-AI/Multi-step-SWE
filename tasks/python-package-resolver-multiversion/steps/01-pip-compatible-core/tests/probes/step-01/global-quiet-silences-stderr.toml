# `-q`/`--quiet` is accepted on every subcommand, defaults to off, and
# silences the progress and summary a run writes to standard error without
# changing what the run does. Both halves are observed here: the install still
# resolves and installs `alpha`, and standard error is empty. A run that
# rejected the flag, or accepted it and kept writing its progress, fails on
# one of the two.
id = "global-quiet-silences-stderr"
step = 1
group = "install-lifecycle"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "--quiet", "alpha"]
observe = ["status", "stderr", "freeze"]

[index.packages.alpha.versions."1.0.0"]
