# `uv pip compile` acts on no environment: it runs, and succeeds, in a working
# directory that contains no virtual environment and with `VIRTUAL_ENV` unset.
# `mode = "bare"` is exactly that state -- the runner creates no `.venv` and
# pops `VIRTUAL_ENV` -- so the pair of assertions below is the rule: compile
# exits `0` and writes its pins, and afterwards no environment has appeared
# beside it. A solution that created or required one fails on `status`, on the
# written file, or on the `.venv` glob.
id = "compile-acts-on-no-environment"
step = 1
group = "compile-output"
python = "3.12"
mode = "bare"
argv = ["pip", "compile", "--index-url", "{INDEX}", "--no-cache", "--no-header", "--no-annotate", "-o", "out.txt", "req.in"]
observe = ["status", "file:out.txt", "glob:.venv"]

[files]
"req.in" = """
ctop
"""

[index.packages.ctop.versions."1.0.0"]
requires = ["cleaf"]
[index.packages.cleaf.versions."2.4.0"]
