id = "venv-creates-usable-environment"
step = 1
group = "venv-creation"
python = "3.12"
mode = "bare"
setup_argv = [["venv", "--python", "python3.12", "env1"]]
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "venvpkg"]
observe = ["status", "glob:env1/lib/python3.12/site-packages/*.dist-info"]

[env]
VIRTUAL_ENV = "env1"

[index.packages.venvpkg.versions."1.0.0"]
