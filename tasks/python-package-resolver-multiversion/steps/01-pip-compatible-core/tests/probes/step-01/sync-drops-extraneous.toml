id = "sync-drops-extraneous"
step = 1
group = "install-lifecycle"
python = "3.12"
mode = "venv"
setup_argv = [["pip", "install", "--index-url", "{INDEX}", "--no-cache", "alpha"]]
argv = ["pip", "sync", "--index-url", "{INDEX}", "--no-cache", "req.txt"]
observe = ["status", "freeze", "glob:.venv/lib/python3.12/site-packages/*.dist-info"]

[files]
"req.txt" = """
beta==1.4.0
"""

[index.packages.alpha.versions."1.0.0"]
[index.packages.beta.versions."1.4.0"]
