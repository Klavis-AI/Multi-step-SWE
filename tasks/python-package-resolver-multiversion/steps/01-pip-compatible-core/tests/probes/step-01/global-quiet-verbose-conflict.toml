# `-q`/`--quiet` and `-v`/`--verbose` conflict with one another: given
# together the run does not carry out the request. The observation is the
# effect rather than the diagnostic -- the environment the setup created is
# still empty afterwards, which an implementation that accepted the pair and
# went on to install `alpha` cannot produce. The exit status is deliberately
# asserted as "not `0`": a rejected invocation exits `2` at every release in
# this chain, and PROFILE.md fixes exactly that much for a pre-flight
# rejection -- the request is not carried out and the status is not `0`.
id = "global-quiet-verbose-conflict"
step = 1
group = "install-lifecycle"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "-q", "-v", "alpha"]
observe = ["setup_status", "freeze"]

[index.packages.alpha.versions."1.0.0"]
