# 05.34 -- `--format` takes a value; its only accepted value is
# `requirements-txt`, which is also the default, so asking for it explicitly
# writes the same requirements file as `uv export -o req.txt`.
id = "s05-export-format-requirements-txt"
step = 5
group = "export-command"
python = "3.12"
mode = "bare"
argv = ["export", "--format", "requirements-txt", "-o", "req.txt"]
observe = ["status", "glob:req.txt"]

[env]
UV_INDEX_URL = "{INDEX}"

[files]
"pyproject.toml" = '''
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["a"]
'''

[index.packages.a.versions."1.0.0"]
sdist = false
