# 05.36 -- without `-o` the requirements file goes to stdout and nothing is
# written to the working directory.  `TEST_INTERFACE.md` § 5 frees the text of
# the export in both destinations, so what is read here is the exit status and
# the absence of any `.txt` file: the autogenerated header, the per-package
# `# via` annotations, the hash lines and any marker suffix are all outside
# this step's contract.
id = "s05-export-stdout"
step = 5
group = "export-command"
python = "3.12"
mode = "bare"
argv = ["export"]
observe = ["status", "glob:*.txt"]

[env]
UV_INDEX_URL = "{INDEX}"

[files]
"pyproject.toml" = '''
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["a"]
'''

[index.packages.a.versions."1.0.0"]
sdist = false
