# `uv run -m <MODULE> [ARGS]...` passes the arguments after the module name
# through to the module's own `sys.argv`, the way `python -m` does.
id = "s05-run-module-args"
step = 5
group = "run-module-flag"
python = "3.12"
mode = "bare"
argv = ["run", "--no-project", "-m", "mymod", "one", "two"]
observe = ["status", "stdout"]

[files]
"mymod.py" = '''
import sys
print("from-module")
print("args", " ".join(sys.argv[1:]))
'''
