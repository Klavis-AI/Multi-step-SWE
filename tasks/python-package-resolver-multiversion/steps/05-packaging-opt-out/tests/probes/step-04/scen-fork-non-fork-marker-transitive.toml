# packse scenario 'fork-non-fork-marker-transitive'
id = "scen-fork-non-fork-marker-transitive"
step = 4
group = "scenario-fork"
python = "3.12"
mode = "bare"
argv = ["lock", "--index-url", "{INDEX}", "--python", "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin/python3.12"]
observe = ["status", "lockset"]

[files]
"pyproject.toml" = '''
[project]
name = "project"
version = "0.1.0"
dependencies = [
  "a==1.0.0",
  "b==1.0.0"
]
'''

[index]

[index.packages]

[index.packages.a]

[index.packages.a.versions]

[index.packages.a.versions."1.0.0"]
requires = ["c>=2.0.0 ; sys_platform == 'linux'"]

[index.packages.b]

[index.packages.b.versions]

[index.packages.b.versions."1.0.0"]
requires = ["c>=2.0.0 ; sys_platform == 'darwin'"]

[index.packages.c]

[index.packages.c.versions]

[index.packages.c.versions."1.0.0"]

[index.packages.c.versions."2.0.0"]
