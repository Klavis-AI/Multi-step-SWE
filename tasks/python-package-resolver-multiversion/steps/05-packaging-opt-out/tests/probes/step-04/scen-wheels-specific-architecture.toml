[index.packages.b]

[index.packages.b.versions]

[index.packages.b.versions."1.0.0"]
wheel_tags = ["cp313-cp313-manylinux2010_x86_64", "cp313-cp313-manylinux2010_aarch64", "cp313-cp313-manylinux2010_i686", "cp313-cp313-freebsd_13_x86_64", "cp313-cp313-freebsd_13_aarch64", "cp313-cp313-macosx_10_9_x86_64", "cp313-cp313-macosx_10_9_arm64"]
