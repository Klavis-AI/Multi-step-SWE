# packse scenario 'specific-architecture'
id = "scen-wheels-specific-architecture"
step = 4
group = "scenario-wheels"
python = "3.12"
mode = "bare"
argv = ["lock", "--index-url", "{INDEX}", "--python", "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin/python3.12"]
observe = ["status", "lockset"]

[files]
"pyproject.toml" = '''
[project]
name = "project"
version = "0.1.0"
dependencies = [
  "a"
]
'''

[index]

[index.packages]

[index.packages.a]

[index.packages.a.versions]

[index.packages.a.versions."1.0.0"]
