id = "s04-run-pep723-inline-dependencies"
step = 4
group = "script-metadata"
python = "3.12"
mode = "bare"
argv = ["run", "app.py"]
observe = ["status", "stdout"]

[env]
UV_INDEX_URL = "{INDEX}"

[files]
"app.py" = '''
# /// script
# requires-python = ">=3.11"
# dependencies = ["midpkg"]
# ///
import midpkg
import leafpkg

print("script-ok", midpkg.__version__, leafpkg.__version__)
'''

[index.packages.leafpkg.versions."1.0.0"]
[index.packages.midpkg.versions."2.1.0"]
requires = ["leafpkg>=1"]
[index.packages.toppkg.versions."3.0.0"]
requires = ["midpkg"]
