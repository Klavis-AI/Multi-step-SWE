id = "pip-freeze-python-venv-directory"
step = 3
group = "pip-python-selection"
mode = "bare"
setup_argv = [
  ["venv", "--python", "3.10", "target"],
  ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "--python", "./target", "leaf"],
]
argv = ["pip", "freeze", "--python", "./target"]
observe = ["status", "stdout"]

[env]
PATH = "{PYROOT}/cpython-3.10-linux-x86_64-gnu/bin:/usr/bin:/bin"

[index.packages.leaf.versions."1.0.0"]
