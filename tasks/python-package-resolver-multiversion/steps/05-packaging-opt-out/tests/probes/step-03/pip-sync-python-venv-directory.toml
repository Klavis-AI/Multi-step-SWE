id = "pip-sync-python-venv-directory"
step = 3
group = "pip-python-selection"
mode = "bare"
setup_argv = [["venv", "--python", "3.10", "target"]]
argv = ["pip", "sync", "--index-url", "{INDEX}", "--no-cache", "--python", "./target", "req.txt"]
observe = ["status", "glob:target/lib/python3.10/site-packages/*.dist-info"]

[env]
PATH = "{PYROOT}/cpython-3.10-linux-x86_64-gnu/bin:/usr/bin:/bin"

[files]
"req.txt" = """
leaf==1.0.0
"""

[index.packages.leaf.versions."1.0.0"]
