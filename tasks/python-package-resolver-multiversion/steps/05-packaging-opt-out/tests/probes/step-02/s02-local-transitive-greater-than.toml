id = "s02-local-transitive-greater-than"
step = 2
group = "local-version-semantics"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "a", "b==2.0.0+foo"]
observe = ["status", "freeze"]
[index.packages.a.versions."1.0.0"]
requires = ["b>2.0.0"]
[index.packages.b.versions."2.0.0+foo"]
[index.packages.b.versions."2.0.0+bar"]
