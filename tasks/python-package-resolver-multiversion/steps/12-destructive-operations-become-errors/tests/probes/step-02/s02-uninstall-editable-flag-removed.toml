id = "s02-uninstall-editable-flag-removed"
step = 2
group = "install-flag-surface"
python = "3.12"
mode = "venv"
setup_argv = [["pip", "install", "--index-url", "{INDEX}", "a"]]
argv = ["pip", "uninstall", "-e", "a"]
observe = ["status", "freeze"]
[files]
"a/pyproject.toml" = """
[project]
name = "a"
version = "1.0.0"

[build-system]
requires = []
build-backend = "nobackend"
"""
[index.packages.a.versions."1.0.0"]
