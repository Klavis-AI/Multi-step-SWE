# Fixture: a marker on each of the project's own requirements decides which
# variants of the named packages are locked, together with a marker on a
# dependency's own requirement.
id = "scen-tag-and-markers-virtual-package-marker-priorities"
step = 4
group = "scenario-tag-and-markers"
python = "3.12"
mode = "bare"
argv = ["lock", "--index-url", "{INDEX}", "--python", "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin/python3.12"]
observe = ["status", "lockset"]

[files]
"pyproject.toml" = '''
[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "a==1; python_version >= '3.8'",
  "b; python_version >= '3.9'"
]
'''

[index]

[index.packages]

[index.packages.a]

[index.packages.a.versions]

[index.packages.a.versions."1.0.0"]
requires = ["b==1 ; python_version >= '3.10'"]

[index.packages.a.versions."2.0.0"]
requires = ["b==1 ; python_version >= '3.10'"]

[index.packages.b]

[index.packages.b.versions]

[index.packages.b.versions."1.0.0"]

[index.packages.b.versions."2.0.0"]
