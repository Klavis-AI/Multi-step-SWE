# Fixture: two marker variants of one package, the extra-carrying one whose
# extra requires a further package under its own marker.
id = "scen-tag-and-markers-virtual-package-extra-priorities"
step = 4
group = "scenario-tag-and-markers"
python = "3.12"
mode = "bare"
argv = ["lock", "--index-url", "{INDEX}", "--python", "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin/python3.12"]
observe = ["status", "lockset"]

[files]
"pyproject.toml" = '''
[project]
name = "project"
version = "0.1.0"
dependencies = [
  "psycopg[binary] ; platform_python_implementation != 'PyPy'",
  "psycopg ; platform_python_implementation == 'PyPy'"
]
'''

[index]

[index.packages]

[index.packages.psycopg]

[index.packages.psycopg.versions]

[index.packages.psycopg.versions."1.0.0"]
requires = ["tzdata; sys_platform == \"win32\""]

[index.packages.psycopg.versions."1.0.0".extras]
binary = ["psycopg-binary; implementation_name != 'pypy'"]

[index.packages.psycopg-binary]

[index.packages.psycopg-binary.versions]

[index.packages.psycopg-binary.versions."1.0.0"]

[index.packages.tzdata]

[index.packages.tzdata.versions]

[index.packages.tzdata.versions."1.0.0"]
