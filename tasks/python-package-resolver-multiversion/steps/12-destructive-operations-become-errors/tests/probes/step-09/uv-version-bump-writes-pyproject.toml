id = "uv-version-bump-writes-pyproject"
step = 9
group = "version-command"
mode = "bare"
argv = ["version", "--bump", "minor", "--offline"]
observe = ["status", "stdout", "file:pyproject.toml"]
[files]
"pyproject.toml" = """
[project]
name = "project"
version = "1.2.3"
requires-python = ">=3.12"
dependencies = []
"""
