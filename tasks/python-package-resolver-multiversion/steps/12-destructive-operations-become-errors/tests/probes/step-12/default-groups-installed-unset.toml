id = "default-groups-installed-unset"
step = 12
group = "default-dependency-groups"
python = "3.12"
mode = "bare"
argv = ["export", "--no-header", "--no-hashes", "--no-emit-project"]
observe = ["status", "stdout"]
[files]
"pyproject.toml" = """
[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["c==1.0.0"]

[dependency-groups]
dev = ["b==1.0.0"]

[[tool.uv.index]]
name = "local"
url = "{INDEX}"
default = true
"""
[index.packages.b.versions."1.0.0"]
[index.packages.c.versions."1.0.0"]
