id = "no-default-groups-env-false"
step = 12
group = "default-dependency-groups"
python = "3.12"
mode = "bare"
argv = ["sync"]
observe = ["status", "glob:.venv/lib/*/site-packages/*.dist-info"]
[env]
UV_NO_DEFAULT_GROUPS = "false"
[files]
"pyproject.toml" = """
[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["c==1.0.0"]

[dependency-groups]
dev = ["b==1.0.0"]

[[tool.uv.index]]
name = "local"
url = "{INDEX}"
default = true
"""
[index.packages.b.versions."1.0.0"]
[index.packages.c.versions."1.0.0"]
