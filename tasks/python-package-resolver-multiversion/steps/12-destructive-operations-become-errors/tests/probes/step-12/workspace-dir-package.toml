id = "workspace-dir-package"
step = 12
group = "workspace-introspection"
python = "3.12"
mode = "bare"
# `--package` names a member and redirects `workspace dir` from the workspace
# root to that member's own root. Run from inside `pkgs/leaf` so the plain form
# would have printed the root: what is read is the option's effect, not the
# working directory's.
argv = ["--directory", "pkgs/leaf", "workspace", "dir", "--package", "other"]
observe = ["status", "stdout"]
[files]
"pyproject.toml" = """
[project]
name = "root"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["pkgs/*"]
"""
"pkgs/leaf/pyproject.toml" = """
[project]
name = "leaf"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []
"""
"pkgs/other/pyproject.toml" = """
[project]
name = "other"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []
"""
