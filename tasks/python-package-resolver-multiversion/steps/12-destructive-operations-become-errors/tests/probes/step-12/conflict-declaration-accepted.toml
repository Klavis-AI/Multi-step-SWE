id = "conflict-declaration-accepted"
step = 12
group = "conflict-declaration-strictness"
python = "3.12"
mode = "bare"
argv = ["lock"]
observe = ["status", "glob:uv.lock"]
[files]
"pyproject.toml" = """
[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
x = ["b==1.0.0"]
y = ["c==1.0.0"]

[tool.uv]
conflicts = [[{ extra = "x" }, { extra = "y" }]]

[[tool.uv.index]]
name = "local"
url = "{INDEX}"
default = true
"""
[index.packages.b.versions."1.0.0"]
[index.packages.c.versions."1.0.0"]
