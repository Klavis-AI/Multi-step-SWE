id = "fail-conflicting-transitive-pins"
step = 1
group = "resolution-failure"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "aa", "bb"]
observe = ["status", "freeze"]

[index.packages.aa.versions."1.0.0"]
requires = ["cc==1.0.0"]
[index.packages.bb.versions."1.0.0"]
requires = ["cc==2.0.0"]
[index.packages.cc.versions."1.0.0"]
[index.packages.cc.versions."2.0.0"]
