# packse scenario 'multiple-extras-required'
id = "scen-extras-multiple-extras-required"
step = 1
group = "scenario-extras"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--no-cache", "--index-url", "{INDEX}", "a[extra_b,extra_c]"]
observe = ["status", "freeze"]

[index]

[index.packages]

[index.packages.b]

[index.packages.b.versions]

[index.packages.b.versions."1.0.0"]

[index.packages.c]

[index.packages.c.versions]

[index.packages.c.versions."1.0.0"]

[index.packages.a]

[index.packages.a.versions]

[index.packages.a.versions."1.0.0"]

[index.packages.a.versions."1.0.0".extras]
extra_b = ["b"]
extra_c = ["c"]
