# UV_PROJECT_ENVIRONMENT relocates the project environment; the default
# .venv is not created.
id = "s05-project-environment-env-var"
step = 5
group = "project-environment-path"
python = "3.12"
mode = "bare"
argv = ["sync", "--offline"]
observe = ["status", "glob:myenv/pyvenv.cfg", "glob:.venv/pyvenv.cfg"]

[env]
UV_PROJECT_ENVIRONMENT = "myenv"

[files]
"pyproject.toml" = '''
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []
'''
