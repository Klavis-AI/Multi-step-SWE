# `uv init` no longer writes a `.python-version` for a workspace member when it
# matches the workspace root's, because the root's file is now inherited.
id = "init-member-python-version"
step = 6
group = "init-python-version-inheritance"
python = "3.12"
mode = "bare"
argv = ["init", "member"]
observe = ["status", "glob:**/.python-version"]
[files]
".python-version" = "3.12\n"
"pyproject.toml" = """
[project]
name = "root"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["member"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
"""
