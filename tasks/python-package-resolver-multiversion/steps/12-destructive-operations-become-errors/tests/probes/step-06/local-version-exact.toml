# PEP 440 local-version semantics: `a==1.0.0` now matches `1.0.0+cpu` even
# though a bare `1.0.0` was never published.
id = "local-version-exact"
step = 6
group = "local-version-semantics"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "a==1.0.0"]
observe = ["status", "freeze"]
[index.packages.a.versions."1.0.0+cpu"]
