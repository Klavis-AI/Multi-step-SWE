# A `!=` specifier that mentions a pre-release is no longer an opt-in to
# pre-releases, so the stable release wins over the newer pre-release.
id = "not-equals-no-prerelease"
step = 6
group = "prerelease-not-equals"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "a!=2.0.0a1"]
observe = ["status", "freeze"]
[index.packages.a.versions."1.0.0"]
[index.packages.a.versions."3.0.0a1"]
