id = "wheel-tag-skips-foreign-abi"
step = 1
group = "wheel-selection"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "abipkg"]
observe = [
  "status",
  "freeze",
  "file:.venv/lib/python3.12/site-packages/abipkg-1.0.0.dist-info/WHEEL",
]

[index.packages.abipkg.versions."1.0.0"]
sdist = false
wheel_tags = ["cp39-cp39-manylinux_2_17_x86_64", "cp312-cp312-manylinux_2_17_x86_64", "cp313-cp313-manylinux_2_17_x86_64"]
