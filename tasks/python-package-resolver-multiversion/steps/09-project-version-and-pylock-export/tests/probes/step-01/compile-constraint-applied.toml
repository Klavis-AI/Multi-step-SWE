id = "compile-constraint-applied"
step = 1
group = "compile-output"
python = "3.12"
mode = "venv"
argv = ["pip", "compile", "--index-url", "{INDEX}", "--no-cache", "--no-header", "--no-annotate", "-c", "con.txt", "-o", "out.txt", "req.in"]
observe = ["status", "file:out.txt"]

[files]
"req.in" = """
ctop
"""
"con.txt" = """
cleaf<3.0.0
"""

[index.packages.ctop.versions."1.0.0"]
requires = ["cleaf"]
[index.packages.cleaf.versions."2.4.0"]
[index.packages.cleaf.versions."3.1.0"]
