id = "compile-stdout-pins"
step = 1
group = "compile-output"
python = "3.12"
mode = "venv"
argv = ["pip", "compile", "--index-url", "{INDEX}", "--no-cache", "--no-header", "--no-annotate", "req.in"]
observe = ["status", "stdout"]

[files]
"req.in" = """
ctop==1.0.0
"""

[index.packages.ctop.versions."1.0.0"]
requires = ["cleaf>=3.0.0"]
[index.packages.ctop.versions."2.0.0"]
[index.packages.cleaf.versions."3.1.0"]
