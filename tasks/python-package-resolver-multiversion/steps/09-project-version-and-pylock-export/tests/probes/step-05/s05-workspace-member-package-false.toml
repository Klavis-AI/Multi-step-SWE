# `package = false` on a workspace member drops that member from the installed
# set; the packaged root and the packaged sibling are still installed.  Every
# project here has an in-tree build backend, so nothing depends on a build
# failure.
id = "s05-workspace-member-package-false"
step = 5
group = "virtual-workspace-root"
python = "3.12"
mode = "bare"
argv = ["sync", "--offline"]
observe = ["status", "glob:.venv/lib/python*/site-packages/*.dist-info"]

[files]
"pkgs/m/tinybk.py" = '''
"""In-tree PEP 517 backend: needs no third-party build requirement."""
import base64, hashlib, io, os, tarfile, zipfile

NAME = "m"
VERSION = "0.1.0"
HERE = os.path.dirname(os.path.abspath(__file__))
META = (
    "Metadata-Version: 2.1\n"
    "Name: " + NAME + "\n"
    "Version: " + VERSION + "\n"
    "Summary: probe fixture\n"
)
EPOCH = (1980, 1, 1, 0, 0, 0)


def _add(zf, arc, data, records):
    info = zipfile.ZipInfo(arc, date_time=EPOCH)
    info.external_attr = 0o644 << 16
    zf.writestr(info, data)
    b64 = base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b"=").decode()
    records.append("%s,sha256=%s,%d" % (arc, b64, len(data)))


def _finish(zf, distinfo, records):
    _add(zf, "%s/METADATA" % distinfo, META.encode(), records)
    _add(zf, "%s/WHEEL" % distinfo,
         b"Wheel-Version: 1.0\nGenerator: tinybk\nRoot-Is-Purelib: true\nTag: py3-none-any\n",
         records)
    _add(zf, "%s/entry_points.txt" % distinfo,
         ("[console_scripts]\n%s-cli = %s:main\n" % (NAME, NAME)).encode(), records)
    records.append("%s/RECORD,," % distinfo)
    _add(zf, "%s/RECORD" % distinfo, ("\n".join(sorted(records)) + "\n").encode(), [])


def build_wheel(wheel_directory, config_settings=None, metadata_directory=None):
    distinfo = "%s-%s.dist-info" % (NAME, VERSION)
    fname = "%s-%s-py3-none-any.whl" % (NAME, VERSION)
    records = []
    with zipfile.ZipFile(os.path.join(wheel_directory, fname), "w") as zf:
        with open(os.path.join(HERE, "src", NAME, "__init__.py"), "rb") as fh:
            _add(zf, "%s/__init__.py" % NAME, fh.read(), records)
        _finish(zf, distinfo, records)
    return fname


def build_editable(wheel_directory, config_settings=None, metadata_directory=None):
    distinfo = "%s-%s.dist-info" % (NAME, VERSION)
    fname = "%s-%s-py3-none-any.whl" % (NAME, VERSION)
    records = []
    with zipfile.ZipFile(os.path.join(wheel_directory, fname), "w") as zf:
        _add(zf, "_%s_editable.pth" % NAME, (os.path.join(HERE, "src") + "\n").encode(), records)
        _finish(zf, distinfo, records)
    return fname


def build_sdist(sdist_directory, config_settings=None):
    root = "%s-%s" % (NAME, VERSION)
    fname = root + ".tar.gz"
    members = {root + "/PKG-INFO": META.encode()}
    for rel in ("pyproject.toml", "tinybk.py", os.path.join("src", NAME, "__init__.py")):
        with open(os.path.join(HERE, rel), "rb") as fh:
            members[root + "/" + rel.replace(os.sep, "/")] = fh.read()
    raw = io.BytesIO()
    with tarfile.open(fileobj=raw, mode="w") as tf:
        for arc in sorted(members):
            data = members[arc]
            info = tarfile.TarInfo(arc)
            info.size = len(data)
            info.mtime = 0
            info.mode = 0o644
            info.uid = info.gid = 0
            info.uname = info.gname = "root"
            tf.addfile(info, io.BytesIO(data))
    import gzip
    with open(os.path.join(sdist_directory, fname), "wb") as out:
        gz = gzip.GzipFile(filename="", mode="wb", fileobj=out, mtime=0)
        gz.write(raw.getvalue())
        gz.close()
    return fname


