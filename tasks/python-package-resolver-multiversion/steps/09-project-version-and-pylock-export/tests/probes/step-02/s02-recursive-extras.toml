id = "s02-recursive-extras"
step = 2
group = "extras-resolution"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "a[all]"]
observe = ["status", "freeze"]
[index.packages.b.versions."1.0.0"]
[index.packages.c.versions."1.0.0"]
[index.packages.a.versions."1.0.0".extras]
all = ["a[extra_b]", "a[extra_c]"]
extra_b = ["b"]
extra_c = ["c"]
