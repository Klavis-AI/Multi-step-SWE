id = "s02-transitive-incompatible-versions"
step = 2
group = "resolver-exit-codes"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "a==1.0.0"]
observe = ["status", "freeze"]
[index.packages.a.versions."1.0.0"]
requires = ["b==2.0.0", "b==1.0.0"]
[index.packages.b.versions."1.0.0"]
[index.packages.b.versions."2.0.0"]
