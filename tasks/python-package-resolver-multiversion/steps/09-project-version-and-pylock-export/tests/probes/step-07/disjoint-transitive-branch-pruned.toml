id = "disjoint-transitive-branch-pruned"
step = 7
group = "marker-disjointness"
mode = "bare"
argv = ["pip", "compile", "--universal", "--no-header", "--no-annotate", "--no-cache",
        "--python-version", "3.12", "--index-url", "{INDEX}", "requirements.in"]
observe = ["status", "stdout"]
[files]
"requirements.in" = """
a>=2 ; platform_system == 'Linux'
a<2 ; platform_system == 'Darwin'
"""
[index.packages.a.versions."1.0.0"]
requires = ["b ; sys_platform == 'linux'"]
[index.packages.a.versions."2.0.0"]
[index.packages.b.versions."1.0.0"]
