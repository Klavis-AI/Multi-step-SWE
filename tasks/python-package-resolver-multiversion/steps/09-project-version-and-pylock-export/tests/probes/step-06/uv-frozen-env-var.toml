# `UV_FROZEN` became a supported spelling of `--frozen`, so `uv sync` refuses
# to create the missing lockfile.  Recording only the lockfile's absence keeps
# the field clear of the later exit-code reshuffle.
id = "uv-frozen-env-var"
step = 6
group = "global-options"
python = "3.12"
mode = "venv"
timeout = 300
argv = ["sync"]
observe = ["glob:uv.lock"]
[env]
UV_FROZEN = "1"
UV_INDEX_URL = "{INDEX}"
UV_NO_CACHE = "1"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["a"]
"""
[index.packages.a.versions."1.0.0"]
