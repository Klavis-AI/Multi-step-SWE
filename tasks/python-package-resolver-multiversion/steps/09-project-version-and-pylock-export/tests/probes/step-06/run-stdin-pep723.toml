# PEP 723 inline metadata is honoured for a script piped in on stdin.
id = "run-stdin-pep723"
step = 6
group = "run-interface-additions"
python = "3.12"
mode = "venv"
timeout = 300
argv = ["run", "--no-project", "--index-url", "{INDEX}", "--no-cache", "-"]
stdin = """
# /// script
# requires-python = ">=3.12"
# dependencies = ["a"]
# ///
import a
print("imported", a.__version__)
"""
observe = ["status", "stdout"]
[index.packages.a.versions."1.0.0"]
