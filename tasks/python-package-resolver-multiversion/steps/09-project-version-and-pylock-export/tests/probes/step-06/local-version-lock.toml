# The project resolver reaches the same conclusion for a locked dependency.
id = "local-version-lock"
step = 6
group = "local-version-semantics"
python = "3.12"
mode = "bare"
timeout = 300
argv = ["lock"]
observe = ["status", "glob:uv.lock"]
[env]
UV_INDEX_URL = "{INDEX}"
UV_NO_CACHE = "1"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["a==1.0.0"]
"""
[index.packages.a.versions."1.0.0+cpu"]
