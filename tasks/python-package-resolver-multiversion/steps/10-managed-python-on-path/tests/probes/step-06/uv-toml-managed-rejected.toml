# `managed` is a pyproject-only setting; a `uv.toml` that defines it is now an
# error rather than silently ignored.
id = "uv-toml-managed-rejected"
step = 6
group = "uv-toml-strictness"
python = "3.12"
mode = "bare"
argv = ["venv"]
observe = ["status", "glob:.venv/pyvenv.cfg"]
[files]
"uv.toml" = "managed = false\n"
