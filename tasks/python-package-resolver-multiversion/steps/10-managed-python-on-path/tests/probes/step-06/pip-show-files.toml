# `uv pip show --files` lists the installed files of a distribution.
id = "pip-show-files"
step = 6
group = "pip-interface-additions"
python = "3.12"
mode = "venv"
setup_argv = [["pip", "install", "--index-url", "{INDEX}", "--no-cache", "a"]]
argv = ["pip", "show", "--files", "a"]
observe = ["status", "stdout"]
[index.packages.a.versions."1.0.0"]
