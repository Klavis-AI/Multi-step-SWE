id = "fork-strategy-cli-overrides-setting"
step = 7
group = "forking-preference-setting"
mode = "bare"
argv = ["pip", "compile", "--universal", "--no-header", "--no-annotate", "--no-cache",
        "--fork-strategy", "requires-python", "--python-version", "3.9",
        "--index-url", "{INDEX}", "requirements.in"]
observe = ["status", "stdout"]
[env]
UV_INDEX_URL = "{INDEX}"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["a"]

[tool.uv]
package = false
fork-strategy = "fewest"
"""
"requirements.in" = """
a
"""
[index.packages.a.versions."1.0.0"]
requires_python = ">=3.9"
[index.packages.a.versions."2.0.0"]
requires_python = ">=3.12"
