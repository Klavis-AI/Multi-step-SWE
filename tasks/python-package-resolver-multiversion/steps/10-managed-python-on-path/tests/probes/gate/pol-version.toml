# Proof of life: the binary exists, parses a global flag, and exits clean.
# Only the status is recorded — the version string itself gains a target
# triple at step 13, so the text is not a constant of the chain.
id = "pol-version"
step = 0
group = "proof-of-life"
python = "3.12"
mode = "bare"
argv = ["--version"]
observe = ["status"]
