id = "marker-platform-and-osname"
step = 1
group = "marker-evaluation"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "plroot"]
observe = ["status", "freeze"]

[index.packages.plroot.versions."1.0.0"]
requires = [
  "windep; sys_platform == 'win32'",
  "posixdep; os_name == 'posix'",
  "extradep; extra == 'nope'",
]
[index.packages.windep.versions."1.0.0"]
[index.packages.posixdep.versions."1.0.0"]
[index.packages.extradep.versions."1.0.0"]
