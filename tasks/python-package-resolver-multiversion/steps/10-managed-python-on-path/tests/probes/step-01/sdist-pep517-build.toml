id = "sdist-pep517-build"
step = 1
group = "sdist-build"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "--no-deps", "srcpkg"]
observe = [
  "status",
  "freeze",
  "file:.venv/lib/python3.12/site-packages/srcpkg-1.0.0.dist-info/WHEEL",
]

[index.packages.srcpkg.versions."1.0.0"]
wheel = false
