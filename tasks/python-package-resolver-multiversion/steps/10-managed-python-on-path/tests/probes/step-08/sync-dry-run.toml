# PROFILE.md 8 `uv sync` and `uv tree` flags: `--dry-run` "resolves and reports
# what it would do without creating or modifying the environment". The status
# alone cannot tell that apart from a sync that ran and did nothing useful, so
# the filesystem is read too: a dry run leaves no project environment behind.
id = "sync-dry-run"
step = 8
group = "project-command-flags"
python = "3.12"
mode = "bare"
argv = ["sync", "--dry-run"]
observe = ["status", "glob:.venv/lib/python3.12/site-packages/*.dist-info"]
timeout = 300

[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["leafpkg"]

[tool.uv]
index-url = "{INDEX}"
"""

[index.packages.leafpkg.versions."1.0.0"]
