id = "s04-add-locks-without-syncing"
step = 4
group = "project-add-remove"
python = "3.12"
mode = "bare"
argv = ["add", "--no-sync", "midpkg"]
observe = ["status", "file:pyproject.toml", "glob:uv.lock"]

[files]
"pyproject.toml" = '''
[project]
name = "root"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
index-url = "{INDEX}"
'''

[index.packages.leafpkg.versions."1.0.0"]
[index.packages.midpkg.versions."2.1.0"]
requires = ["leafpkg>=1"]
[index.packages.toppkg.versions."3.0.0"]
requires = ["midpkg"]
