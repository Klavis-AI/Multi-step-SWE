id = "add-bounds-constraint-style"
step = 10
group = "path-and-workspace-sources"
mode = "bare"
timeout = 180
argv = ["add", "--no-sync", "--bounds", "major", "a"]
observe = ["status", "file:pyproject.toml"]
[env]
UV_INDEX_URL = "{INDEX}"
[files]
"pyproject.toml" = """
[project]
name = "root"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []
"""
[index.packages.a.versions."1.2.3"]
