id = "init-lib-writes-uv-build"
step = 10
group = "default-build-backend"
mode = "bare"
timeout = 180
# `uv init --lib` is the one scaffold that writes a `[build-system]` naming uv's
# own backend rather than another one. `sync --offline` is what forces the
# scaffolded project to be built, so the backend is what is read here and not
# only the table that names it.
setup_argv = [["init", "--lib", "demo"]]
argv = ["sync", "--offline", "--project", "demo"]
observe = ["status", "file:demo/pyproject.toml"]
