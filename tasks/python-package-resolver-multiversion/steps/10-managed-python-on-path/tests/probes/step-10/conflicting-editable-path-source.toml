id = "conflicting-editable-path-source"
step = 10
group = "path-and-workspace-sources"
mode = "bare"
timeout = 180
argv = ["lock", "--offline"]
observe = ["status", "glob:uv.lock"]
[files]
"pyproject.toml" = """
[project]
name = "root"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["foo"]

[dependency-groups]
dev = ["foo"]

[tool.uv.sources]
foo = [{ path = "./foo", editable = true, group = "dev" }, { path = "./foo" }]
"""
"foo/pyproject.toml" = """
[project]
name = "foo"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
"""
