id = "add-subdirectory-workspace-explicit"
step = 10
group = "path-and-workspace-sources"
mode = "bare"
timeout = 180
argv = ["add", "--frozen", "--offline", "--workspace", "./foo"]
observe = ["status", "file:pyproject.toml"]
[files]
"pyproject.toml" = """
[project]
name = "root"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []
"""
"foo/pyproject.toml" = """
[project]
name = "foo"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
"""
"foo/src/foo/__init__.py" = ""
