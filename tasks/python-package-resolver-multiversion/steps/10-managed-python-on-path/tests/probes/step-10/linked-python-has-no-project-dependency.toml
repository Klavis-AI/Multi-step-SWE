id = "linked-python-has-no-project-dependency"
step = 10
group = "managed-python-cli"
mode = "bare"
pyinstall = "3.12.14"
timeout = 300
setup_argv = [["python", "install", "--default", "3.12"], ["sync"]]
argv = ["pip", "freeze", "--python", "bin/python3.12"]
observe = ["status", "stdout"]
[env]
UV_INDEX_URL = "{INDEX}"
[files]
"pyproject.toml" = """
[project]
name = "root"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["a"]
"""
[index.packages.a.versions."1.0.0"]
