id = "uv-python-env-unsatisfiable-request-no-fallback"
step = 3
group = "no-silent-fallback"
mode = "bare"
argv = ["venv", ".venv"]
observe = ["glob:.venv/lib/python3.*"]

[env]
UV_PYTHON = "cpython@3.13"
PATH = "{PYROOT}/cpython-3.9-linux-x86_64-gnu/bin:{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin:/usr/bin:/bin"
