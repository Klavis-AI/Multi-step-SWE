# packse scenario 'local-transitive-conflicting'
id = "scen-local-local-transitive-conflicting"
step = 1
group = "scenario-local"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--no-cache", "--index-url", "{INDEX}", "a", "b==2.0.0+foo"]
observe = ["status", "freeze"]

[index]

[index.packages]

[index.packages.a]

[index.packages.a.versions]

[index.packages.a.versions."1.0.0"]
requires = ["b==2.0.0+bar"]

[index.packages.b]

[index.packages.b.versions]

[index.packages.b.versions."2.0.0+bar"]

[index.packages.b.versions."2.0.0+foo"]
