id = "venv-default-layout"
step = 1
group = "venv-creation"
python = "3.12"
mode = "bare"
argv = ["venv", "--python", "python3.12"]
observe = ["status", "glob:.venv/bin/python*", "glob:.venv/pyvenv.cfg", "glob:.venv/lib/python3.12/site-packages", "glob:.venv/lib/python3.12/site-packages/*.dist-info"]
