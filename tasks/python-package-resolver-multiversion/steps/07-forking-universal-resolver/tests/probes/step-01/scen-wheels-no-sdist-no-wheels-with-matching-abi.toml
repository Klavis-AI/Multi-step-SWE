# packse scenario 'no-sdist-no-wheels-with-matching-abi'
# The observation is that a version whose only wheels carry non-matching tags
# and which offers no source distribution leaves the environment empty and
# fails: `PROFILE.md` § 1 fixes that as status `1` with nothing installed.
# `--python-platform` used to be passed here to pin the platform half of tag
# matching; it is not passed any more. The releases this chain starts from
# reject the option outright, so the flag turned the observation into an
# argument-parsing error at the early tags -- the assertion was reached without
# any tag matching happening. The wheel tags below do not match a CPython
# environment on any platform, so pinning one buys nothing.
id = "scen-wheels-no-sdist-no-wheels-with-matching-abi"
step = 1
group = "scenario-wheels"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--no-cache", "--index-url", "{INDEX}", "a"]
observe = ["status", "freeze"]

[index]

[index.packages]

[index.packages.a]

[index.packages.a.versions]

[index.packages.a.versions."1.0.0"]
wheel_tags = ["py3-graalpy240_310_native-any"]
sdist = false
