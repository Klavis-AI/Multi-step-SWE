# A parent `.python-version` naming a version that is neither installed nor
# downloadable is now fatal, so no environment is created.  Only the
# file-existence field is recorded: the exit code of the failure itself is
# reshuffled by later releases.
id = "pyversion-parent-unavailable"
step = 6
group = "python-version-parent-discovery"
python = "3.12"
mode = "bare"
argv = ["--directory", "child", "venv"]
observe = ["glob:child/.venv/pyvenv.cfg"]
[files]
".python-version" = "3.8\n"
"child/keep.txt" = "x\n"
