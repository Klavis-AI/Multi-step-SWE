# packse scenario 'fork-marker-track'
id = "scen-fork-marker-track"
step = 4
group = "scenario-fork"
python = "3.12"
mode = "bare"
argv = ["lock", "--index-url", "{INDEX}", "--python", "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin/python3.12"]
observe = ["status", "lockset"]

[files]
"pyproject.toml" = '''
[project]
name = "project"
version = "0.1.0"
dependencies = [
  "a",
  "b>=2.8 ; sys_platform == 'linux'",
  "b<2.8 ; sys_platform == 'darwin'"
]
'''

[index]

[index.packages]

[index.packages.a]

[index.packages.a.versions]

[index.packages.a.versions."1.3.1"]
requires = ["c ; implementation_name == 'iron'"]

[index.packages.a.versions."2.0.0"]
requires = ["b>=2.8", "c ; implementation_name == 'cpython'"]

[index.packages.a.versions."3.1.0"]
requires = ["b>=2.8", "c ; implementation_name == 'pypy'"]

[index.packages.a.versions."4.3.0"]
requires = ["b>=2.8"]

[index.packages.b]

[index.packages.b.versions]

[index.packages.b.versions."2.7"]

[index.packages.b.versions."2.8"]

[index.packages.c]

[index.packages.c.versions]

[index.packages.c.versions."1.10"]
