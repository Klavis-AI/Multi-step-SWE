id = "sync-check-exit-code"
step = 10
group = "exit-code-conventions"
mode = "bare"
timeout = 180
setup_argv = [["lock"]]
argv = ["sync", "--check", "--offline"]
observe = ["status", "stderr"]
[env]
UV_INDEX_URL = "{INDEX}"
[files]
"pyproject.toml" = """
[project]
name = "root"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["a"]
"""
[index.packages.a.versions."1.0.0"]
