# `allow-insecure-host` moved out of `[pip]` and became a global option.
id = "uv-toml-pip-insecure-host"
step = 6
group = "uv-toml-strictness"
python = "3.12"
mode = "bare"
argv = ["venv"]
observe = ["status", "glob:.venv/pyvenv.cfg"]
[files]
"uv.toml" = """
[pip]
allow-insecure-host = ["127.0.0.1"]
"""
