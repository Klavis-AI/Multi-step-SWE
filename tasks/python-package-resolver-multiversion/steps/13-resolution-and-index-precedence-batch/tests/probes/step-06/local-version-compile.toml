# Resolution through `uv pip compile` records the local segment it chose.
id = "local-version-compile"
step = 6
group = "local-version-semantics"
python = "3.12"
mode = "bare"
argv = ["pip", "compile", "--index-url", "{INDEX}", "--no-cache", "--no-header", "--no-annotate", "-o", "out.txt", "reqs.in"]
observe = ["status", "file:out.txt"]
[files]
"reqs.in" = "a==1.0.0\n"
[index.packages.a.versions."1.0.0+cpu"]
