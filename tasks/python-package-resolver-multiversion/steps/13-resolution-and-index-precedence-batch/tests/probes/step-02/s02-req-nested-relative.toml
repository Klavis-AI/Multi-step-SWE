id = "s02-req-nested-relative"
step = 2
group = "requirements-file-options"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "-r", "sub/requirements.txt"]
observe = ["status", "freeze"]
[files]
"sub/requirements.txt" = """
-r base.txt
"""
"sub/base.txt" = """
a
"""
[index.packages.a.versions."1.0.0"]
