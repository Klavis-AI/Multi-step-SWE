id = "s02-req-nested-env-var-path"
step = 2
group = "requirements-file-options"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "-r", "requirements.txt"]
observe = ["status", "freeze"]
[env]
SUBFILE = "extra.txt"
[files]
"requirements.txt" = """
-r ${SUBFILE}
"""
"extra.txt" = """
a
"""
[index.packages.a.versions."1.0.0"]
