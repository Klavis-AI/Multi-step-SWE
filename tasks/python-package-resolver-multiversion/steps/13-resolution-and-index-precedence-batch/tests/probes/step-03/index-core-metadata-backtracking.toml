id = "index-core-metadata-backtracking"
step = 3
group = "detached-metadata-attribute"
python = "3.12"
mode = "venv"
argv = ["pip", "compile", "--index-url", "{INDEX}", "--no-cache", "--no-header", "--no-annotate", "-o", "out.txt", "req.in"]
observe = ["status", "file:out.txt"]

[files]
"req.in" = """
mtop
"""

[index.packages.mtop.versions."1.0.0"]
requires = ["mmid"]
[index.packages.mmid.versions."1.0.0"]
requires = ["mleaf==1.0.0"]
[index.packages.mmid.versions."2.0.0"]
requires = ["mleaf==1.0.0"]
detached_requires = ["mleaf==9.9.9"]
metadata_attribute = "core-metadata"
[index.packages.mleaf.versions."1.0.0"]
