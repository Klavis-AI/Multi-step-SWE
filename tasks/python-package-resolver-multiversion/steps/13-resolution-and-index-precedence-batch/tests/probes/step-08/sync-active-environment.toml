id = "sync-active-environment"
step = 8
group = "project-command-flags"
python = "3.12"
mode = "venv"
argv = ["sync", "--active"]
observe = [
  "status",
  "glob:.venv/lib/python3.12/site-packages/*.dist-info",
  "glob:penv/lib/python3.12/site-packages/*.dist-info",
]

[env]
UV_PROJECT_ENVIRONMENT = "penv"

[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["leafpkg"]

[tool.uv]
index-url = "{INDEX}"
"""

[index.packages.leafpkg.versions."1.0.0"]
