id = "conflicts-single-entry-rejected"
step = 7
group = "conflicts-declaration"
mode = "bare"
argv = ["lock"]
observe = ["status", "glob:uv.lock"]
[env]
UV_INDEX_URL = "{INDEX}"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
x = ["a==1.0.0"]

[tool.uv]
package = false
conflicts = [[{ extra = "x" }]]
"""
[index.packages.a.versions."1.0.0"]
