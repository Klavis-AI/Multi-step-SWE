id = "fork-sibling-filtering"
step = 7
group = "marker-normalization"
mode = "bare"
argv = ["pip", "compile", "--universal", "--no-header", "--no-annotate", "--no-cache",
        "--python-version", "3.12", "--index-url", "{INDEX}", "requirements.in"]
observe = ["status", "stdout"]
[files]
"requirements.in" = """
a==4.4.0 ; platform_system == 'Linux'
a==4.3.0 ; platform_system == 'Darwin'
b==1.0.0 ; platform_system == 'Linux'
c==1.0.0 ; platform_system == 'Darwin'
"""
[index.packages.a.versions."4.3.0"]
[index.packages.a.versions."4.4.0"]
[index.packages.b.versions."1.0.0"]
requires = ["d==1.0.0"]
[index.packages.c.versions."1.0.0"]
requires = ["d==2.0.0"]
[index.packages.d.versions."1.0.0"]
[index.packages.d.versions."2.0.0"]
