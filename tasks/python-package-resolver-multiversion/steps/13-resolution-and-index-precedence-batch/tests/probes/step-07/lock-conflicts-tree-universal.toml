id = "lock-conflicts-tree-universal"
step = 7
group = "conflicts-declaration"
mode = "bare"
setup_argv = [["lock"]]
argv = ["tree", "--universal", "--frozen"]
observe = ["status", "stdout"]
[env]
UV_INDEX_URL = "{INDEX}"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
x = ["a==1.0.0"]
y = ["a==2.0.0"]

[tool.uv]
package = false
conflicts = [[{ extra = "x" }, { extra = "y" }]]
"""
[index.packages.a.versions."1.0.0"]
[index.packages.a.versions."2.0.0"]
