id = "s11-export-editable-pylock"
step = 11
group = "editable-export-mode"
python = "3.12"
mode = "bare"
argv = ["export", "--offline", "--editable", "--format", "pylock.toml", "-o", "pylock.toml"]
observe = ["status", "file:pylock.toml"]
[files]
"pyproject.toml" = """
[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["child"]

[tool.uv]
package = false

[tool.uv.sources]
child = { path = "child", editable = false }
"""
"child/pyproject.toml" = """
[project]
name = "child"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0,<1000"]
build-backend = "uv_build"
"""
"child/README.md" = "# child\n"
"child/src/child/__init__.py" = ""
