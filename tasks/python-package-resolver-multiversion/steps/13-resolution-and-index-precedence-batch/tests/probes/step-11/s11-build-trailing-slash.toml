id = "s11-build-trailing-slash"
step = 11
group = "build-output-workspace-root"
python = "3.12"
mode = "bare"
argv = ["build", "--offline", "child/"]
observe = ["status", "glob:dist/*", "glob:child/dist/*"]
[files]
"pyproject.toml" = """
[tool.uv.workspace]
members = ["child"]
"""
"child/pyproject.toml" = """
[project]
name = "child"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0,<1000"]
build-backend = "uv_build"
"""
"child/README.md" = "# child\n"
"child/src/child/__init__.py" = ""
