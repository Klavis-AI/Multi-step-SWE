id = "fork-strategy-setting-requires-python"
step = 7
group = "forking-preference-setting"
python = "3.13"
mode = "bare"
argv = ["sync"]
observe = ["status", "glob:.venv/lib/python3.13/site-packages/*.dist-info"]
[env]
UV_INDEX_URL = "{INDEX}"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["a"]

[tool.uv]
package = false
fork-strategy = "requires-python"
"""
[index.packages.a.versions."1.0.0"]
requires_python = ">=3.9"
[index.packages.a.versions."2.0.0"]
requires_python = ">=3.12"
