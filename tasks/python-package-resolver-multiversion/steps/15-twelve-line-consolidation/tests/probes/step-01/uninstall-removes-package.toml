id = "uninstall-removes-package"
step = 1
group = "install-lifecycle"
python = "3.12"
mode = "venv"
setup_argv = [["pip", "install", "--index-url", "{INDEX}", "--no-cache", "alpha", "beta"]]
argv = ["pip", "uninstall", "alpha"]
observe = ["status", "freeze", "glob:.venv/lib/python3.12/site-packages/*.dist-info"]

[index.packages.alpha.versions."1.0.0"]
[index.packages.beta.versions."1.4.0"]
