id = "s04-run-with-ephemeral-package"
step = 4
group = "project-sync-run"
python = "3.12"
mode = "bare"
argv = ["run", "--no-project", "--with", "leafpkg", "python", "w.py"]
observe = ["status", "stdout"]

[env]
UV_INDEX_URL = "{INDEX}"

[files]
"w.py" = '''
import leafpkg

print("with-ok", leafpkg.__version__)
'''

[index.packages.leafpkg.versions."1.0.0"]
[index.packages.midpkg.versions."2.1.0"]
requires = ["leafpkg>=1"]
[index.packages.toppkg.versions."3.0.0"]
requires = ["midpkg"]
