[project]
name = "project"
version = "0.1.0"
dependencies = [
  "a==4.4.0 ; sys_platform == 'linux'",
  "a==4.3.0 ; sys_platform == 'darwin'",
  "b==1.0.0 ; sys_platform == 'linux'",
  "c==1.0.0 ; sys_platform == 'darwin'"
]
'''

