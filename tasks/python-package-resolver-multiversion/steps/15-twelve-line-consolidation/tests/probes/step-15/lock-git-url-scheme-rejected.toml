id = "lock-git-url-scheme-rejected"
step = 15
group = "lockfile-git-source-validation"
python = "3.12"
mode = "bare"
timeout = 120
argv = ["export", "--frozen", "--offline"]
observe = ["status", "stdout", "stderr"]

[files]
"pyproject.toml" = """
[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["example"]
"""
"uv.lock" = """
version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "example"
version = "1.0.0"
source = { git = "git+https://example.com/pkg.git#0000000000000000000000000000000000000000" }

[[package]]
name = "project"
version = "0.1.0"
source = { virtual = "." }
dependencies = [{ name = "example" }]
"""
