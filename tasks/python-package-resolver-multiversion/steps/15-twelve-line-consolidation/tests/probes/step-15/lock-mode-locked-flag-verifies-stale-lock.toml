id = "lock-mode-locked-flag-verifies-stale-lock"
step = 15
group = "lock-mode-overrides"
python = "3.12"
mode = "bare"
timeout = 120
argv = ["lock", "--locked"]
observe = ["status", "file:uv.lock"]

[env]
UV_FROZEN = "1"

[files]
"pyproject.toml" = """
[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []
"""
"uv.lock" = """
version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "project"
version = "0.2.0"
source = { virtual = "." }
"""
