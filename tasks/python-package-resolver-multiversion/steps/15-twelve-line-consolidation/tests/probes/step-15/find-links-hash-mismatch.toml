id = "find-links-hash-mismatch"
step = 15
group = "flat-index-local-html"
python = "3.12"
mode = "venv"
timeout = 120
argv = ["pip", "install", "--no-index", "--find-links", "links.html", "--no-cache", "a"]
observe = ["status", "freeze"]

[files]
"links.html" = """
<!DOCTYPE html><html><body>
<a href="{INDEX}/../files/a-1.0.0-py3-none-any.whl#sha256=1111111111111111111111111111111111111111111111111111111111111111">a-1.0.0-py3-none-any.whl</a><br/>
</body></html>
"""

[index.packages.a.versions."1.0.0"]
