id = "pylock-wheel-version-mismatch"
step = 15
group = "pylock-wheel-identity"
python = "3.12"
mode = "venv"
timeout = 120
argv = ["pip", "install", "--preview", "--no-cache", "-r", "pylock.toml"]
observe = ["status", "freeze"]

[files]
"pylock.toml" = """
lock-version = "1.0"
created-by = "uv"
requires-python = ">=3.12"

[[packages]]
name = "a"
version = "2.0.0"
wheels = [{ url = "{INDEX}/../files/a-1.0.0-py3-none-any.whl", hashes = { sha256 = "0ca0f3dfae5a4e3ef301c46da14989677b67fd1ca261d1e1d800207c8d1f5fe0" } }]
"""

[index.packages.a.versions."1.0.0"]
