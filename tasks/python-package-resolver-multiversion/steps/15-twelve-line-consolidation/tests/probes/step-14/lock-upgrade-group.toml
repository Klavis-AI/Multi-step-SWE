# `uv lock --upgrade-group <name>` targets a declared dependency group.
id = "lock-upgrade-group"
step = 14
group = "lock-upgrade-group"
mode = "bare"
argv = ["lock", "--upgrade-group", "docs"]
observe = ["status", "glob:uv.lock"]
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
docs = []
"""
