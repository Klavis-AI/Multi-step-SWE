# `uv venv --clear` refuses to delete a directory that is not a virtual
# environment, so the directory's contents survive.
id = "venv-clear-non-venv"
step = 14
group = "venv-safe-clear"
mode = "bare"
argv = ["venv", "--clear", "target"]
observe = ["status", "file:target/important.txt", "glob:target/pyvenv.cfg"]
[files]
"target/important.txt" = "do not delete me\n"
