# A `pylock.toml` without a `packages` array is malformed input, not an empty
# lockfile: `uv pip sync` must reject it instead of emptying the environment.
id = "pylock-missing-packages"
step = 14
group = "pylock-validation"
mode = "venv"
setup_argv = [["pip", "install", "--index-url", "{INDEX}", "--no-cache", "a"]]
argv = ["pip", "sync", "pylock.toml"]
observe = ["status", "freeze"]
[files]
"pylock.toml" = """
lock-version = "1.0"
created-by = "probe"
requires-python = ">=3.12"
"""
[index.packages.a.versions."1.0.0"]
