# `uv run path/to/script.py` discovers the project from the script's directory,
# so the neighbouring project's (unsatisfiable) interpreter request applies.
id = "run-script-project-discovery"
step = 14
group = "project-selection-strictness"
mode = "bare"
argv = ["run", "other/script.py"]
observe = ["status", "stdout"]
[files]
"other/pyproject.toml" = """
[project]
name = "other"
version = "0.1.0"
requires-python = ">=3.99"
dependencies = []
"""
"other/script.py" = "print('ran the script')\n"
