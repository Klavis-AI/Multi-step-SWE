# `--force` is the documented opt-out and still clears the directory.
id = "venv-clear-force"
step = 14
group = "venv-safe-clear"
mode = "bare"
argv = ["venv", "--clear", "--force", "target"]
observe = ["status", "file:target/important.txt", "glob:target/pyvenv.cfg"]
[files]
"target/important.txt" = "delete me\n"
