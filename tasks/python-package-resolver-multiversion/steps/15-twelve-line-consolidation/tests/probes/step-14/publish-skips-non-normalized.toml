# `uv publish` skips distributions whose filename is not normalized instead of
# trying to upload them.  The publish URL is a dead loopback port: at 0.11.0 the
# file is read and rejected before any request, at 0.12.0 it is never read.
id = "publish-skips-non-normalized"
step = 14
group = "publish-filename-normalization"
mode = "bare"
argv = ["publish", "--token", "probe", "--publish-url", "http://127.0.0.1:1/legacy/", "dist/example-1.01.0-py3-none-any.whl"]
observe = ["status"]
[files]
"dist/example-1.01.0-py3-none-any.whl" = "not a real wheel"
