# In hash-checking mode every requirement needs at least one secure digest; a
# correct-but-MD5-only hash is no longer enough.  The digest below is the real
# MD5 of the wheel this index serves, so the old behaviour installs cleanly.
id = "md5-only-hash-rejected"
step = 14
group = "hash-checking-mode"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "--require-hashes", "-r", "reqs.txt"]
observe = ["status", "freeze"]
[files]
"reqs.txt" = "a==1.0.0 --hash=md5:4006430382ab50d58d11822273b543b0\n"
[index.packages.a.versions."1.0.0"]
sdist = false
wheel = true
