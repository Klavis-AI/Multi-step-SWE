# packse prereleases/transitive-prerelease-and-stable-dependency: a transitive
# requirement pins a pre-release; no stable candidate satisfies the conjunction,
# so the resolver must fall back to the pre-release.
id = "prerelease-transitive-pin"
step = 14
group = "prerelease-fallback"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "a", "b"]
observe = ["status", "freeze"]
[index.packages.a.versions."1.0.0"]
requires = ["c==2.0.0b1"]
[index.packages.b.versions."1.0.0"]
requires = ["c>=1.0.0,<=3.0.0"]
[index.packages.c.versions."1.0.0"]
[index.packages.c.versions."2.0.0b1"]
