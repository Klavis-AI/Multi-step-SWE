# A `--require-hashes` line inside a requirements file turns on hash-checking
# mode, so an unpinned, unhashed requirement is an error.
id = "require-hashes-directive"
step = 14
group = "hash-checking-mode"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "-r", "reqs.txt"]
observe = ["status", "freeze"]
[files]
"reqs.txt" = """
--require-hashes
a
"""
[index.packages.a.versions."1.0.0"]
