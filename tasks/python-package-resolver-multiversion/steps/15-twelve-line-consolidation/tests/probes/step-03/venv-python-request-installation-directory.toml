id = "venv-python-request-installation-directory"
step = 3
group = "python-request-path"
mode = "bare"
argv = ["venv", "--python", "{PYROOT}/cpython-3.10-linux-x86_64-gnu", ".venv"]
observe = ["status", "glob:.venv/lib/python3.*"]

[env]
PATH = "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin:/usr/bin:/bin"
