id = "sync-comma-separated-extras"
step = 12
group = "extra-selection-syntax"
python = "3.12"
mode = "bare"
argv = ["sync", "--extra", "x,y"]
observe = ["status", "glob:.venv/lib/*/site-packages/*.dist-info"]
[files]
"pyproject.toml" = """
[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
x = ["b==1.0.0"]
y = ["c==1.0.0"]

[[tool.uv.index]]
name = "local"
url = "{INDEX}"
default = true
"""
[index.packages.b.versions."1.0.0"]
[index.packages.c.versions."1.0.0"]
