id = "sync-uv-no-binary-package-env"
step = 8
group = "build-options-env"
python = "3.12"
mode = "bare"
argv = ["sync"]
observe = ["status", "glob:.venv/lib/python3.12/site-packages/*.dist-info"]

[env]
UV_NO_BINARY_PACKAGE = "wheelpkg"

[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["wheelpkg"]

[tool.uv]
index-url = "{INDEX}"
"""

[index.packages.wheelpkg.versions."1.0.0"]
sdist = false
