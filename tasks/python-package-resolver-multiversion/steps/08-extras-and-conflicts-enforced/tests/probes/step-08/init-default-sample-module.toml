# PROFILE.md 8 `uv init` scaffolding: "For an application project that is not
# packaged -- the default shape, also selected by `--app --no-package` -- the
# module is `main.py` in the project directory." `init-app-sample-module`
# names the two flags; this one passes neither, so it is the "default shape"
# clause on its own -- the release before this milestone wrote `hello.py`
# here. Only `*.py` is globbed: the default scaffold also writes files this
# sentence does not fix. uv changes this default again at 0.12.0, to a packaged
# src-layout project -- step 14 documents that supersession -- so this probe is
# deliberately local to step 08: steps 09-15 each name their own copy of
# `probes/step-08/`, and none of them names this id.
id = "init-default-sample-module"
step = 8
group = "init-scaffold"
mode = "bare"
argv = ["init", "demo"]
observe = ["status", "glob:demo/*.py"]
