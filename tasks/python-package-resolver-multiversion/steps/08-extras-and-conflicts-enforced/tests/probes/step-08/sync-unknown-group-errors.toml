# PROFILE.md 8 "Requests are checked against the project": "`uv sync --group
# <name>`, where `<name>` is not an entry of `[dependency-groups]`, fails with
# exit status 2." The project declares a group, so the name is rejected for
# being absent from that table rather than for there being no table at all.
# `sync-frozen-unknown-group-errors` covers the `--frozen` half of the same
# sentence; this is the plain one, where the check has to happen on the way to
# a resolution rather than on the way to an existing lock.
id = "sync-unknown-group-errors"
step = 8
group = "project-request-validation"
mode = "bare"
argv = ["sync", "--offline", "--group", "nope"]
observe = ["status"]

[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
real = []
"""
