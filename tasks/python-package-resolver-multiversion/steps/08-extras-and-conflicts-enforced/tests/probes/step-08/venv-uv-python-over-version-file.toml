# PROFILE.md 8 "Interpreter selection across the surface": "`UV_PYTHON` ...
# takes precedence over a `.python-version` file and yields to `--python`/`-p`
# given on the command line." Both requests are satisfiable here -- 3.11 and
# 3.12 are on `PATH` -- so the version directory under `.venv/lib` says which
# of the two was read, and a run that honoured the file rather than the
# variable would install python3.11 and fail the assertion. The `--python`
# half of the sentence is the gate probe
# `venv-python-flag-overrides-environment`.
id = "venv-uv-python-over-version-file"
step = 8
group = "python-selection"
mode = "bare"
argv = ["venv", ".venv"]
observe = ["status", "glob:.venv/lib/python3.*"]

[env]
UV_PYTHON = "cpython@3.12"
PATH = "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin:{PYROOT}/cpython-3.11-linux-x86_64-gnu/bin:/usr/bin:/bin"

[files]
".python-version" = "3.11\n"
