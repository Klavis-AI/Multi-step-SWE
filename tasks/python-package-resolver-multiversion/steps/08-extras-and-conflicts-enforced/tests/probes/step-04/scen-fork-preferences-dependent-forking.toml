# packse scenario 'preferences-dependent-forking'
id = "scen-fork-preferences-dependent-forking"
step = 4
group = "scenario-fork"
python = "3.12"
mode = "bare"
argv = ["lock", "--index-url", "{INDEX}", "--python", "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin/python3.12"]
observe = ["status", "lockset", "glob:uv.lock"]

[files]
"pyproject.toml" = '''
[project]
name = "project"
version = "0.1.0"
dependencies = [
  "cleaver",
  "foo",
  "bar"
]
'''

[index]

[index.packages]

[index.packages.cleaver]

[index.packages.cleaver.versions]

[index.packages.cleaver.versions."2.0.0"]
requires = ["unrelated-dep==1; sys_platform == 'linux'", "unrelated-dep==2; sys_platform != 'linux'", "reject-cleaver-2"]

[index.packages.cleaver.versions."1.0.0"]
requires = ["foo==1; sys_platform == 'linux'", "bar==1; sys_platform != 'linux'"]

[index.packages.reject-cleaver-2]

[index.packages.reject-cleaver-2.versions]

[index.packages.reject-cleaver-2.versions."1.0.0"]
requires = ["unrelated-dep==3"]

[index.packages.unrelated-dep]

[index.packages.unrelated-dep.versions]

[index.packages.unrelated-dep.versions."1.0.0"]

[index.packages.unrelated-dep.versions."2.0.0"]

[index.packages.unrelated-dep.versions."3.0.0"]

[index.packages.foo]

[index.packages.foo.versions]

[index.packages.foo.versions."1.0.0"]

[index.packages.foo.versions."2.0.0"]

[index.packages.bar]

