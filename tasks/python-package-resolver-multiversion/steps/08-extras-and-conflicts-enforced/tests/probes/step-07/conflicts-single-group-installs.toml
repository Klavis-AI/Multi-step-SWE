id = "conflicts-single-group-installs"
step = 7
group = "conflicts-declaration"
python = "3.12"
mode = "bare"
argv = ["sync", "--group", "g2"]
observe = ["status", "glob:.venv/lib/python3.12/site-packages/*.dist-info"]
[env]
UV_INDEX_URL = "{INDEX}"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
g1 = ["a==1.0.0"]
g2 = ["a==2.0.0"]

[tool.uv]
package = false
conflicts = [[{ group = "g1" }, { group = "g2" }]]
"""
[index.packages.a.versions."1.0.0"]
[index.packages.a.versions."2.0.0"]
