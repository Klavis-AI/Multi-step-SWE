id = "lock-tree-universal-shows-both-forks"
step = 7
group = "lock-fork-markers"
mode = "bare"
setup_argv = [["lock"]]
argv = ["tree", "--universal", "--frozen"]
observe = ["status", "stdout"]
[env]
UV_INDEX_URL = "{INDEX}"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["a"]

[tool.uv]
package = false
"""
[index.packages.a.versions."1.0.0"]
requires_python = ">=3.9"
[index.packages.a.versions."2.0.0"]
requires_python = ">=3.12"
