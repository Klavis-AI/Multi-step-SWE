# The dependencies of a non-packaged project are still installed; only the
# project itself is skipped.  The installed set is exactly `a`.
id = "s05-sync-no-build-system-deps-only"
step = 5
group = "project-packaging-default"
python = "3.12"
mode = "bare"
argv = ["sync"]
observe = ["status", "freeze", "glob:.venv/lib/python*/site-packages/*.dist-info"]

[env]
UV_INDEX_URL = "{INDEX}"

[files]
"pyproject.toml" = '''
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["a"]
'''

[index.packages.a.versions."1.0.0"]
