id = "marker-python-version-old"
step = 1
group = "marker-evaluation"
python = "3.9"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "mkroot"]
observe = ["status", "freeze"]

[index.packages.mkroot.versions."1.0.0"]
requires = [
  "oldbranch; python_version < '3.10'",
  "newbranch; python_version >= '3.10'",
]
[index.packages.oldbranch.versions."1.0.0"]
[index.packages.newbranch.versions."1.0.0"]
