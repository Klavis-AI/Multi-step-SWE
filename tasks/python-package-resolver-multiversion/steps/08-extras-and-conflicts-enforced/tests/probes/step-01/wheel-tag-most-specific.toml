id = "wheel-tag-most-specific"
step = 1
group = "wheel-selection"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "tagpkg"]
observe = [
  "status",
  "freeze",
  "file:.venv/lib/python3.12/site-packages/tagpkg-1.0.0.dist-info/WHEEL",
]

[index.packages.tagpkg.versions."1.0.0"]
sdist = false
wheel_tags = ["py3-none-any", "cp312-cp312-manylinux_2_17_x86_64"]
