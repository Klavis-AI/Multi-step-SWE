# `--group` selects a PEP 735 dependency group on the command line.
id = "sync-group-flag"
step = 6
group = "groups-table-selection"
python = "3.12"
mode = "venv"
timeout = 300
argv = ["sync", "--group", "docs"]
observe = ["status", "freeze"]
[env]
UV_INDEX_URL = "{INDEX}"
UV_NO_CACHE = "1"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
docs = ["a"]
"""
[index.packages.a.versions."1.0.0"]
