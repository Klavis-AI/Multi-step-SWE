# `.python-version` is discovered in parent directories from 0.5.0 on.
id = "pyversion-parent-dir"
step = 6
group = "python-version-parent-discovery"
python = "3.12"
mode = "bare"
argv = ["--directory", "child", "venv"]
observe = ["status", "glob:child/.venv/lib/python*"]
[files]
".python-version" = "3.11\n"
"child/keep.txt" = "x\n"
