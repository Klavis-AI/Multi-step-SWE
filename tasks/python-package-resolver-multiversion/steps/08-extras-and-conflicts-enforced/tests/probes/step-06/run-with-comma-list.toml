# `uv run --with` accepts a comma-delimited list of requirements.
id = "run-with-comma-list"
step = 6
group = "run-interface-additions"
python = "3.12"
mode = "venv"
timeout = 300
argv = ["run", "--no-project", "--index-url", "{INDEX}", "--no-cache", "--with", "a,b", "python", "-c", "import a, b; print('ok')"]
observe = ["status", "stdout"]
[index.packages.a.versions."1.0.0"]
[index.packages.b.versions."1.0.0"]
