id = "s02-compile-constraint-prerelease"
step = 2
group = "constraints-file-semantics"
python = "3.12"
mode = "bare"
argv = ["pip", "compile", "--no-header", "-c", "constraints.txt", "requirements.in"]
observe = ["status", "pinset"]
[env]
UV_INDEX_URL = "{INDEX}"
[files]
"requirements.in" = """
a
"""
"constraints.txt" = """
a==1.0.0b1
"""
[index.packages.a.versions."1.0.0b1"]
[index.packages.a.versions."0.9.0"]
