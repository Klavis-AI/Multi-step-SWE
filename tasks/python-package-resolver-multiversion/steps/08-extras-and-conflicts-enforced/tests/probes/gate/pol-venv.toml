# found on PATH, and it has the layout the rest of the chain depends on.
id = "pol-venv"
step = 0
group = "proof-of-life"
python = "3.12"
mode = "bare"
argv = ["venv", "env"]
observe = ["status", "glob:env/pyvenv.cfg", "glob:env/bin/python3"]
