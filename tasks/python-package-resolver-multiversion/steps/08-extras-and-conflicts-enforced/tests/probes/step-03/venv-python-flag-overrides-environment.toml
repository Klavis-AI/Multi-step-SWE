id = "venv-python-flag-overrides-environment"
step = 3
group = "interpreter-search-continues"
mode = "bare"
argv = ["venv", "--python", "cpython@3.10", ".venv"]
observe = ["status", "glob:.venv/lib/python3.*"]

[env]
UV_PYTHON = "cpython@3.12"
PATH = "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin:{PYROOT}/cpython-3.10-linux-x86_64-gnu/bin:/usr/bin:/bin"
