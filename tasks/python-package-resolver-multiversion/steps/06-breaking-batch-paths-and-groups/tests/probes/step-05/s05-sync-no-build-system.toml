# A hand-written project with no [build-system] is no longer built and
# installed into its own environment, so `uv sync` has nothing to build and
# succeeds offline.  Before 0.4.0 the project was installed with the legacy
# setuptools backend, which cannot be fetched with the network disabled.
id = "s05-sync-no-build-system"
step = 5
group = "project-packaging-default"
python = "3.12"
mode = "bare"
argv = ["sync", "--offline"]
observe = ["status"]

[files]
"pyproject.toml" = '''
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []
'''
