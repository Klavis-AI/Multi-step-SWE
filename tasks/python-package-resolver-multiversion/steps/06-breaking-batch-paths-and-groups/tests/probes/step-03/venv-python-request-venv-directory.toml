id = "venv-python-request-venv-directory"
step = 3
group = "python-request-path"
mode = "bare"
setup_argv = [["venv", "--python", "3.10", "other"]]
argv = ["venv", "--python", "./other", ".venv"]
observe = ["status", "glob:.venv/lib/python3.*"]

[env]
PATH = "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin:{PYROOT}/cpython-3.10-linux-x86_64-gnu/bin:/usr/bin:/bin"
