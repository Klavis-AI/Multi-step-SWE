id = "index-core-metadata-install"
step = 3
group = "detached-metadata-attribute"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "itop"]
observe = ["status", "freeze"]

[index.packages.itop.versions."1.0.0"]
requires = ["iwheelonly==1.0.0"]
detached_requires = ["isidecar==1.0.0"]
metadata_attribute = "core-metadata"
[index.packages.iwheelonly.versions."1.0.0"]
[index.packages.isidecar.versions."1.0.0"]
