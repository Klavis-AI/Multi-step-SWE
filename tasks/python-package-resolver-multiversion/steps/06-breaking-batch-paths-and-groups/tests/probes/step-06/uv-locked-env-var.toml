# `UV_LOCKED` is the environment spelling of `--locked`: set to `1`, `uv lock`
# refuses to run against a project that has no lockfile.  Only the lockfile's
# absence is recorded, since a later release reshuffles the exit status.
id = "uv-locked-env-var"
step = 6
group = "global-options"
python = "3.12"
mode = "bare"
timeout = 300
argv = ["lock"]
observe = ["status", "glob:uv.lock"]
[env]
UV_LOCKED = "1"
UV_INDEX_URL = "{INDEX}"
UV_NO_CACHE = "1"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["a"]
"""
[index.packages.a.versions."1.0.0"]
