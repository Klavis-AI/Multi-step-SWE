# `--allow-insecure-host` takes a value and may be given more than once; both
# spellings are accepted by a command that then installs over the index.
id = "global-allow-insecure-host-repeated"
step = 6
group = "global-options"
python = "3.12"
mode = "venv"
timeout = 300
argv = ["--allow-insecure-host", "127.0.0.1", "--allow-insecure-host", "127.0.0.1",
        "pip", "install", "--index-url", "{INDEX}", "--no-cache", "a"]
observe = ["status", "freeze"]
[index.packages.a.versions."1.0.0"]
