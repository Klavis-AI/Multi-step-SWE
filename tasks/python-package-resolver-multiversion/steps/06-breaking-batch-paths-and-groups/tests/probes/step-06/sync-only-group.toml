# PEP 735 dependency groups: `--only-group` installs that group and nothing
# else, so the project's own dependency is not installed.
id = "sync-only-group"
step = 6
group = "groups-table-selection"
python = "3.12"
mode = "venv"
timeout = 300
argv = ["sync", "--only-group", "obs"]
observe = ["status", "freeze"]
[env]
UV_INDEX_URL = "{INDEX}"
UV_NO_CACHE = "1"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["b"]

[dependency-groups]
obs = ["a"]
"""
[index.packages.a.versions."1.0.0"]
[index.packages.b.versions."1.0.0"]
