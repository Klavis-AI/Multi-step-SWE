# `uv export --no-header` suppresses the generated-by banner.
id = "export-no-header"
step = 6
group = "export-interface"
python = "3.12"
mode = "bare"
timeout = 300
argv = ["export", "--no-header", "-o", "out.txt"]
observe = ["status", "exists:out.txt"]
[env]
UV_INDEX_URL = "{INDEX}"
UV_NO_CACHE = "1"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["a"]
"""
[index.packages.a.versions."1.0.0"]
