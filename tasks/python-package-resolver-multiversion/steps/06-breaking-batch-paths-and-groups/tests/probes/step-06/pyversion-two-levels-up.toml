# The `.python-version` search ascends more than one level: the file sits two
# directories above the `--directory` target and still supplies the request,
# so the environment is created for the version the grandparent asks for.
id = "pyversion-two-levels-up"
step = 6
group = "python-version-parent-discovery"
python = "3.12"
mode = "bare"
timeout = 300
argv = ["--directory", "a/b", "venv"]
observe = ["glob:a/b/.venv/lib/python*"]
[files]
".python-version" = "3.11\n"
"a/b/keep.txt" = "x\n"
