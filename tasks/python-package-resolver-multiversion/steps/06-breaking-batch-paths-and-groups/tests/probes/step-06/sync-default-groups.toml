# PEP 735 dependency groups: `default-groups` selects which groups `uv sync`
# installs without being asked.
id = "sync-default-groups"
step = 6
group = "groups-table-selection"
python = "3.12"
mode = "venv"
timeout = 300
argv = ["sync"]
observe = ["status", "freeze"]
[env]
UV_INDEX_URL = "{INDEX}"
UV_NO_CACHE = "1"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
extra = ["a"]

[tool.uv]
default-groups = ["extra"]
"""
[index.packages.a.versions."1.0.0"]
