# PEP 735 dependency groups: `--no-group` removes a group that would otherwise
# be installed, so a bare project keeps its own dependency and drops the group.
id = "sync-no-group"
step = 6
group = "groups-table-selection"
python = "3.12"
mode = "venv"
timeout = 300
argv = ["sync", "--no-group", "dev"]
observe = ["status", "freeze"]
[env]
UV_INDEX_URL = "{INDEX}"
UV_NO_CACHE = "1"
[files]
"pyproject.toml" = """
[project]
name = "proj"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["b"]

[dependency-groups]
dev = ["a"]
"""
[index.packages.a.versions."1.0.0"]
[index.packages.b.versions."1.0.0"]
