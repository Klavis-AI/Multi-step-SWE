# The same rule seen through `uv pip compile`.
id = "not-equals-no-prerelease-compile"
step = 6
group = "prerelease-not-equals"
python = "3.12"
mode = "bare"
argv = ["pip", "compile", "--index-url", "{INDEX}", "--no-cache", "--no-header", "--no-annotate", "-o", "out.txt", "reqs.in"]
observe = ["status", "file:out.txt"]
[files]
"reqs.in" = "a != 2.0.0a1\n"
[index.packages.a.versions."1.0.0"]
[index.packages.a.versions."3.0.0a1"]
