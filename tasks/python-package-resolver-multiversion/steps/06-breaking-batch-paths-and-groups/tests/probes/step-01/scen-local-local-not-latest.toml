# packse scenario 'local-not-latest'
id = "scen-local-local-not-latest"
step = 1
group = "scenario-local"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--no-cache", "--index-url", "{INDEX}", "a>=1"]
observe = ["status", "freeze"]

[index]

[index.packages]

[index.packages.a]

[index.packages.a.versions]

[index.packages.a.versions."1.2.3"]
wheel_tags = ["py3-any-macosx_10_0_ppc64"]
sdist = false

[index.packages.a.versions."1.2.2+foo"]
wheel_tags = ["py3-any-macosx_10_0_ppc64"]
sdist = false

[index.packages.a.versions."1.2.1+foo"]
sdist = true
