# packse scenario 'requires-python-wheels'
id = "scen-tag-and-markers-requires-python-wheels"
step = 4
group = "scenario-tag-and-markers"
python = "3.12"
mode = "bare"
argv = ["lock", "--index-url", "{INDEX}", "--python", "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin/python3.12"]
observe = ["status", "lockset"]

[files]
"pyproject.toml" = '''
[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "a==1.0.0"
]
'''

[index]

[index.packages]

[index.packages.a]

[index.packages.a.versions]

[index.packages.a.versions."1.0.0"]
wheel_tags = ["cp311-cp311-any", "cp310-cp310-any", "cp39-cp39-any"]
