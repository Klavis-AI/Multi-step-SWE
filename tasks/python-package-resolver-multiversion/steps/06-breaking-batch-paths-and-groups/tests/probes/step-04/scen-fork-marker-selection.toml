# packse scenario 'fork-marker-selection'
id = "scen-fork-marker-selection"
step = 4
group = "scenario-fork"
python = "3.12"
mode = "bare"
argv = ["lock", "--index-url", "{INDEX}", "--python", "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin/python3.12"]
observe = ["status", "lockset"]

[files]
"pyproject.toml" = '''
[project]
name = "project"
version = "0.1.0"
dependencies = [
  "a",
  "b>=2 ; sys_platform == 'linux'",
  "b<2 ; sys_platform == 'darwin'"
]
'''

[index]

[index.packages]

[index.packages.a]

[index.packages.a.versions]

[index.packages.a.versions."0.1.0"]

[index.packages.a.versions."0.2.0"]
requires = ["b>=2.0.0"]

[index.packages.b]

[index.packages.b.versions]

[index.packages.b.versions."1.0.0"]

[index.packages.b.versions."2.0.0"]
