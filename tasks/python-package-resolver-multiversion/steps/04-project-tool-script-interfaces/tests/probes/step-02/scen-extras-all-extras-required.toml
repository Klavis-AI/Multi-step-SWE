# packse scenario 'all-extras-required'
id = "scen-extras-all-extras-required"
step = 2
group = "scenario-extras"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--no-cache", "--index-url", "{INDEX}", "a[all]"]
observe = ["status", "freeze"]

[index]

[index.packages]

[index.packages.b]

[index.packages.b.versions]

[index.packages.b.versions."1.0.0"]

[index.packages.c]

[index.packages.c.versions]

[index.packages.c.versions."1.0.0"]

[index.packages.a]

[index.packages.a.versions]

[index.packages.a.versions."1.0.0"]

[index.packages.a.versions."1.0.0".extras]
all = ["a[extra_b]", "a[extra_c]"]
extra_b = ["b"]
extra_c = ["c"]
