id = "wheel-tag-incompatible-falls-back-to-sdist"
step = 1
group = "wheel-selection"
python = "3.12"
mode = "venv"
argv = ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "fallbackpkg"]
observe = [
  "status",
  "freeze",
  "file:.venv/lib/python3.12/site-packages/fallbackpkg-1.0.0.dist-info/WHEEL",
]

[index.packages.fallbackpkg.versions."1.0.0"]
sdist = true
wheel_tags = ["cp39-cp39-manylinux_2_17_x86_64"]
