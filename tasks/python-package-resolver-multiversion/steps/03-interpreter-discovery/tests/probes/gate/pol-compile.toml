# Proof of life: the compile path produces a lock artefact on disk. Only the
# file's existence is recorded; its header text is reworded across the chain.
id = "pol-compile"
step = 0
group = "proof-of-life"
python = "3.12"
mode = "bare"
argv = ["pip", "compile", "requirements.in", "--index-url", "{INDEX}", "-o", "out.txt"]
observe = ["status", "glob:out.txt"]

[files]
"requirements.in" = "polpkg\n"

[index.packages.polpkg.versions."1.0.0"]
sdist = false
