# PEP 714 renamed the detached-metadata attribute and tells clients to accept
# both spellings; `/app/SPECS/specs/pep-0714.rst` enters at this milestone and
# `SPECS/MAP.md` row 03 names that rename. This probe serves the *older*
# spelling alone, so only a client that still reads it (and resolves from the
# sidecar it advertises -- `detached_requires` names `gamma`, which the wheel's
# own `METADATA` does not) passes.
id = "index-legacy-dist-info-metadata"
step = 3
group = "detached-metadata-attribute"
python = "3.12"
mode = "venv"
argv = ["pip", "compile", "--index-url", "{INDEX}", "--no-cache", "--no-header", "--no-annotate", "-o", "out.txt", "req.in"]
observe = ["status", "file:out.txt"]

[files]
"req.in" = """
alpha
"""

[index.packages.alpha.versions."1.0.0"]
requires = ["beta==1.0.0"]
detached_requires = ["gamma==1.0.0"]
metadata_attribute = "dist-info-metadata"
[index.packages.beta.versions."1.0.0"]
[index.packages.gamma.versions."1.0.0"]
