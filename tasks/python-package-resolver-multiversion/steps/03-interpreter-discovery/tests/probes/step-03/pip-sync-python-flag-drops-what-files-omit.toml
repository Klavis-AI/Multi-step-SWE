id = "pip-sync-python-flag-drops-what-files-omit"
step = 3
group = "pip-python-selection"
mode = "venv"
setup_argv = [
  ["venv", "--python", "3.10", "target"],
  ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "--python", "./target", "leaf"],
]
argv = ["pip", "sync", "--index-url", "{INDEX}", "--no-cache", "--python", "./target", "req.txt"]
observe = ["status", "glob:target/lib/python3.10/site-packages/*.dist-info", "glob:.venv/lib/python3.12/site-packages/*.dist-info"]

[env]
PATH = "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin:{PYROOT}/cpython-3.10-linux-x86_64-gnu/bin:/usr/bin:/bin"

[files]
"req.txt" = """
other==1.0.0
"""

[index.packages.leaf.versions."1.0.0"]
[index.packages.other.versions."1.0.0"]
