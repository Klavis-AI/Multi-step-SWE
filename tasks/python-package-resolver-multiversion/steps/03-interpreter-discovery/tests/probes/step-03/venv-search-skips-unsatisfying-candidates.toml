id = "venv-search-skips-unsatisfying-candidates"
step = 3
group = "interpreter-search-continues"
mode = "bare"
argv = ["venv", "--python", "cpython@3.9", ".venv"]
observe = ["status", "glob:.venv/lib/python3.*"]

[env]
PATH = "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin:{PYROOT}/cpython-3.11-linux-x86_64-gnu/bin:{PYROOT}/cpython-3.10-linux-x86_64-gnu/bin:{PYROOT}/cpython-3.9-linux-x86_64-gnu/bin:/usr/bin:/bin"
