id = "venv-search-continues-past-broken-installation"
step = 3
group = "interpreter-search-continues"
mode = "bare"
argv = ["venv", "--python", "cpython@3.10", ".venv"]
observe = ["status", "glob:.venv/lib/python3.*"]
exec_files = ["broken/bin/python3.10"]

[env]
PATH = "{WORK}/broken/bin:{PYROOT}/cpython-3.10-linux-x86_64-gnu/bin:/usr/bin:/bin"

[files]
"broken/bin/python3.10" = "#!/bin/sh\necho 'not a working interpreter' >&2\nexit 127\n"
"broken/lib/python3.10/os.py" = ""
