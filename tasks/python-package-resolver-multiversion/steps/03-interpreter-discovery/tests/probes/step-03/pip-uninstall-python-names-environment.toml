id = "pip-uninstall-python-names-environment"
step = 3
group = "pip-python-selection"
mode = "bare"
setup_argv = [
  ["venv", "--python", "3.10", "target"],
  ["pip", "install", "--index-url", "{INDEX}", "--no-cache", "--python", "./target", "alpha", "beta"],
]
argv = ["pip", "uninstall", "--no-cache", "--python", "./target", "alpha"]
observe = ["status", "glob:target/lib/python3.10/site-packages/*.dist-info", "glob:.venv/lib/python3.12/site-packages/*.dist-info"]

[env]
PATH = "{PYROOT}/cpython-3.12-linux-x86_64-gnu/bin:{PYROOT}/cpython-3.10-linux-x86_64-gnu/bin:/usr/bin:/bin"

[index.packages.alpha.versions."1.0.0"]
[index.packages.beta.versions."1.4.0"]
