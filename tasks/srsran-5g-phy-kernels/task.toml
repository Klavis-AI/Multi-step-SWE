schema_version = "1.4"

# Trial reward = the mean of each step's `reward`. A step's reward is
# `correctness x mean_f( ln(max(1, speedup_f)) )` over the functions in its
# scope -- i.e. correctness x ln(geometric mean of the per-function speedups).
# Correctness is binary and multiplies, so a tree that changes behaviour scores
# 0 however fast it is; a correct but unimproved tree scores 0 too.
multi_step_reward_strategy = "mean"

# The verifier grades a copy of the cumulative /app worktree. `build` is the
# tree's own build directory: the verifier rebuilds from source, in its own
# container, with its own known flags, so shipping compiled objects would only
# be a way for a candidate to influence the reference. The pattern is a path
# component at any depth, and the srsRAN source tree contains no directory of
# that name -- checked, not assumed.
artifacts = [
  { source = "/app", destination = "workspace", exclude = ["build"] },
]

[task]
name = "harbor/srsran-5g-phy-kernels"
version = "1.0.0"
description = "Optimize the srsRAN Project 5G NR physical-layer DSP kernels one kernel at a time. Cumulative steps, each rewarded by the measured per-function speedup of the implementation the library installs, gated on byte-identical output."
authors = [{ name = "Klavis AI", email = "connect@klavis.ai" }]
keywords = ["performance", "optimization", "simd", "5g", "srsran", "multi-step"]

[metadata]
difficulty = "very hard"
category = "programming"
tags = ["performance-optimization", "multi-step", "c++", "simd", "signal-processing"]

[environment]
# Clones the pinned upstream tree, strips every stage of the ladder, and
# prebuilds it, so the agent's first rebuild is incremental.
build_timeout_sec = 2700.0
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0
mcp_servers = []
workdir = "/app"
network_mode = "public"

[verifier]
environment_mode = "separate"

# The verifier builds this step's base tree, the candidate tree, and -- for the
# non-regression gate -- the candidate's tree with this step's stage reverted.
# cpus must stay >= 2 because every measurement pins to cores 0,1.
[verifier.environment]
build_timeout_sec = 2700.0
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 0
workdir = "/app"
network_mode = "public"

# The verifier ceiling is the sum of what test.sh can legitimately reach in its
# worst case: two full builds of the srsRAN tree at -j4 plus a third (reverted)
# incremental build, the project's own ctest run, and 32 per-function harness
# invocations at 301 repetitions each on a host that may be loaded. Measured on
# the authoring host: a cold tree build is ~7 minutes, an incremental one under
# a minute, the full per-function sweep ~3 minutes. 5400 s leaves slack for the
# shared host without ever being reachable by a correct solution.

[[steps]]
name = "01-ldpc-encode"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 5400.0

[[steps]]
name = "02-ldpc-rate-dematch"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 5400.0

[[steps]]
name = "03-ldpc-decode"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 5400.0

[[steps]]
name = "04-precode"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 5400.0

[[steps]]
name = "05-demodulate"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 5400.0

[[steps]]
name = "06-ofh-compression"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 5400.0

[agent]
# The agent's work runs against an allowlist: only the inference endpoint is
# reachable at the network layer, so an upstream copy cannot be fetched by any
# route -- git, release tarball, package registry or docs mirror. The runner
# merges its own model host in at launch, so no host is pinned here.
network_mode = "allowlist"
