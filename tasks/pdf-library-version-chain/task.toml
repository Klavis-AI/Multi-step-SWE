schema_version = "1.4"

# Trial reward = the mean of each step's `reward`. No min_reward gate, so every
# step runs and each verifier reports a step-local score.
multi_step_reward_strategy = "mean"

# The cumulative /app workspace is the only thing that reaches the verifier
# container. Nothing is excluded: the utilities are rebuilt from source with
# `make` inside the verifier image, which is also what stops a candidate from
# being graded by a binary it linked against a real PDF library.
artifacts = [
  { source = "/app", destination = "workspace", exclude = [] },
]

[task]
name = "harbor/pdf-library-version-chain"
version = "1.0.0"
description = "Eight-step PDF task: carry one PDF parser, writer, renderer and validator written in C from PDF 1.3 through PDF 2.0, PDF/A and PDF/UA, keeping every earlier construct readable."
authors = [{ name = "Klavis AI", email = "connect@klavis.ai" }]
keywords = ["pdf", "iso-32000", "pdf-a", "pdf-ua", "parser", "rasterizer", "multi-step"]

[metadata]
difficulty = "very hard"
category = "programming"
tags = ["pdf", "iso-32000", "veraPDF", "poppler", "qpdf", "multi-step", "c"]

[environment]
build_timeout_sec = 2400.0
cpus = 7
memory_mb = 16384
storage_mb = 20480
gpus = 0
mcp_servers = []
workdir = "/app"
# Public only for image setup: Harbor installs the agent harness under this
# baseline. The agent phase has no network; see [agent].
network_mode = "public"

[verifier]
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 3600.0
cpus = 7
memory_mb = 16384
storage_mb = 30720
gpus = 0
workdir = "/app"
# public, and NOT "no-network": GKE rejects no-network outside compose mode, and the
# task then aborts with reward.json/groups.txt/ran.txt all absent while still printing
# a mean that reads like a scored zero. A Makefile recipe that fetches a prebuilt
# engine is caught in the verifier instead, by scanning the BUILT BINARIES for
# third-party engine signatures, since a fetched engine never appears in /app as source.
network_mode = "public"

# No network while the agent works (the oracle's solve.sh runs in this phase
# too): everything a solution needs is installed in environment/Dockerfile.
# Runs must let the agent reach its model API: `--allow-agent-host <api host>`.
[agent]
network_mode = "no-network"

[[steps]]
name = "01-pdf13-core"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "02-pdf14-transparency"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "03-pdf15-objstm"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "04-pdf16-17-crypto-forms"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0


[[steps]]
name = "05-pdf20"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0


[[steps]]
name = "06-pdfa1-pdfa2"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "07-pdfa3-a4-ua"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "08-raster-linearize"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0
