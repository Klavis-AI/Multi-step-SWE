# Rails 4.1 introduced this file and 4.2 reads `secret_key_base` from it.  It
# replaces config/initializers/secret_token.rb, which assigned
# `config.secret_key_base` by hand and raised its own error when the production
# environment had no SECRET_TOKEN -- Rails raises that error itself now.
#
# The production key is still taken from SECRET_TOKEN, so an existing
# deployment keeps signing cookies with the key it already has: the migration
# moves where the key is read, not which key it is.

development:
  secret_key_base: 0d0e0f4f6b9a4c2f8e1d7a3b5c9e2f4a6b8d0c2e4f6a8b0d2e4f6a8c0e2d4f6b8a0c2e4d6f8b0a2c4e6d8f0b2a4c6e8d0f2b4a6c8e0d2f4b6a8c0e2d4f6b8a0c2e

test:
  secret_key_base: 4a7c1e9b3d5f7a9c1e3b5d7f9a1c3e5b7d9f1a3c5e7b9d1f3a5c7e9b1d3f5a7c9e1b3d5f7a9c1e3b5d7f9a1c3e5b7d9f1a3c5e7b9d1f3a5c7e9b1d3f5a7c9e1b3d

production:
  secret_key_base: <%= ENV["SECRET_TOKEN"] %>
