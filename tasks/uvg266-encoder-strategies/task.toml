schema_version = "1.4"

# Trial reward = the mean of each step's `reward`.  A step's reward is
# `correctness x mean_f( ln(max(1, speedup_f)) )` over the functions in its
# scope -- i.e. correctness x ln(geometric mean of the per-function speedups).
# Correctness is binary and multiplies, so a tree that changes behaviour scores
# 0 however fast it is; a correct but unimproved tree scores 0 too.  The value
# is unbounded above: 5x across a step's functions is ln(5) = 1.609.
multi_step_reward_strategy = "mean"

artifacts = [
  { source = "/app", destination = "workspace", exclude = ["build", ".git"] },
]

[task]
name = "harbor/uvg266-encoder-strategies"
version = "1.0.0"
description = "Optimize the uvg266 VVC encoder's strategy registry one family at a time, against upstream's own portable C reference. Cumulative steps, each measured by per-function speedup gated on a byte-identical bitstream."
authors = [{ name = "Klavis AI", email = "connect@klavis.ai" }]
keywords = ["performance", "optimization", "simd", "codec", "vvc", "multi-step"]

[metadata]
difficulty = "very hard"
category = "programming"
tags = ["performance-optimization", "multi-step", "c", "simd", "codec"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
mcp_servers = []
workdir = "/app"
network_mode = "public"

[verifier]
environment_mode = "separate"

# The verifier builds this step's base from the pin when the image is built,
# and the candidate at grade time, then times both.  cpus must stay >= 2
# because the measurement pins to cores 0 and 1.
[verifier.environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
workdir = "/app"
network_mode = "public"

[[steps]]
name = "01-transforms"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "02-block-cost"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "03-intra-prediction"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "04-motion-compensation"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "05-quantisation"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[[steps]]
name = "06-loop-filter"
[steps.agent]
timeout_sec = 7200.0
[steps.verifier]
timeout_sec = 3600.0

[agent]
# The agent's work runs against an allowlist: only the inference endpoint is
# reachable at the network layer, so an upstream copy cannot be fetched by any
# route -- git, release tarball, package registry or docs mirror. The runner
# merges its own model host in at launch, so no host is pinned here.
network_mode = "allowlist"
